alia's health",inc:["What does the data show?","What is healthy ageing?","Opportunities and challenges of an ageing population","Current and future strategies to support healthy ageing","What must government and non-government agencies consider with a growing and ageing population?"],big:"An ageing population is a success story, not a crisis. The challenge is making sure the extra years are healthy, connected and well supported.",notes:[["What the data shows","About **17% of Australians are aged 65 and over** (\u22484.4 million), and this is projected to reach about **22\u201323% by 2066**. The number aged **85+ is growing fastest**. Older Australians are living longer and in better health than earlier generations. Most rate their health as good to excellent. However, older age brings higher rates of chronic disease, multimorbidity, dementia (the leading cause of death for women), falls, sensory loss and a greater need for health and aged care. People aged 65+ account for a large share of hospital use and PBS spending."],["What healthy ageing is","The World Health Organization defines **healthy ageing** as 'the process of developing and maintaining the functional ability that enables wellbeing in older age'. It is not just the absence of disease. It means older people can meet their basic needs, keep learning and making decisions, stay mobile, build relationships and contribute to society. Physical activity (including strength and balance training), social connection, good nutrition, lifelong learning and age-friendly environments all support it."],["Opportunities","Older people are a **resource**. They volunteer (contributing billions of dollars in unpaid work), provide grandparent childcare, carry knowledge and experience, keep working longer, and drive a growing 'silver economy'. For example, about a quarter of older Australians volunteer."],["Challenges","**Health system demand:** more chronic disease and complex care. **Aged care:** the 2021 Royal Commission found substandard care and neglect. **Workforce:** shortages of carers, nurses and GPs. **Carers:** many are unpaid family members, often older women themselves. **Economic pressure:** a smaller tax base relative to the number of retirees (the Intergenerational Report). **Social:** isolation, loneliness and elder abuse."],["Strategies, now and future","Current: My Aged Care, the Home Care Packages program and the new Support at Home program, the new Aged Care Act (2024) and its rights-based approach, Healthy Ageing grants, falls prevention programs, the National Dementia Strategy, superannuation and the Age Pension. Future planning must consider workforce growth, **ageing in place** (support at home rather than residential care), digital health and telehealth for older people, age-friendly cities (links to SDG 11), and prevention across the whole life course, because the healthy ageing of tomorrow's 70-year-olds starts with today's teenagers."]],con:[["Healthy ageing","Developing and maintaining the functional ability that enables wellbeing in older age (WHO).","A 78-year-old who walks daily, volunteers and lives independently"],["Ageing in place","Supporting older people to stay living safely at home and in their community.","Home Care Packages, home modifications"],["Multimorbidity","Living with two or more chronic conditions at the same time.","Arthritis + diabetes + heart disease"],["Dependency ratio","The number of people not of working age compared with the number of working age, which affects funding.","Fewer taxpayers for each retiree"]],sum:["\u224817% of Australians are 65+, rising to \u224822\u201323% by 2066; the 85+ group is growing fastest.","Healthy ageing (WHO) means maintaining functional ability for wellbeing, not just avoiding disease.","Opportunities: volunteering, caring, knowledge and experience, extended working lives, the economy.","Challenges: chronic disease, demand on aged care, workforce shortages, carer burden, cost, isolation.","Strategies: Support at Home, the new Aged Care Act, falls prevention, dementia strategy, ageing in place, age-friendly cities."],tip:"'Investigate' means plan, inquire into and draw conclusions. Balance challenges AND opportunities, and finish with a judgement about what agencies must prioritise.",reel:["h:By 2066, almost *1 in 4* Australians will be over 65. Problem or opportunity?","s:17%|of Australians are aged 65+ today","p:Healthy ageing|Not 'no disease'. It's keeping the ability to do what you value.","c:Opportunities|Volunteering;Childcare;Experience||Challenges|Chronic disease;Aged care;Workforce","l:Strategies|Ageing in place;Falls prevention;Dementia strategy;Age-friendly cities","p:Plan ahead|Agencies must think about workforce, funding, carers and digital access.","r:Data \u2192 Healthy ageing \u2192 Opp vs Challenge \u2192 Strategy"],mcq:[["According to the WHO, healthy ageing is best described as:",["Living to 100 years","Having no chronic diseases","Maintaining functional ability that enables wellbeing","Living in residential aged care"],2,"WHO focuses on functional ability, not the absence of disease."],["Which is an OPPORTUNITY of an ageing population?",["Increased demand for aged care beds","Increased volunteering and grandparent childcare","Workforce shortages in nursing","Rising PBS costs"],1,"Older people contribute a great deal through volunteering and unpaid care."],["'Ageing in place' refers to:",["Moving older people to residential care early","Supporting older people to live at home in their community","Older people working past 70","Retirement villages only"],1,"Ageing in place keeps people at home with support, which is usually preferred and less costly."]],sa:{q:"Investigate the challenges AND opportunities that an ageing population presents for the Australian health system.",m:8,c:[["7\u20138","Comprehensive investigation of both challenges and opportunities; uses relevant data; draws a clear, supported conclusion"],["5\u20136","Explains challenges and opportunities with some data/examples"],["3\u20134","Describes challenges and/or opportunities"],["1\u20132","Identifies features of an ageing population"]],pts:["Data: \u224817% 65+, rising to \u224822\u201323%; 85+ fastest growing","Challenges: chronic disease/multimorbidity, aged care demand, workforce, carers, cost","Opportunities: volunteering, childcare, knowledge, silver economy, longer working lives","Strategies: Support at Home, Aged Care Act, falls prevention, dementia","Conclusion/judgement about planning priorities"]}},h6:{fa:"fa1",iq:1,v:"Assess",t:"Assess the effectiveness of the healthcare system in Australia",inc:["The role of the healthcare system","Equity of access","Future opportunities"],big:"Australia's system delivers good outcomes at reasonable cost, but access is not equal. Your job in an 'assess' answer is to weigh strengths against weaknesses and make a judgement.",notes:[["The role of the system","The healthcare system aims to **promote health, prevent illness, diagnose and treat disease, rehabilitate and provide palliative care**. It runs on two levels. **Primary care** (GPs, pharmacists, allied health, community health) is the first point of contact. **Secondary and tertiary care** (specialists and hospitals) follows. It is a **mixed public-private system**: Medicare provides universal coverage, while private health insurance adds choice."],["Strengths","Universal access through **Medicare** (since 1984) and subsidised medicines through the **PBS**. High life expectancy and good cancer survival. Australia's system is regularly ranked among the best performing in the world (e.g. Commonwealth Fund comparisons put it near the top for health outcomes and equity). Health spending of about **10% of GDP** is moderate by OECD standards, and public hospital treatment is free."],["Weaknesses: equity of access","Access is **not equal**. There are long **elective surgery waiting times** in public hospitals, falling **bulk billing** rates that bring out-of-pocket costs (\u22481 in 3 people delay seeing a GP or specialist because of cost in some surveys), **dental care** that sits mostly outside Medicare, and a shortage of mental health services. There are fewer doctors in rural and remote areas, and First Nations peoples face barriers of cultural safety. The system is **fragmented**: the Commonwealth funds GPs, the states run hospitals, and patients fall through the gaps between them. It remains weighted towards treatment rather than prevention, which gets only \u22482% of spending."],["Future opportunities","Strengthening primary care (**Medicare Urgent Care Clinics**, triple bulk-billing incentives, MyMedicare voluntary patient registration), **digital health** (telehealth, My Health Record, e-prescriptions), expanding pharmacist and nurse practitioner roles, rural workforce incentives, greater investment in prevention (National Preventive Health Strategy target: 5% of spending by 2030) and person-centred models of care."]],con:[["Effectiveness","How well the system achieves its goals: outcomes, access, efficiency and equity.","High life expectancy, but long waiting lists"],["Equity of access","Everyone can access the care they need regardless of income, location or background.","Bulk billing improves access for low-income patients"],["Primary care","The first point of contact with the health system, in the community.","GP, pharmacist, community health centre"],["Out-of-pocket costs","Costs paid by the patient that are not covered by Medicare or insurance.","Specialist gap fees, dental care"]],sum:["The system's role covers promotion, prevention, treatment, rehabilitation and palliation, delivered through primary \u2192 secondary \u2192 tertiary care.","Strengths: universal Medicare + PBS, strong outcomes, moderate cost (\u224810% of GDP), free public hospitals.","Weaknesses: waiting lists, falling bulk billing, out-of-pocket costs, dental gaps, a rural workforce shortage, fragmentation.","Prevention gets only \u22482% of spending, so the system is weighted towards treatment.","Future: Urgent Care Clinics, bulk-billing incentives, digital health, a bigger role for pharmacists and nurse practitioners."],tip:"'Assess' needs a JUDGEMENT. Open with a clear position (e.g. 'largely effective but inequitable'), weigh the evidence on both sides, then return to the judgement in your conclusion.",reel:["h:Is our healthcare system actually *good*? Let's assess it.","p:The role|Promote health, prevent and treat illness, rehabilitate, and care at end of life.","c:Strengths|Medicare;PBS;High life expectancy||Weaknesses|Waiting lists;Out-of-pocket costs;Rural gaps","s:\u22482%|of health spending goes to prevention","l:Future fixes|Urgent Care Clinics;Bulk billing incentives;Telehealth;Prevention funding","p:Judgement|Effective overall, but not yet equitable for everyone.","r:Assess = weigh it up + make a CALL"],mcq:[["Which best describes Australia's healthcare system?",["Fully private","Fully public","A mixed public-private system with universal coverage","Insurance-only"],2,"Medicare gives universal coverage; private insurance and services sit alongside it."],["A key equity-of-access weakness of the Australian system is:",["Free public hospital care","Out-of-pocket costs and declining bulk billing","The PBS","Universal coverage"],1,"Out-of-pocket costs stop some people seeing a GP or specialist, especially low-income people."],["Approximately what proportion of health spending goes to prevention?",["\u22482%","\u224820%","\u224840%","\u224860%"],0,"Prevention receives only about 2% of spending, which shows a treatment-focused system."]],sa:{q:"Assess the effectiveness of Australia's healthcare system in providing equity of access for all Australians.",m:8,c:[["7\u20138","Makes an informed judgement about effectiveness; balances strengths and weaknesses of access with relevant examples/data; considers different population groups"],["5\u20136","Explains strengths and weaknesses of the healthcare system relating to access, with some judgement"],["3\u20134","Describes features of the healthcare system and access"],["1\u20132","Identifies features of the healthcare system"]],pts:["Clear judgement statement","Strengths: Medicare, PBS, public hospitals, bulk billing, PBS safety net","Weaknesses: waiting lists, out-of-pocket costs, rural workforce, dental, mental health, cultural safety","Groups: low SES, rural/remote, First Nations","Future opportunities & conclusion that revisits the judgement"]}},h7:{fa:"fa1",iq:1,v:"Explain",t:"Explain how government and non-government organisations share responsibility for the health system",inc:["Federal, state/territory and local government","Non-government sector (private and not-for-profit)"],big:"Health in Australia is a shared job: Canberra funds and sets policy, the states run hospitals, councils keep communities safe, and NGOs fill gaps and advocate.",notes:[["Federal (Commonwealth) government","The federal government **funds and sets national policy**. It runs **Medicare** (MBS) and the **PBS**, subsidises private health insurance (the rebate), funds aged care, regulates medicines through the **TGA**, funds a large share of public hospitals via agreements with the states, runs national health promotion campaigns and screening programs, and collects and reports national data through the **AIHW**. The Department of Health, Disability and Ageing leads this work."],["State and territory governments","The states **run public hospitals** (through Local Health Districts in NSW), ambulance services, community and mental health services, school dental and immunisation programs, public health regulation (food safety, disease notification) and the registration of facilities. In NSW, **NSW Health** is responsible."],["Local government","Councils look after **environmental and community health**: waste collection, sanitation, food premises inspections, immunisation clinics, parks, bike paths and recreation facilities, local health promotion and planning (e.g. smoke-free areas, shade)."],["Non-government organisations (NGOs)","**Private** providers include private hospitals, private health insurers, GPs (who are private businesses mostly funded through Medicare), pharmacies, and allied health. **Not-for-profit** organisations include the **Heart Foundation, Cancer Council, Diabetes Australia, Beyond Blue, Black Dog Institute and the Royal Flying Doctor Service**, as well as ACCHOs. They provide services, research, advocacy, education, support groups and fundraising, and often reach groups governments find hard to reach."],["Why share responsibility?","No single body can do everything. Sharing allows **national consistency** (federal), **local delivery** (state and local) and **specialist expertise and reach** (NGOs). The downside is **fragmentation and cost-shifting**. Patients can fall between Commonwealth-funded GP care and state-run hospitals, which is why collaboration and person-centred care matter (next dot point)."]],con:[["Commonwealth role","National funding and policy: Medicare, PBS, aged care, TGA, AIHW.","PBS subsidises medicines"],["State/territory role","Running public hospitals, ambulance, community and mental health services.","NSW Health and Local Health Districts"],["Local government role","Environmental health and community facilities.","Food premises inspections, bike paths"],["Not-for-profit NGO","An organisation that puts its income back into its health mission.","Cancer Council, Heart Foundation"]],sum:["Federal: funds and sets policy. Medicare, PBS, aged care, TGA, AIHW, national campaigns.","States/territories: deliver services. Public hospitals, ambulance, community and mental health.","Local: environmental health. Sanitation, food inspection, parks, immunisation clinics.","NGOs (private and not-for-profit): services, research, advocacy, support (e.g. Cancer Council, RFDS).","Sharing gives reach and expertise, but brings fragmentation and cost-shifting."],tip:"'Explain' means show cause and effect: say WHAT each level does AND WHY that arrangement matters for health outcomes. A table-style structure (level \u2192 role \u2192 example) helps.",reel:["h:Who actually *runs* health in Australia? Spoiler: everyone.","p:Federal|Funds and sets the rules: Medicare, PBS, aged care, the TGA.","p:State|Runs the hospitals and ambulances. In NSW, that's NSW Health.","p:Local council|Clean water, food inspections, parks and bike paths.","l:NGOs|Cancer Council;Heart Foundation;Beyond Blue;Flying Doctors","c:Upside|Reach + expertise||Downside|Fragmentation","r:Level \u2192 Role \u2192 Example \u2192 Why it matters"],mcq:[["Which level of government is primarily responsible for running public hospitals?",["Federal","State/territory","Local","Non-government"],1,"States and territories run public hospitals, with substantial federal funding."],["The Therapeutic Goods Administration (TGA), which regulates medicines, is part of:",["Local government","State government","The federal government","A not-for-profit organisation"],2,"The TGA is a Commonwealth regulator."],["Which is a not-for-profit NGO?",["Medicare","NSW Health","Cancer Council","Local council"],2,"Cancer Council is a not-for-profit providing research, advocacy and support."]],sa:{q:"Explain how government and non-government organisations share responsibility for health in Australia. Use examples.",m:6,c:[["5\u20136","Clearly explains the roles of all levels of government AND non-government organisations, showing how responsibility is shared, with relevant examples"],["3\u20134","Describes the roles of some levels of government and/or NGOs with examples"],["1\u20132","Identifies some health organisations or roles"]],pts:["Federal: Medicare, PBS, TGA, funding","State: hospitals, ambulance, community health","Local: environmental health, facilities","NGOs: private hospitals/insurers; not-for-profits e.g. Cancer Council","How sharing works / why it matters (reach, expertise, fragmentation)"]}},h8:{fa:"fa1",iq:1,v:"Outline",t:"Outline how government and non-government organisations collaborate to provide person-centred healthcare",inc:[],big:"Person-centred care puts the patient at the centre: services work together around the person rather than making the person work around the system.",notes:[["What is person-centred care?","**Person-centred care** treats each person as a partner in their own care. It respects their preferences, culture and values, involves families and carers, and coordinates services so the person gets seamless care. It is one of the principles of the Australian Charter of Healthcare Rights and of the national safety and quality standards."],["How organisations collaborate","**Primary Health Networks (PHNs)** are 31 federally funded, independent regions. They commission local services and link GPs, hospitals and community organisations. **Headspace** is federally funded and delivered by local NGO lead agencies, bringing mental health, physical health, alcohol and other drug, and work and study support for 12\u201325 year olds into one place. **ACCHOs** receive government funding but are run by communities to deliver holistic care. **Cancer care teams** combine public hospitals, Cancer Council support lines and community nurses. The **NDIS** links government funding with private and not-for-profit providers chosen by the participant. **Medicare Urgent Care Clinics** are federally funded and run in partnership with states, PHNs and private GP clinics."],["Why it matters","Collaboration reduces **duplication and gaps**, improves **continuity of care**, makes services easier to navigate, and lets the person shape their own care. Shared tools like **My Health Record** support it by letting different providers see the same information."]],con:[["Person-centred care","Care that respects the person's preferences, needs and values and involves them in decisions.","A care plan built with the patient and their family"],["Primary Health Network (PHN)","Regional bodies that coordinate and commission local health services.","31 PHNs across Australia"],["headspace","A youth mental health service combining government funding and NGO delivery.","One-stop shop for 12\u201325 year olds"],["Continuity of care","A smooth, connected experience across different providers over time.","GP, hospital and community nurse share a care plan"]],sum:["Person-centred care respects the person's preferences, culture and values and involves them in decisions.","Primary Health Networks link GPs, hospitals and community services in each region.","headspace = federal funding + NGO delivery, a one-stop shop for young people.","ACCHOs, the NDIS and Urgent Care Clinics are other examples of collaboration.","Collaboration reduces gaps and duplication and improves continuity; My Health Record supports it."],tip:"'Outline' is a lower-order verb: give a brief sketch of the main features. Name 2\u20133 clear examples of collaboration rather than writing at length. Watch the mark value.",reel:["h:What if the health system worked *around you*, not the other way round?","p:Person-centred care|Your preferences, culture and values guide decisions about your care.","p:headspace|Federal $$ + local NGO = one-stop youth mental health.","l:Other collaborations|Primary Health Networks;ACCHOs;NDIS;Urgent Care Clinics","p:The glue|My Health Record lets every provider see the same story.","r:Who funds + who delivers + how it centres the person"],mcq:[["Primary Health Networks (PHNs) mainly:",["Run public hospitals","Coordinate and commission local health services","Sell private insurance","Regulate medicines"],1,"PHNs coordinate and commission services to fill local gaps."],["headspace is an example of collaboration because it:",["Is entirely privately funded","Combines government funding with NGO service delivery","Is run by local councils only","Only treats physical injuries"],1,"It is federally funded and delivered by local not-for-profit lead agencies."],["Person-centred care means:",["The doctor makes all decisions","Care is organised around the person's needs and preferences","The cheapest option is always chosen","Hospitals are the first point of contact"],1,"The person is a partner in care, so services are organised around them."]],sa:{q:"Outline how government and non-government organisations collaborate to provide person-centred healthcare.",m:4,c:[["4","Outlines person-centred care and provides clear examples of collaboration between government and NGOs"],["2\u20133","Describes some collaboration between organisations"],["1","Identifies an organisation or feature of person-centred care"]],pts:["Definition of person-centred care","Example 1 (e.g. headspace)","Example 2 (e.g. PHNs / ACCHOs)","Benefit: continuity, fewer gaps"]}},h9:{fa:"fa1",iq:1,v:"Discuss",t:"Discuss health expenditure and its impact on current and future populations",inc:["Healthcare versus prevention","Sustainability, access and equity","Medicare, private health insurance and related Commonwealth-funded programs"],big:"Australia spends around 10% of GDP on health. The real debate is WHAT the money goes to (treatment or prevention) and whether that can last as the population ages.",notes:[["The numbers and trends","Australia spends about **$250 billion a year on health (\u224810% of GDP)**, and spending is rising faster than population growth. Roughly **two-thirds comes from governments** (the Commonwealth \u224840%+, states and territories \u224825\u201330%) and the rest from **individuals (out-of-pocket \u224815%), private insurers and others**. The biggest areas of spending are **public hospitals, primary care, and medicines**. The drivers are an ageing population, chronic disease, new technologies and drugs, and rising community expectations."],["Healthcare (treatment) vs prevention","Most spending goes to **treating illness**. Only about **2% goes to prevention**, compared with around 3% or more in countries like Canada and the UK. Yet prevention is highly cost-effective. Tobacco control, immunisation and screening return several dollars for every dollar spent. The **National Preventive Health Strategy 2021\u20132030** aims to raise prevention to **5% of spending by 2030**. The dilemma: treatment produces visible results now, while prevention pays off years later, which is a political challenge."],["Medicare, PHI and related programs","**Medicare** gives free public hospital care and subsidises GP and specialist services through the MBS. It is funded through general taxation plus the **Medicare levy (2%)**. The **PBS** subsidises over 900 medicines, with safety nets. **Private health insurance** is encouraged through the **30% (means-tested) rebate**, the **Medicare Levy Surcharge** on higher earners without cover, and **Lifetime Health Cover** loading for people who join after 30. About **45% of Australians hold hospital cover**. Related programs include the NDIS, aged care, PBS safety nets and Closing the Gap PBS co-payments."],["Impact on current and future populations","**Sustainability:** an ageing population and a smaller tax base put pressure on funding (Intergenerational Report). **Access and equity:** rising out-of-pocket costs mean low-income people delay care, while PHI subsidies are criticised for mainly benefiting wealthier people. **Future generations:** under-investing in prevention now means more chronic disease, and more cost, later. Spending choices today shape the health of tomorrow's population."]],con:[["Health expenditure","Total spending on health goods and services by governments, individuals and insurers.","\u2248$250 billion (\u224810% of GDP)"],["Medicare levy","A 2% tax on taxable income that helps fund Medicare.","Paid by most taxpayers"],["Medicare Levy Surcharge","An extra tax on higher earners without private hospital cover.","Encourages PHI uptake"],["Sustainability","The ability to keep funding the system long-term without excluding people.","An ageing population increases demand"],["Cost-effectiveness","Health gain per dollar spent.","Immunisation saves more than it costs"]],sum:["\u2248$250 billion a year (\u224810% of GDP); two-thirds government funded, and rising.","Treatment dominates; prevention is only \u22482%, with a target of 5% by 2030.","Medicare (levy + tax), the PBS, and PHI incentives (rebate, MLS, Lifetime Health Cover).","Out-of-pocket costs threaten equity; PHI subsidies tend to favour wealthier people.","Ageing and chronic disease threaten sustainability. Prevention now = savings and better health later."],tip:"'Discuss' = points FOR and AGAINST. Present both sides of the treatment vs prevention debate and of private health insurance, then reach a reasoned position.",reel:["h:$250 *billion* a year on health. Where does it all go?","s:\u224810%|of GDP spent on health","c:Treatment|\u224898% of spending;Results now||Prevention|\u22482% of spending;Pays off later","p:The target|5% on prevention by 2030 (National Preventive Health Strategy).","l:The PHI carrot & stick|30% rebate;Medicare Levy Surcharge;Lifetime Health Cover","p:Future risk|Ageing + chronic disease + small tax base = a sustainability squeeze.","r:Discuss = both sides + a reasoned view"],mcq:[["Approximately what percentage of GDP does Australia spend on health?",["\u22482%","\u22485%","\u224810%","\u224820%"],2,"Australia spends roughly 10% of GDP on health, moderate for the OECD."],["Lifetime Health Cover loading is designed to:",["Fund public hospitals directly","Encourage people to take out private hospital insurance before age 31","Pay for the PBS","Reduce Medicare levy for low incomes"],1,"People who join after 30 pay a loading, which encourages earlier uptake."],["Which is an argument FOR increasing prevention spending?",["It produces immediate visible results","It is often highly cost-effective and reduces future chronic disease","It reduces the need for any hospitals","It only benefits private patients"],1,"Prevention (e.g. immunisation, tobacco control) returns more than it costs over time."]],sa:{q:"Discuss the impact of health expenditure on the sustainability and equity of Australia's healthcare system for current and future populations.",m:8,c:[["7\u20138","Presents a well-reasoned discussion of points for and/or against, linking expenditure to sustainability AND equity, for current and future populations, with relevant data"],["5\u20136","Explains the impact of expenditure on sustainability and/or equity with some examples"],["3\u20134","Describes aspects of health expenditure"],["1\u20132","Identifies features of health expenditure"]],pts:["\u224810% GDP, rising; funding sources","Treatment vs prevention (\u22482%, target 5%)","Medicare, PBS, PHI incentives and their equity effects","Out-of-pocket costs; low-income access","Future: ageing, chronic disease, IGR sustainability; position reached"]}}},DOTS_FA1B={h10:{fa:"fa1",iq:1,v:"Explain",t:"Explain complementary healthcare approaches",inc:["Products and services available","Use as a preventative measure","Treating the health issue","Use as a supplement to other medical treatments"],big:"Complementary health care is used ALONGSIDE conventional medicine. It is popular, but the evidence varies a lot from one approach to another.",notes:[["What it is","**Complementary health care** covers health practices and products that are not part of mainstream (conventional) medicine but are used **alongside** it. When used **instead of** conventional medicine it is called *alternative* medicine. Around **two in three Australians** use some form of complementary medicine, and the industry is worth billions of dollars a year."],["Products and services","**Products:** vitamins and minerals, herbal medicines (e.g. echinacea, St John's wort), fish oil, probiotics, homeopathic remedies, aromatherapy oils. **Services:** chiropractic, osteopathy, naturopathy, acupuncture, massage therapy, Chinese medicine, yoga and meditation. Products are regulated by the **TGA** as 'listed' (AUST L) medicines. They are checked for safety and quality, but **not evaluated for effectiveness**. 'Registered' (AUST R) medicines are evaluated more thoroughly."],["Why people use it","**As prevention:** to boost wellbeing or reduce stress (e.g. yoga, meditation, multivitamins). **To treat a health issue:** chronic pain, back pain or anxiety, especially when conventional care hasn't fully worked. **As a supplement to medical treatment:** for example acupuncture or massage to manage the side effects of chemotherapy, or relaxation therapies alongside cancer treatment. Other reasons: wanting a holistic, natural approach, longer consultations, cultural tradition, and a sense of control."],["Benefits and risks","**Benefits:** some approaches have good evidence (e.g. massage and exercise-based therapies for back pain, meditation for stress), patients feel empowered, and the care is holistic. **Risks:** many claims are not backed by evidence. Some herbs **interact with medications** (e.g. St John's wort with antidepressants). People may **delay effective treatment**. There are out-of-pocket costs, and practitioner regulation varies. Since 2019, natural therapies such as naturopathy and homeopathy have been **removed from private health insurance rebates** because of a lack of evidence. That's why being a critical health consumer (next dot point) matters."]],con:[["Complementary health care","Practices or products used alongside conventional medicine.","Acupuncture to reduce chemotherapy nausea"],["Alternative medicine","Used instead of conventional medicine.","Choosing herbal remedies instead of prescribed treatment"],["AUST L","TGA 'listed' medicine: checked for safety and quality, not efficacy.","Most vitamin supplements"],["Evidence-based practice","Health care that is supported by high-quality research.","Physiotherapy-led exercise for back pain"]],sum:["Complementary = used alongside conventional medicine; alternative = used instead of it.","Products: vitamins, herbs, probiotics. Services: chiropractic, acupuncture, naturopathy, massage, yoga.","Used for prevention, to treat issues (e.g. chronic pain) and to supplement medical treatment.","AUST L medicines are checked for safety but NOT effectiveness.","Risks: weak evidence, drug interactions, delayed treatment and cost. Benefits: holistic care, empowerment."],tip:"For 'explain', link each use to a reason or consequence: 'People use X as a supplement to medical treatment because\u2026 which can lead to\u2026'.",reel:["h:2 in 3 Australians use complementary medicine. Does it *work*?","c:Complementary|ALONGSIDE medicine||Alternative|INSTEAD of medicine","l:Why people use it|Prevention;Treat chronic pain;Manage treatment side effects","p:Label check|AUST L = safe and good quality, but NOT tested for effectiveness.","p:Watch out|St John's wort can interact with antidepressants.","r:Use + reason + evidence + risk"],mcq:[["A medicine labelled AUST L has been assessed by the TGA for:",["Effectiveness only","Safety and quality, but not effectiveness","Nothing","Use in hospitals only"],1,"Listed (AUST L) medicines are checked for safety and quality, not efficacy."],["Using acupuncture to reduce nausea during chemotherapy is an example of complementary health care used:",["As an alternative to medicine","As a supplement to medical treatment","As a diagnostic test","As screening"],1,"It sits alongside chemotherapy to manage side effects."],["A risk of complementary health care is:",["Interactions with prescribed medicines","Longer consultation times","A holistic approach","Patient empowerment"],0,"Some herbs, e.g. St John's wort, interact dangerously with medications."]],sa:{q:"Explain why Australians use complementary healthcare approaches, and the potential risks of doing so.",m:5,c:[["5","Clearly explains reasons for use AND risks with relevant examples"],["3\u20134","Describes reasons and/or risks with some examples"],["1\u20132","Identifies complementary approaches or reasons"]],pts:["Reasons: prevention, chronic conditions, supplement to treatment, holistic, control","Examples of products and services","Risks: evidence, interactions, delayed treatment, cost, regulation","AUST L vs AUST R"]}},h11:{fa:"fa1",iq:1,v:"Explain",t:"Explain the importance of being a critical health consumer",inc:["How do you decide who to believe?","What do you need to know to make informed decisions?","How do you assess the accuracy and credibility of health information, products and services?"],big:"A critical health consumer checks WHO is saying it, WHAT the evidence is and WHY they are saying it, before believing or buying.",notes:[["What it means","A **critical health consumer** can **access, evaluate and act on** health information, products and services. They make informed decisions rather than being swayed by marketing, influencers or misinformation. This is a core part of **health literacy**, and about **60% of Australians have low health literacy**, which is linked to worse health outcomes."],["Why it matters","Health misinformation spreads fast on social media (e.g. vaccine myths, detox teas, 'miracle' supplements, fad diets). Poor decisions can mean **wasted money, harm, drug interactions, or delaying effective treatment**. Critical consumers make better use of the health system, which also helps keep it sustainable."],["How to decide who to believe","Ask: **Who** is the source, and are they qualified (e.g. an AHPRA-registered practitioner)? **What** is the evidence: peer-reviewed research, or anecdotes and testimonials? **When** was it published, and is it current? **Why** is it being shared: to inform, or to sell? Is there a **conflict of interest** (e.g. a sponsored influencer)? Can it be **verified** by reputable sources such as healthdirect, the AIHW, the NHMRC or government .gov.au sites? Watch for warning signs: 'miracle cure', 'doctors hate this', before-and-after photos, guarantees."],["Your rights and protections","Under the **Australian Charter of Healthcare Rights** you have the right to access, safety, respect, partnership, information, privacy and to give feedback. Protections include the **TGA** (regulates therapeutic goods and advertising), **AHPRA** (registers practitioners), the **ACCC** (misleading advertising), the **Health Care Complaints Commission (NSW)**, and the **Therapeutic Goods Advertising Code**, which bans testimonials from health professionals."]],con:[["Health literacy","The ability to find, understand and use health information to make decisions.","Reading a nutrition panel correctly"],["Credibility","How trustworthy a source is, based on expertise, evidence and independence.","healthdirect vs a sponsored TikTok"],["Conflict of interest","When a source benefits from you believing or buying something.","An influencer paid to promote a supplement"],["Peer review","Research checked by independent experts before publication.","Journal articles in the Medical Journal of Australia"]],sum:["A critical health consumer accesses, evaluates and acts on health information.","About 60% of Australians have low health literacy, which is linked to poorer outcomes.","Check WHO (qualified?), WHAT (evidence?), WHEN (current?), WHY (to sell?).","Watch for testimonials, 'miracle' claims, conflicts of interest and unverified sources.","Protections: Charter of Healthcare Rights, TGA, AHPRA, ACCC, HCCC."],tip:"Use a scenario to show application: e.g. evaluate a social media supplement ad step by step. Markers reward applying criteria, not just listing them.",reel:["h:A fitness influencer swears by a *detox tea*. Should you buy it?","s:60%|of Australians have low health literacy","l:Check it|WHO's saying it?;WHAT's the evidence?;WHEN was it published?;WHY are they sharing it?","p:Red flags|'Miracle cure', 'detox', before-and-after pics, guarantees, discount codes.","l:Trusted sources|healthdirect;AIHW;NHMRC;.gov.au","r:Source \u2192 Evidence \u2192 Motive \u2192 Decision"],mcq:[["Which source is MOST credible for health information?",["A sponsored influencer post","healthdirect Australia","A product's own website testimonials","An anonymous forum"],1,"healthdirect is government-funded, evidence-based and independent."],["A 'conflict of interest' exists when:",["Information is peer reviewed","The source benefits financially from you believing the claim","Information is current","The author is qualified"],1,"A financial benefit biases the message."],["Which organisation registers health practitioners in Australia?",["ACCC","AHPRA","AIHW","WHO"],1,"AHPRA (with national boards) registers practitioners."]],sa:{q:"Explain the importance of being a critical health consumer when evaluating health information on social media.",m:5,c:[["5","Clearly explains the importance with reference to criteria for evaluating credibility and consequences of uncritical decisions, with examples"],["3\u20134","Describes how to evaluate information and/or why it matters"],["1\u20132","Identifies features of a critical health consumer"]],pts:["Definition/health literacy","Consequences of misinformation (harm, cost, delay)","Evaluation criteria: source, evidence, currency, motive","Examples (detox tea, supplements)","Protections/reputable sources"]}},h12:{fa:"fa1",iq:1,v:"Investigate",t:"Investigate the current and emerging changes and challenges to the healthcare system",inc:[],big:"The system is being squeezed by ageing, chronic disease, workforce shortages and cost, and at the same time it is being reshaped by technology and new models of care.",notes:[["Current changes and challenges","**Ageing and chronic disease** are driving demand. **Workforce shortages** affect GPs, nurses, aged care and rural areas, along with burnout after COVID-19. **Bulk billing declined** and out-of-pocket costs rose (the government responded with tripled bulk-billing incentives in 2023 and expanded them in 2025). **Hospital pressure**: emergency department wait times and **ambulance ramping**. **Mental health demand**, especially among young people. **Elective surgery backlogs** post-COVID."],["Emerging changes","**Digital health:** telehealth made permanent, e-prescriptions, My Health Record, virtual hospitals. **Artificial intelligence:** diagnostic imaging, AI scribes. **New models of care:** Medicare Urgent Care Clinics, nurse practitioners and **pharmacist prescribing** (e.g. treating urinary tract infections, and 60-day dispensing). **Genomics and personalised medicine.** **Climate change:** heatwaves, bushfire smoke and new disease patterns. **Pandemic preparedness:** the Australian Centre for Disease Control (from 2026)."],["Drawing conclusions","These challenges are linked. Workforce shortages make access worse in rural areas; ageing increases costs, which threatens sustainability. The emerging responses (digital health, expanded scopes of practice, prevention) offer real solutions, but they risk widening the **digital divide** and need careful regulation and funding."]],con:[["Ambulance ramping","When ambulances can't hand patients over to busy emergency departments.","Paramedics waiting with patients outside hospital"],["Scope of practice","The range of tasks a health professional is permitted to perform.","Pharmacists prescribing for UTIs"],["Digital divide","The gap between people who can and can't access digital technology.","Older or remote people without reliable internet"],["Genomics","Using a person's genetic information to guide diagnosis and treatment.","Targeted cancer therapies"]],sum:["Current: ageing, chronic disease, workforce shortages, out-of-pocket costs, ED and ambulance pressure, mental health demand.","Emerging: telehealth, AI, e-prescriptions, Urgent Care Clinics, pharmacist prescribing, genomics.","Climate change and pandemics are new threats; the Australian CDC aims to improve preparedness.","Challenges are linked, so solutions must address several at once.","New tech risks a digital divide, so equity must be built in."],tip:"For 'investigate', organise your answer: current challenges \u2192 emerging changes \u2192 a conclusion about how well the system is adapting. Show the links between issues.",reel:["h:Ambulances waiting outside hospitals. Why is the system *stretched*?","l:Pressure points|Ageing + chronic disease;Workforce shortages;Out-of-pocket costs;ED ramping","l:What's emerging|Telehealth;AI diagnosis;Urgent Care Clinics;Pharmacist prescribing","p:New threats|Climate change and pandemics, so we now have an Australian CDC.","p:Watch the gap|New tech can leave behind people without internet access.","r:Challenge \u2192 Emerging change \u2192 Equity check"],mcq:[["'Ambulance ramping' refers to:",["Ambulances driving to rural areas","Ambulances waiting to transfer patients to busy emergency departments","New ambulance funding","Ambulance call triage"],1,"Ramping is a sign of hospital capacity pressure."],["Pharmacists prescribing treatment for uncomplicated UTIs is an example of:",["Reduced scope of practice","Expanded scope of practice","Complementary medicine","Private health insurance"],1,"Extending pharmacists' role improves access and eases pressure on GPs."],["A risk of relying more on digital health is:",["Improved access for rural patients","The digital divide","Reduced travel","Faster records"],1,"People without devices, internet or digital skills may miss out."]],sa:{q:"Investigate TWO current or emerging challenges facing Australia's healthcare system and how the system is responding.",m:6,c:[["5\u20136","Thoroughly investigates two challenges with relevant evidence, explains responses and draws conclusions about their effectiveness"],["3\u20134","Describes two challenges and some responses"],["1\u20132","Identifies challenges to the health system"]],pts:["Challenge 1 + evidence (e.g. workforce shortage)","Response (e.g. pharmacist scope, nurse practitioners, rural incentives)","Challenge 2 + evidence (e.g. bulk billing decline)","Response (triple incentive, Urgent Care Clinics)","Conclusion/judgement"]}},h13:{fa:"fa1",iq:2,v:"Discuss",t:"Discuss the relationship between technology and health",inc:[],big:"Technology can extend lives and widen access, or widen inequity and harm health. The relationship runs both ways.",notes:[["Positive relationships","**Medical technology** has transformed outcomes: imaging (MRI, CT), keyhole and robotic surgery, cochlear implants (an Australian invention), vaccines, and improved cancer therapies. **Digital technology** improves access: telehealth for rural patients, apps for self-management (e.g. diabetes glucose monitors), and wearables that encourage physical activity. **Health promotion** uses social media to reach young people."],["Negative relationships","**Screen time and sedentary behaviour** displace physical activity and disrupt sleep. **Social media** is linked to body image concerns, cyberbullying and anxiety in some young people (the Australian under-16 social media minimum age law took effect in 2025). **Misinformation** spreads faster than evidence. Expensive technology **drives up health costs**. Access is unequal: the **digital divide** affects older, remote, low-income and some First Nations people."],["Making a judgement","The relationship is **neither simply good nor bad**. Its impact depends on **who has access, how it's used and how it's regulated**. Strong answers weigh the benefits for access and outcomes against the costs, equity issues and lifestyle harms."]],con:[["Health technology","Any tool, device, medicine, procedure or system used to improve health.","MRI scanners, apps, wearables"],["Sedentary behaviour","Sitting or lying with low energy expenditure while awake.","Gaming or scrolling for hours"],["Digital divide","Unequal access to digital devices, internet or skills.","Remote communities with poor connectivity"],["Wearables","Body-worn devices that monitor health data.","Smartwatches tracking heart rate and steps"]],sum:["Technology improves diagnosis, treatment and survival (imaging, robotic surgery, vaccines).","Digital tech widens access: telehealth, self-management apps, wearables.","Harms: sedentary behaviour, sleep disruption, body image issues, misinformation.","Expensive technology increases costs, and the digital divide creates inequity.","Judgement: its impact depends on access, use and regulation."],tip:"'Discuss' needs both sides AND a position. Structure: positive impacts \u2192 negative impacts \u2192 judgement about the overall relationship.",reel:["h:Your phone can *save* your life\u2026 or wreck your sleep.","c:Helps health|Telehealth;Robotic surgery;Wearables||Hurts health|Screen time;Misinformation;Cost","p:Australian invention|The cochlear implant, technology changing lives.","p:Digital divide|Not everyone has a device, data or the skills to use them.","r:Benefit vs harm \u2192 it depends on access and use"],mcq:[["Which is a NEGATIVE relationship between technology and health?",["Telehealth for remote patients","Increased sedentary screen time","Robotic surgery","Glucose monitors"],1,"Screen time displaces physical activity and harms sleep."],["The 'digital divide' refers to:",["Different types of apps","Unequal access to technology","Dividing health data","Robot-assisted surgery"],1,"Unequal access means unequal benefits."],["A balanced judgement about technology and health would argue that:",["Technology is always beneficial","Technology always harms health","Impact depends on access, use and regulation","Technology has no effect on health"],2,"A balanced view recognises that the context determines the impact."]],sa:{q:"Discuss the relationship between technology and the health of young Australians.",m:6,c:[["5\u20136","Presents a balanced discussion of positive and negative relationships with relevant examples and a clear position"],["3\u20134","Describes positive and/or negative impacts with examples"],["1\u20132","Identifies technologies relating to health"]],pts:["Positives: health info access, telehealth/headspace online, fitness apps","Negatives: sedentary behaviour, sleep, body image, cyberbullying, misinformation","Regulation e.g. under-16 social media minimum age","Equity / digital divide","Position reached"]}},h14:{fa:"fa1",iq:2,v:"Investigate",t:"Investigate new technologies and treatments in the healthcare system",inc:[],big:"New treatments are shifting care from 'one size fits all' to personalised, earlier and less invasive, but they come with big costs and ethical questions.",notes:[["What you are investigating","**New technologies** are tools, devices and digital systems; **new treatments** are therapies, drugs and procedures. To **investigate** them, look at how each one works, what difference it makes to patients and to the healthcare system, and then **draw a conclusion** about its overall impact. Naming the technology is not enough. Markers want to see the change it causes."],["Five examples worth knowing","**Genomics and personalised medicine:** testing the genes in a tumour shows which targeted drug is likely to work, so patients avoid treatments that won't help them. **Immunotherapy and CAR-T cell therapy:** a patient's own immune cells are re-engineered to attack their cancer. CAR-T has been publicly funded for some blood cancers in Australia since 2019. **Robotic and minimally invasive surgery:** smaller incisions mean less pain, fewer complications and hospital stays of days rather than a week or more. **Virtual hospitals and remote monitoring:** patients are monitored at home with wearable devices and video check-ins (e.g. RPA Virtual Hospital, Sydney). **Continuous glucose monitors (CGMs):** a sensor on the arm tracks blood glucose all day. They have been fully subsidised through the NDSS for people with type 1 diabetes since 2022, which improves control and reduces emergencies."],["How they are changing the system","**From hospital to home:** virtual care and remote monitoring free up hospital beds and reduce emergency presentations. **From one-size-fits-all to personalised:** genomic testing matches treatment to the individual, which improves results and reduces wasted spending on drugs that won't work. **From late treatment to early detection:** screening, wearables and genetic risk testing find problems earlier, when they are cheaper and easier to treat. **New decisions about value:** because many new treatments are very expensive (some cancer drugs cost more than $100,000 per patient per year), expert committees such as the **PBAC** (medicines) and **MSAC** (medical services) assess whether they are effective and cost-effective before they are subsidised."],["Challenges: who misses out?","**Cost:** expensive treatments put pressure on health budgets and may not be subsidised. **Equity:** new technology is concentrated in major city hospitals, so rural patients may travel or miss out, and remote monitoring needs reliable internet. **Ethics:** genetic information raises privacy concerns, and the government has moved to stop life insurers using genetic test results. **Evidence and safety:** treatments must be approved by the **TGA** and proven to work. **Workforce:** staff need training to use new technology safely."],["Drawing a conclusion","Overall, new technologies and treatments are **improving outcomes and making care more efficient**, but **cost and equity determine who benefits**. A strong investigation ends with a judgement, e.g. that these advances are highly beneficial, but only if they are funded fairly and made available beyond metropolitan hospitals."]],ex:{title:"RPA Virtual Hospital (Sydney)",text:"Opened in 2020 by Sydney Local Health District, RPA Virtual Hospital cares for patients in their own homes. Patients are given devices that measure vital signs such as heart rate and oxygen levels, and clinicians in a central care hub monitor the data and check in by video and phone, escalating care if a patient deteriorates. It began with COVID-19 patients and expanded to other conditions, freeing up physical hospital beds.",use:"For example, RPA Virtual Hospital in Sydney, opened in 2020, monitors patients at home with wearable devices. This frees hospital beds and reduces infection risk, but it relies on reliable internet and digital literacy, which limits access for some older and remote patients."},mist:["Listing technologies without explaining how each one changes the healthcare system. That is describing, not investigating.","Writing 'technology' or 'new treatments' vaguely instead of naming a specific example.","Only giving benefits. Investigate needs you to weigh benefits against cost and equity and reach a conclusion.","Confusing this dot point with digital health (dot point 15). Here, also cover treatments such as immunotherapy and devices such as CGMs."],con:[["Personalised medicine","Treatment tailored to a person's genes, environment and lifestyle.","Targeted therapy for a specific cancer mutation"],["Immunotherapy","Treatment that helps the immune system fight disease.","CAR-T therapy for some leukaemias"],["Virtual hospital","Hospital-level care delivered at home with remote monitoring.","RPA Virtual Hospital, Sydney"],["PBAC","The committee that recommends which medicines are subsidised on the PBS.","Assesses cost-effectiveness of new drugs"]],sum:["Examples: genomics, immunotherapy/CAR-T, mRNA, robotic surgery, 3D printing, virtual hospitals, drones.","Benefits: earlier diagnosis, less invasive treatment, care at home, better survival.","Challenges: very high cost (PBAC decisions), equity, ethics, workforce, evidence.","New tech is often concentrated in cities, which raises equity concerns.","Investigate = examples + impact + conclusions about benefit vs cost."],tip:"Use 2\u20133 specific, named examples. Markers reward specificity (e.g. 'RPA Virtual Hospital') over vague phrases like 'new technology'.",reel:["h:Hospital care\u2026 *from your bedroom*? It's already here.","l:New wave|Genomics;CAR-T immunotherapy;mRNA;Robotic surgery;Virtual hospitals","p:Sydney example|RPA Virtual Hospital monitors patients at home.","c:Benefits|Earlier diagnosis;Less invasive||Challenges|Huge cost;Equity;Ethics","r:Name it \u2192 Impact \u2192 Cost and equity check"],mcq:[["Treatment tailored to a person's genetic profile is called:",["Complementary medicine","Personalised (precision) medicine","Palliative care","Primary care"],1,"Genomics enables personalised/precision medicine."],["Which body recommends which new medicines are subsidised on the PBS?",["AHPRA","PBAC","ACCC","WHO"],1,"The Pharmaceutical Benefits Advisory Committee assesses cost-effectiveness."],["A major challenge of new treatments such as CAR-T therapy is:",["They are too cheap","High cost and equitable access","They are only for children","They have no evidence base"],1,"High cost raises sustainability and equity concerns."]],sa:{q:"Investigate how ONE new technology or treatment is changing the Australian healthcare system.",m:5,c:[["5","Thorough investigation of a specific technology/treatment, its benefits, challenges and impact on the system"],["3\u20134","Describes a technology/treatment and some impacts"],["1\u20132","Identifies a technology or treatment"]],pts:["Named example (e.g. virtual hospitals)","How it works","Benefits for patients/system","Challenges: cost, equity, workforce","Conclusion"]}},h15:{fa:"fa1",iq:2,v:"Evaluate",t:"Evaluate the impact of digital health on the healthcare system",inc:["What is digital health?","What services are available?","To what extent has digital health connected health information?","Challenges and opportunities for individuals and organisations"],big:"Digital health has made care faster and more connected, but it hasn't reached everyone equally, and the system is still not fully linked up.",notes:[["What is digital health?","**Digital health** is the use of digital technologies to improve health and the delivery of health care. It is led nationally by the **Australian Digital Health Agency** under the National Digital Health Strategy."],["Services available","**My Health Record:** a national online summary of health information (\u224824 million records; opt-out since 2019). **Telehealth:** video and phone consultations, made permanent in Medicare since 2022. **Electronic prescriptions:** token via SMS or app. **healthdirect** (24/7 advice line and online symptom checker). **Medicare app** and **digital vaccination certificates**. **Remote monitoring and virtual hospitals.** Health apps and wearables."],["To what extent is health information connected?","Progress has been significant: most GPs and pharmacies upload to My Health Record, and the use of pathology and imaging reports has grown. However, connection is **incomplete**. Many specialists and private providers upload little. Some hospital systems don't talk to each other (interoperability problems). Patients don't always know what's in their record. The 2023\u20132028 strategy and the 'Sharing by default' reforms aim to make uploading results the norm."],["Opportunities and challenges","**Opportunities, for individuals:** convenience, access from rural areas, control over their own data, fewer repeated tests. **For organisations:** efficiency, better coordination, data for planning, and fewer medication errors. **Challenges, for individuals:** privacy and security concerns, the digital divide (older, remote, low-SES and low-literacy people), and the loss of face-to-face contact. **For organisations:** cost of systems, cyberattacks (e.g. the 2022 Medibank breach), interoperability, workforce training."],["Evaluation","On balance, digital health has **substantially improved access and efficiency**, especially through telehealth and e-prescriptions, but its impact is **limited by incomplete connection and unequal access**. Its full value depends on interoperability, security and closing the digital divide."]],con:[["Digital health","Using digital technology to improve health and health care.","Telehealth, My Health Record, e-prescriptions"],["Interoperability","The ability of different systems to exchange and use information.","Hospital system sharing results with a GP's software"],["My Health Record","A national, opt-out, online summary of a person's health information.","Shared health summaries, medicines, test results"],["Cybersecurity","Protecting digital systems and data from attack.","2022 Medibank data breach"]],sum:["Digital health = digital tech used to improve health care; led by the Australian Digital Health Agency.","Services: My Health Record, telehealth, e-prescriptions, healthdirect, virtual hospitals, apps.","Connection is improved but incomplete because of interoperability gaps and low specialist uploads.","Opportunities: access, efficiency, coordination, fewer errors. Challenges: privacy, cyber risk, digital divide.","Evaluation: a significant positive impact, limited by equity and connection gaps."],tip:"'Evaluate' = make a judgement based on criteria. Pick criteria (access, efficiency, equity, safety), judge digital health against each, and state an overall verdict.",reel:["h:Your whole health history\u2026 on your *phone*. Is that a good thing?","l:Digital health services|My Health Record;Telehealth;E-scripts;healthdirect;Virtual hospitals","s:\u224824M|My Health Records created","c:Wins|Access;Efficiency;Fewer errors||Gaps|Privacy;Cyber risk;Digital divide","p:Not fully linked yet|Many specialists and systems still don't share data.","r:Evaluate = criteria \u2192 judgement \u2192 verdict"],mcq:[["My Health Record moved to an 'opt-out' model, which means:",["Only people who apply get a record","A record is created unless the person chooses not to have one","Records are only for hospitals","Records are private health insurance files"],1,"Opt-out means records are created automatically unless someone opts out."],["'Interoperability' refers to:",["Surgery using robots","Different systems being able to exchange and use information","Telehealth only","Private insurance coverage"],1,"Poor interoperability limits how connected health information is."],["A challenge of digital health for INDIVIDUALS is:",["Fewer repeated tests","Convenience","Privacy concerns and the digital divide","Access from rural areas"],2,"Privacy and unequal digital access are key individual challenges."]],sa:{q:"Evaluate the impact of digital health on the Australian healthcare system.",m:8,c:[["7\u20138","Makes a clear judgement about the impact of digital health based on criteria; supports with specific services and examples; considers individuals AND organisations, opportunities AND challenges"],["5\u20136","Explains impacts of digital health with some judgement"],["3\u20134","Describes digital health services and some impacts"],["1\u20132","Identifies digital health services"]],pts:["Definition + specific services","Extent of connection (MHR, interoperability)","Opportunities for individuals/organisations","Challenges: privacy, cyber, digital divide, cost","Clear judgement throughout"]}},h16:{fa:"fa1",iq:2,v:"Examine",t:"Examine how artificial intelligence (AI) and health data are shaping the health of Australians",inc:["How is it used?","How does it reduce healthcare spending?","How is it used to cure and manage diseases?","Measures needed to protect privacy and confidentiality of personal information"],big:"AI turns huge amounts of health data into faster diagnoses and smarter planning, but only if people can trust what happens to their data.",notes:[["How it is used","AI analyses large datasets to find patterns humans would miss. **Medical imaging:** AI reads X-rays, mammograms and skin lesion photos (e.g. melanoma detection), helping radiologists work faster and more accurately. **AI scribes:** these record and summarise GP consultations, saving time. **Predictive analytics:** these flag patients at risk of deterioration in hospital, or predict ED demand. **Drug discovery** and **population health planning**, e.g. AIHW data used to target services."],["Reducing spending","AI can reduce costs by **detecting disease earlier**, when treatment is cheaper; **reducing admin time** (scribes, scheduling); **avoiding unnecessary tests** and hospital admissions through prediction; and **better resource allocation** (staffing, beds)."],["Curing and managing disease","Earlier and more accurate **diagnosis** (cancers, eye disease in diabetes), **personalised treatment plans**, **remote monitoring** of chronic disease (AI flags abnormal readings from glucose monitors or heart devices), and **mental health chatbots** for low-level support (with limits)."],["Protecting privacy and confidentiality","Measures include the **Privacy Act 1988** and the Australian Privacy Principles, the **My Health Records Act 2012**, **de-identifying data**, **consent** for data use, **cybersecurity standards**, and **human oversight** of AI decisions. The TGA regulates AI as a medical device. AI ethics frameworks address bias: AI trained on data that under-represents some groups (e.g. darker skin tones in skin-cancer datasets) can be **less accurate for them**, which worsens inequity."]],con:[["Artificial intelligence","Computer systems that perform tasks that normally require human intelligence.","AI reading mammograms"],["Health data","Information about people's health collected by services and devices.","Hospital records, wearable data, AIHW datasets"],["De-identification","Removing personal details so data can't be linked to an individual.","Research datasets with names removed"],["Algorithmic bias","AI producing less accurate results for some groups because of unrepresentative training data.","Skin-cancer AI less accurate on darker skin"]],sum:["AI uses: imaging diagnosis, AI scribes, predictive analytics, drug discovery, population planning.","Saves money through early detection, less admin, fewer unnecessary tests and better resource allocation.","Improves curing and managing disease: earlier diagnosis, personalised care, remote monitoring.","Privacy measures: Privacy Act, My Health Records Act, consent, de-identification, cybersecurity.","Risks: data breaches, algorithmic bias, over-reliance. Human oversight is essential."],tip:"For 'examine', go beyond describing uses. Inquire into the impact on health AND the conditions needed (privacy, equity) for that impact to be positive.",reel:["h:An AI spotted the cancer *before* the doctor did. Now what?","l:AI in health|Reading scans;AI scribes;Predicting deterioration;Drug discovery","p:Saves money|Earlier detection = cheaper treatment + less admin.","p:The bias problem|AI trained on unrepresentative data is less accurate for some groups.","l:Protect the data|Privacy Act;Consent;De-identification;Human oversight","r:Use \u2192 Benefit \u2192 Risk \u2192 Safeguard"],mcq:[["Which is an example of AI reducing healthcare spending?",["Increasing hospital admissions","Detecting disease earlier when treatment is cheaper","Replacing all doctors","Removing privacy laws"],1,"Earlier detection typically means simpler, cheaper treatment."],["Removing names and identifying details from health datasets is called:",["Encryption","De-identification","Interoperability","Telehealth"],1,"De-identification protects privacy when data is used for research and planning."],["Algorithmic bias in health AI can:",["Make AI equally accurate for everyone","Worsen health inequities for under-represented groups","Reduce data breaches","Replace consent"],1,"Unrepresentative training data can make AI less accurate for some groups."]],sa:{q:"Examine how AI and health data can improve health outcomes while protecting the privacy of Australians.",m:6,c:[["5\u20136","Detailed examination of uses and benefits of AI/data for health outcomes AND specific privacy measures, with examples"],["3\u20134","Describes uses of AI/data and some privacy measures"],["1\u20132","Identifies uses of AI or privacy concerns"]],pts:["Uses: imaging, scribes, prediction","Outcomes: earlier diagnosis, disease management","Spending reduction","Privacy: legislation, consent, de-identification, security","Risks: bias, breaches"]}},h17:{fa:"fa1",iq:3,v:"Describe",t:"Describe the key features of the United Nations Sustainable Development Goals (SDGs)",inc:["SDG 3 \u2013 Good Health and Wellbeing","SDG 4 \u2013 Quality Education","SDG 10 \u2013 Reduced Inequalities","SDG 11 \u2013 Sustainable Cities and Communities"],big:"The SDGs are 17 global goals agreed in 2015 to end poverty, protect the planet and leave no one behind by 2030, and health is linked to all of them.",notes:[["Key features","The **2030 Agenda for Sustainable Development** was adopted by all 193 UN member states in **2015**. It sets **17 goals** with 169 targets. Key features: they are **universal** (apply to all countries, including Australia), **integrated and indivisible** (progress on one supports others), they promise to **'leave no one behind'** (reaching the most disadvantaged first), and they cover the **social, economic and environmental** sides of sustainability. Countries report their progress (Australia's Voluntary National Review)."],["SDG 3: Good Health and Wellbeing","*Ensure healthy lives and promote wellbeing for all at all ages.* Targets include: reduce maternal and child deaths; end epidemics such as HIV, TB and malaria; **reduce premature deaths from non-communicable diseases by one-third** and promote mental health; prevent substance abuse; **halve road traffic deaths**; achieve **universal health coverage**; reduce tobacco use."],["SDG 4: Quality Education","*Ensure inclusive and equitable quality education and promote lifelong learning.* Education is a powerful **determinant of health**: it improves health literacy, employment and income, and reduces risky behaviours. Targets include free primary and secondary education, early childhood development, and equal access for vulnerable groups including Indigenous peoples and people with disability."],["SDG 10: Reduced Inequalities","*Reduce inequality within and among countries.* Targets include income growth for the bottom 40%, the **social, economic and political inclusion of all** regardless of age, sex, disability, race, ethnicity, origin or religion, and ending discriminatory laws and practices. This links directly to closing health gaps."],["SDG 11: Sustainable Cities and Communities","*Make cities and communities inclusive, safe, resilient and sustainable.* Targets include safe affordable housing, **accessible public transport**, **green and public spaces**, reducing air pollution, and disaster resilience. These shape physical activity, mental health, injury and respiratory disease."]],con:[["2030 Agenda","The UN plan adopted in 2015 containing the 17 SDGs.","Australia is a signatory"],["Leave no one behind","Reaching the most disadvantaged people first.","Prioritising First Nations communities"],["Universal","The goals apply to ALL countries, not just developing ones.","Australia reports on its own progress"],["Integrated/indivisible","Goals are interconnected; progress on one affects others.","Education (SDG 4) improves health (SDG 3)"]],sum:["Adopted 2015 by 193 UN states: 17 goals and 169 targets for 2030.","Features: universal, integrated, 'leave no one behind', social + economic + environmental.","SDG 3 health (NCD deaths down by a third, UHC, road deaths); SDG 4 quality education.","SDG 10 reduced inequalities (inclusion of all); SDG 11 safe, sustainable cities (transport, green space).","The goals interact. Education and equity are determinants of health."],tip:"'Describe' = provide characteristics and features. Give the purpose of each SDG plus 1\u20132 specific targets. Showing that they interconnect lifts your response.",reel:["h:17 goals. 193 countries. One deadline: *2030*.","l:Key features|Universal;Integrated;Leave no one behind;People, planet, prosperity","p:SDG 3: Health|Cut premature non-communicable disease deaths by \u2153; universal health coverage.","p:SDG 4: Education|Education = health literacy + jobs + income.","c:SDG 10|Reduce inequality;Inclusion for all||SDG 11|Safe cities;Green space;Transport","r:Goal + purpose + target + link to health"],mcq:[["The SDGs were adopted in:",["2000","2010","2015","2020"],2,"The 2030 Agenda and SDGs were adopted in September 2015."],["Which SDG focuses on making cities inclusive, safe, resilient and sustainable?",["SDG 3","SDG 4","SDG 10","SDG 11"],3,"SDG 11 is Sustainable Cities and Communities."],["The principle 'leave no one behind' means:",["Only developing countries take part","Reach the most disadvantaged first","Focus on economic growth only","Each goal is separate"],1,"It commits to prioritising the furthest behind."]],sa:{q:"Describe the key features of the Sustainable Development Goals and explain how SDG 4 can contribute to SDG 3.",m:5,c:[["5","Describes key features of the SDGs AND clearly explains the link between quality education and health"],["3\u20134","Describes some features and makes a link between SDGs 3 and 4"],["1\u20132","Identifies features of the SDGs"]],pts:["2015, 17 goals, 2030 deadline","Universal, integrated, leave no one behind","SDG 3 targets","Education \u2192 health literacy, employment, income \u2192 health","Example"]}},h18:{fa:"fa1",iq:3,v:"Evaluate",t:"Evaluate the application of SDGs 3, 4, 10 and 11 to inform community action to improve the health status of a community",inc:["How have the goals been applied in other communities?","What can be learned and applied to your own community?","What are the major health issues for a community?","Strategies to advocate for and improve community health","How to evaluate whether these strategies will be effective"],big:"The SDGs give a community a framework: identify its health issues, borrow what worked elsewhere, act together and measure whether it's working.",notes:[["Applying the goals in other communities","**SDG 11 and 3: Copenhagen and Melbourne** invested in cycling infrastructure and the '20-minute neighbourhood', increasing physical activity and reducing pollution. **SDG 4 and 3: Australia's Clontarf Foundation and the Stars Foundation** use school engagement to improve education and wellbeing for First Nations young people. **SDG 10 and 3: Western Sydney** councils run culturally specific health programs for migrant and refugee communities. **SDG 3: Finland's North Karelia Project** cut heart disease deaths by over 80% through community-wide changes to diet and smoking."],["Your own community (e.g. Western Sydney / Macarthur)","Identify the **major health issues** using data (e.g. local health district reports, PHN needs assessments). Common issues include **higher rates of obesity and type 2 diabetes**, **physical inactivity**, **heat** (urban heat island: Western Sydney can be up to 10\xB0C hotter than the coast), car dependence, mental health, and access to GP services. Then map them to the SDGs: e.g. green space and tree canopy (SDG 11), school-based health literacy (SDG 4), culturally safe access for First Nations and CALD families (SDG 10), local diabetes programs (SDG 3)."],["Strategies to advocate for and improve community health","Advocacy: **petitions, writing to council and MPs, youth councils, social media campaigns, partnering with NGOs**. Action: shared paths and safe cycling routes, shade and tree planting, free community exercise programs, school health literacy units, culturally safe health clinics, community gardens."],["Evaluating effectiveness","Use criteria: **Is it evidence-based? Does it target the determinants? Is it accessible and equitable (leave no one behind)? Is it sustainable and funded? Does it involve the community (co-design, empowerment)? Can it be measured?** Measure with data before and after (e.g. activity levels, BMI, presentations, survey wellbeing) and set clear, time-bound targets linked to the SDG indicators."]],con:[["Community action","Collective efforts by community members to identify and address their own health issues.","Residents campaigning for a shared bike path"],["Advocacy","Actions that gain political commitment, policy support and social acceptance for a health goal.","Youth council submission to local council"],["Co-design","Designing strategies together with the people who will use them.","Aboriginal Elders shaping a community program"],["Evaluation criteria","Standards used to judge if a strategy works.","Evidence-based, equitable, sustainable, measurable"]],sum:["Other communities: Copenhagen/Melbourne cycling (SDG 11), Clontarf/Stars (SDG 4), North Karelia (SDG 3).","Identify local issues with data, e.g. Western Sydney: obesity, diabetes, heat, inactivity.","Map issues to SDGs 3, 4, 10, 11 and choose integrated strategies.","Advocate: petitions, council submissions, youth councils, NGO partnerships, campaigns.","Evaluate with criteria: evidence, equity, sustainability, community involvement, measurable outcomes."],tip:"'Evaluate' requires a judgement. Name your criteria explicitly, test each strategy against them, and conclude which is most likely to be effective and WHY.",reel:["h:Can 4 UN goals make *your suburb* healthier?","p:Proof it works|Finland's North Karelia Project cut heart disease deaths by 80%+ with community action.","p:Local issue|Western Sydney heat: up to 10\xB0C hotter. That's an SDG 11 + SDG 3 problem.","l:Advocate|Petition council;Youth council;Social campaign;Partner with NGOs","l:Will it work?|Evidence-based?;Equitable?;Sustainable?;Community-led?;Measurable?","r:Issue \u2192 SDG \u2192 Strategy \u2192 Criteria \u2192 Judgement"],mcq:[["Planting trees and shade to reduce urban heat in Western Sydney most directly applies:",["SDG 4","SDG 10","SDG 11","SDG 4 only"],2,"Creating safe, resilient, sustainable environments is SDG 11 (and benefits SDG 3)."],["Which criterion best judges whether a community strategy 'leaves no one behind'?",["Cost only","Equity and accessibility for disadvantaged groups","Number of social media likes","Speed of implementation"],1,"Equity is the core of 'leave no one behind'."],["Co-design means:",["Experts design strategies alone","Designing strategies with the community who will use them","Copying another country exactly","Government funding only"],1,"Co-design builds ownership and relevance."]],sa:{q:"Evaluate how the application of SDGs 3, 4, 10 and 11 could inform community action to improve the health of a community you have studied.",m:8,c:[["7\u20138","Makes a clear judgement based on criteria about the application of the SDGs; identifies community health issues with evidence; proposes and evaluates relevant strategies; uses examples from other communities"],["5\u20136","Explains how SDGs can inform action in a community with some evaluation"],["3\u20134","Describes community health issues and strategies linked to SDGs"],["1\u20132","Identifies SDGs or community health issues"]],pts:["Named community + health issues with data","Links to each SDG","Examples from other communities","Strategies + advocacy","Explicit evaluation criteria and overall judgement"]}}},DOTS_FA2A={t1:{fa:"fa2",iq:0,v:"Explain",t:"Explain the importance of using a pre-exercise questionnaire and undertaking relevant health screening by exercise and health professionals",inc:[],big:"Screening before exercise identifies risk so that training is safe and tailored, rather than one-size-fits-all.",notes:[["What pre-exercise screening is","A **pre-exercise screening** process identifies people with medical conditions or risk factors that could make exercise unsafe. In Australia the **Adult Pre-Exercise Screening System (APSS)**, developed by Exercise & Sports Science Australia, Fitness Australia and Sports Medicine Australia, is the standard tool. **Stage 1** is a compulsory self-screening questionnaire. It asks about heart conditions, chest pain, dizziness or fainting, asthma, diabetes, bone, joint or muscle problems, and other medical conditions. **Stage 2** (optional) gathers risk factors: age, sex, family history, smoking, physical activity, body composition, blood pressure, cholesterol and blood glucose. **Stage 3** looks at medications, recent injuries and other considerations."],["Why it is important","**Safety:** it identifies people at risk of cardiac events, injury or complications, e.g. undiagnosed heart disease or uncontrolled asthma. **Referral:** a 'yes' answer means the person should get **medical clearance** from a GP before starting. **Individualised prescription:** results help set appropriate intensity, type and progression. **Baseline data** gives a starting point for monitoring. **Duty of care and legal protection** for the professional. **Builds trust** and helps the client understand their own health."],["Health screening by professionals","Exercise physiologists, physiotherapists, personal trainers and doctors may conduct further screening. This can include **resting heart rate and blood pressure**, **body composition** (waist circumference, BMI, skinfolds), **postural and movement screens** (e.g. the Functional Movement Screen), and **ECGs** for higher-risk or elite athletes. Elite sports often have cardiac screening programs to detect rare conditions that cause sudden cardiac death."]],con:[["APSS","Adult Pre-Exercise Screening System, Australia's standard 3-stage screening tool.","Stage 1 compulsory questionnaire"],["Medical clearance","Approval from a doctor before beginning exercise.","Required if any Stage 1 question is answered 'yes'"],["Risk stratification","Classifying a person's risk level to guide exercise intensity.","Low, moderate or high risk"],["Duty of care","The legal obligation to avoid foreseeable harm.","A trainer screening before a fitness test"]],flow:["Questionnaire","Identify risk","Refer / clear","Tailored program","Safe progression"],sum:["The APSS is Australia's standard: Stage 1 compulsory, Stages 2\u20133 for risk factors and other considerations.","A 'yes' on Stage 1 \u21
