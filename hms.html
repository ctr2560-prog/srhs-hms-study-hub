This sharing of responsibility matters because each level reaches people in a different way: the federal level provides funding, the states deliver services, local councils shape the environment, and NGOs bring community trust and specialist knowledge. However, shared responsibility can also lead to fragmentation and cost-shifting between levels. This is why collaboration and clear funding agreements are essential.`,h8:`Person-centred healthcare means care that is organised around the needs, preferences and goals of the individual rather than around the system. Government and non-government organisations collaborate to achieve this by combining funding with community expertise.

One example is headspace, the national youth mental health service. The federal government funds headspace through Primary Health Networks (PHNs), while non-government lead agencies operate the centres. Young people aged 12\u201325 can access mental health, physical health, alcohol and drug, and work and study support in one youth-friendly place, so they do not need to navigate several separate services.

A second example is Aboriginal Community Controlled Health Organisations (ACCHOs). Governments fund these organisations, but they are run by local Aboriginal communities. This allows them to provide culturally safe, holistic care, often including transport, health checks and social support.

This collaboration benefits patients through continuity of care and fewer gaps between services, so people are more likely to engage with care and stay in it.`,h9:`Health expenditure in Australia is about 10% of GDP and is rising faster than the economy. How this money is spent strongly affects both the sustainability and the equity of the healthcare system, now and in the future.

On one hand, current expenditure supports equity. Spending on Medicare and the PBS means Australians can access GP care, public hospitals and essential medicines regardless of income. For example, concession card holders pay a low, capped amount for PBS medicines. Government funding, which accounts for about two-thirds of total health spending, comes from taxation including the Medicare levy, which spreads costs across the population according to income. Incentives for private health insurance, such as the rebate and the Medicare levy surcharge, encourage people who can afford it to use the private system. This reduces pressure on public hospitals.

On the other hand, the way money is spent creates inequities and sustainability problems. Most expenditure goes to treating illness, with only about 2% spent on prevention, even though much of the burden of disease comes from preventable chronic disease. The National Preventive Health Strategy aims to raise this to 5%, but until then the system pays for expensive treatment that could have been avoided. Out-of-pocket costs, which make up a large share of spending, fall heavily on low-income households, especially for dental care and specialists, so people delay care and later need more costly treatment. Private insurance subsidies also mostly benefit higher-income earners, which raises concerns about equity.

For future populations, the Intergenerational Report projects that an ageing population, chronic disease and costly new technologies will keep increasing health spending as a share of the budget. This raises questions about whether current spending patterns can be sustained.

On balance, current expenditure provides a strong foundation for equity, but it is not sustainable in its present form. Shifting more funding to prevention and primary care, and reducing out-of-pocket costs for low-income Australians, would improve both sustainability and equity for future generations.`,h10:`Complementary healthcare approaches, such as naturopathy, chiropractic, acupuncture, massage and vitamin, mineral and herbal supplements, are used by a large proportion of Australians.

People use them for several reasons. Many people with chronic conditions, such as back pain or arthritis, use them because conventional medicine has not fully relieved their symptoms. Others use them to prevent illness and maintain wellbeing, for example by taking fish oil or vitamin D. Many value the holistic approach, which considers the whole person, and the longer consultations, which give them a greater sense of control over their own health.

However, there are potential risks. Many products have limited scientific evidence that they work. In Australia, most complementary medicines are AUST L (listed) products, which are assessed for safety and quality but not for effectiveness, whereas AUST R (registered) medicines have been evaluated for efficacy. Some products interact with prescription medicines; for example, St John's wort can reduce the effectiveness of the contraceptive pill. A serious risk is that people delay or replace effective treatment, which can allow conditions such as cancer to progress. Costs can also be high, because most services are not covered by Medicare.

Therefore, consumers should use complementary approaches alongside, rather than instead of, evidence-based care, and should tell their doctor what they are taking.`,h11:`A critical health consumer is someone who has the health literacy to find, understand and evaluate health information and services before acting on them. This is especially important on social media, where anyone can post health claims and algorithms reward content that is popular rather than accurate.

Being a critical consumer matters because misinformation can cause real harm. For example, influencers promote 'detox' teas that act as laxatives, extreme diets and unproven supplements, which can lead to dehydration, disordered eating and wasted money. Misinformation can also lead people to delay effective treatment or reject vaccination, which harms their health and the health of their community.

A critical consumer evaluates information against clear criteria. They check the source and the author's qualifications, look for evidence from reputable research rather than personal testimonials, check that the information is current, and consider the motive behind it, such as whether the poster earns money from sponsored products.

Australians are also protected by regulation. The TGA regulates therapeutic goods advertising, and reliable sources such as healthdirect and government health websites provide evidence-based information. Being a critical consumer means using these protections, which leads to safer decisions and better health outcomes.`,h12:`Australia's healthcare system faces several current and emerging challenges. Two of the most significant are health workforce shortages and declining access to affordable primary care.

The first challenge is workforce shortages, particularly of GPs, nurses and aged care workers, and particularly in rural and remote areas. Fewer medical graduates are choosing general practice, and many health workers left during and after the COVID-19 pandemic. As a result, people wait longer for appointments, and rural communities have far fewer GPs per person than major cities. The system is responding by expanding the scope of practice of other professionals. For example, pharmacists can now prescribe for some conditions, such as uncomplicated urinary tract infections, and nurse practitioners can provide more care independently. Rural incentives, bonded medical places and the expansion of telehealth also aim to increase access in regional areas.

The second challenge is the decline in bulk billing and rising out-of-pocket costs for GP visits. Because Medicare rebates did not keep pace with costs for many years, many practices stopped bulk billing. This meant some patients, particularly those on low incomes, delayed care and instead attended emergency departments, which increases pressure on hospitals. The government responded by tripling the bulk billing incentive for children, pensioners and concession card holders in 2023, and later expanding incentives to all Australians. It also opened Medicare Urgent Care Clinics, which provide free care for urgent but not life-threatening conditions.

These responses show that the system is adapting. However, their success depends on long-term investment in training a larger workforce, because short-term incentives alone cannot fully solve the shortages.`,h13:`The relationship between technology and the health of young Australians is complex, because technology can both improve and harm their health depending on how it is used.

There are clear positive effects. Technology gives young people fast access to health information and services. For example, headspace offers online and phone counselling through eheadspace, and telehealth allows young people in rural areas to see a psychologist without travelling. Fitness apps and wearables can increase physical activity by tracking steps and setting goals, and online communities can provide support to young people who feel isolated, such as LGBTQIA+ youth.

However, there are also significant negative effects. High screen time contributes to sedentary behaviour, and fewer than 1 in 10 young Australians meet the physical activity guidelines. Using devices late at night disrupts sleep by delaying the release of melatonin, which in turn affects mood, concentration and mental health. Social media exposes young people to cyberbullying, idealised body images and health misinformation, which are linked to body dissatisfaction, anxiety and disordered eating.

Governments are responding through regulation. For example, the social media minimum age law requires platforms to prevent under-16s from holding accounts, and the eSafety Commissioner can order harmful content to be removed. Equity is also a factor, as young people in low-income or remote households may lack reliable internet, so they miss out on the benefits of digital health.

On balance, technology itself is not harmful. Its effect on health depends on how it is used. Its benefits are greatest when young people develop digital health literacy and when platforms are regulated to reduce harm.`,h14:`One new technology that is changing the Australian healthcare system is the virtual hospital, such as RPA Virtual Hospital in Sydney, which opened in 2020, and the virtualKIDS service for children.

Virtual hospitals provide hospital-level care to patients in their own homes. Patients are given devices that remotely monitor vital signs, such as heart rate, blood pressure and oxygen levels, and the data is sent to clinicians in a central care hub. Nurses and doctors check in by video and phone, and they can escalate care or arrange a transfer to hospital if the patient's condition worsens.

This technology benefits patients because they can recover in the comfort of their own home, which reduces their risk of hospital-acquired infections and the disruption to their family and work. It also benefits the system by freeing up physical hospital beds and reducing emergency department congestion. It can extend care to people in rural areas who would otherwise travel long distances.

However, there are challenges. The technology requires reliable internet, a suitable home environment and digital literacy, so some patients, particularly older people and those in remote areas with poor connectivity, may not be able to use it. It also requires investment in devices, staff training and data security.

Overall, my investigation shows that virtual hospitals are significantly improving the efficiency and reach of hospital care. The implication is that the healthcare system is shifting from a hospital-centred model to one where acute care can be delivered in the community, which in turn increases capacity as demand grows from an ageing population. However, equity of access must be addressed so that this model benefits all Australians.`,h15:`Digital health is the use of digital technologies, such as electronic records, telehealth, apps and wearable devices, to deliver and improve health care. Overall, digital health has had a largely positive impact on the Australian healthcare system. However, its effectiveness is limited by uneven connection, privacy risks and the digital divide.

Its most significant strength is improved access to care. Telehealth, which became a permanent part of Medicare in 2022, allows patients to consult GPs and specialists by video or phone. This is highly effective for people in rural and remote areas, who would otherwise travel long distances, and for people with disabilities or chronic conditions. Electronic prescriptions, sent by SMS, and healthdirect's 24/7 advice line further increase convenience, while virtual hospitals allow patients to receive care at home, freeing hospital beds.

Digital health also improves the quality and safety of care. My Health Record, which most Australians have, allows clinicians to see a patient's medicines, allergies and test results, which leads to fewer duplicated tests and medication errors. However, its effectiveness is limited, because not all providers upload information and many systems are not yet interoperable, so information is often incomplete. For individuals, apps and wearables support self-management of conditions such as diabetes, while organisations use the data to plan services.

There are significant challenges. Health data is highly sensitive, and cyber attacks, such as the 2022 Medibank breach, have reduced public trust. The digital divide means older people, low-income households and people in remote areas with poor internet are less able to benefit, so digital health can widen existing inequities. Establishing and maintaining digital systems also requires substantial investment.

On balance, digital health is highly effective in improving access, convenience and efficiency, and it will be essential for a sustainable system. However, its full benefit depends on better interoperability, stronger privacy protections and closing the digital divide so that all Australians can benefit.`,h16:`Artificial intelligence (AI) and health data have significant potential to improve health outcomes in Australia, but their benefits depend on strong protections for privacy.

AI is already being used in several ways. In medical imaging, AI tools analyse X-rays, mammograms and skin images to detect conditions such as breast cancer and melanoma, sometimes earlier than a clinician alone. AI scribes record and summarise GP consultations, which allows doctors to spend more time with patients and less time on paperwork. Predictive tools analyse large data sets to identify patients at high risk of deterioration in hospital or of developing chronic disease.

These uses improve health outcomes because earlier diagnosis leads to earlier treatment and better survival, and predictive tools allow chronic conditions to be managed before they become serious. They can also reduce spending by preventing hospital admissions and making clinicians more efficient.

However, health data is highly sensitive, so privacy must be protected. In Australia, the Privacy Act 1988 and the My Health Records Act regulate how health information is collected and shared. Patients must give consent, and data used for research is de-identified so individuals cannot be recognised. Strong cybersecurity is also essential to prevent breaches.

There are still risks. Large breaches, such as the 2022 Medibank breach, show that data can be stolen. AI can also be biased if it is trained on data that under-represents some groups, which may lead to less accurate diagnoses for those groups. Therefore, AI can improve health outcomes significantly, but only if it is supported by clear regulation, transparency and ongoing human oversight.`,h17:`The Sustainable Development Goals (SDGs) were adopted by all United Nations member states in 2015 as a shared plan for people, the planet and prosperity. There are 17 goals with 169 targets, which countries aim to achieve by 2030. The SDGs are universal, meaning they apply to all countries, including high-income countries such as Australia. They are integrated, meaning progress on one goal affects the others. Their central principle is to 'leave no one behind', which means the most disadvantaged groups should be reached first.

SDG 3 aims to ensure healthy lives and promote wellbeing for all at all ages. Its targets include reducing deaths from non-communicable diseases by one-third, reducing road traffic deaths and achieving universal health coverage.

SDG 4, quality education, contributes to SDG 3 in several ways. Education improves health literacy, so people are better able to understand health information, use health services and make healthy choices, such as not smoking. Education also leads to better employment and higher income, which provide better housing, nutritious food and access to health care. For example, school-based health and physical education programs teach young people about nutrition and physical activity. Educated mothers are also more likely to have their children vaccinated, which lowers child mortality. Therefore, improving education is one of the most effective long-term strategies for improving health.`,h18:`Applying SDGs 3, 4, 10 and 11 can strongly inform community action in Western Sydney, a community I have studied. To evaluate this, I will use three criteria: whether the action targets the community's main health issues, whether it reduces inequity, and whether it is sustainable.

Western Sydney experiences higher rates of obesity, type 2 diabetes and cardiovascular disease than the Sydney average. In some areas, diabetes rates are close to double those in parts of the eastern suburbs. Applying SDG 3 (good health and wellbeing) informs action by focusing on its target of reducing deaths from non-communicable diseases. This is highly effective because it directs action at the community's leading causes of illness, such as through diabetes screening programs. SDG 4 (quality education) informs action through health literacy programs in schools and community languages, because many residents speak a language other than English at home. SDG 10 (reduced inequalities) highlights that health problems are concentrated in low-income and culturally diverse groups. This ensures that actions such as affordable healthy food programs reach those who need them most. SDG 11 (sustainable cities) informs action on the built environment. Much of Western Sydney lacks walkable neighbourhoods, shade and public transport, and has fewer green spaces, which reduces physical activity and increases heat exposure.

Communities can learn from others. For example, the Western Sydney Diabetes initiative brings health services, councils and community organisations together. Other cities have increased physical activity by creating connected bike paths and green corridors. Community members can advocate to local councils for more parks, shade and safe walking routes, and work with schools and community leaders on health education.

Against my criteria, applying the four SDGs together is highly effective, because it targets both the health issues and their underlying causes, and it prioritises the most disadvantaged groups. However, its sustainability is limited by funding and the need for long-term commitment from all levels of government. Overall, the SDGs provide a powerful framework, but their impact depends on community leadership and ongoing investment.`},MODELS_FA2={t1:`Pre-exercise screening, such as the Adult Pre-Exercise Screening System (APSS), is important because it identifies people who may be at risk of an adverse event before they begin a new training program. The questionnaire asks about heart conditions, chest pain, dizziness, blood pressure, diabetes, pregnancy and previous injuries, because these conditions increase the risk of a cardiac event or injury during exercise.

If a risk is identified, the person can be referred for medical clearance from a GP before starting, which prevents harm, for example by detecting undiagnosed heart disease. Screening also provides a baseline of the person's health, goals and injury history, which allows the program to be individualised, such as starting at a lower intensity for an inactive person with high blood pressure. Finally, screening fulfils the trainer's duty of care and legal responsibilities, as it shows that reasonable steps were taken to keep the client safe.`,t2:`Fitness testing measures components of fitness, such as aerobic capacity, strength and speed. It is used by both recreational participants and elite athletes to establish a baseline, design a program and monitor progress, although the purpose and methods differ significantly.

For recreational participants, testing is mainly used to establish a baseline, set realistic goals and motivate. Tests should be safe, simple and low-cost, such as a 2.4 km walk, a sit-and-reach test or push-ups. A major advantage is motivation: seeing improvement can encourage adherence to exercise, which leads to better health. However, maximal tests such as the beep test may be unsafe for inactive people with health risks, and a poor result can discourage some participants.

For elite athletes, testing is more frequent, more precise and sport-specific. Laboratory tests such as VO2 max testing, lactate testing and force plates provide highly valid and reliable data. Team sports use field tests such as the Yo-Yo intermittent recovery test, and the results are used to select teams and set training intensities, such as heart rate zones. They also guide periodisation and identify imbalances, which helps to prevent injury. However, this testing is costly and time-consuming, and too much testing can interfere with training.

For both groups, testing is only useful if the tests are valid, reliable and repeated under the same conditions. Overall, fitness testing is valuable for both groups, but recreational testing should focus on safety and motivation, whereas elite testing is a precise tool for maximising performance.`,t3:`Exercise assessment assists a coach because it provides objective data that is used to design, monitor and adjust an individualised training program. This follows a cycle: screen the athlete, assess fitness, complete a needs analysis, set goals, prescribe training and re-test.

For example, a coach of a 400 m runner would assess anaerobic capacity with a 300 m time trial, speed with a 40 m sprint and aerobic fitness with a lactate threshold test. If the assessment showed that the athlete's speed was strong but they slowed significantly in the final 100 m, the coach would identify lactic acid tolerance as a weakness. As a result, the program would include more anaerobic interval training, such as 6 \xD7 300 m runs at 90% effort with limited recovery, because this trains the body to tolerate and buffer hydrogen ions.

Assessment also allows the coach to set precise training intensities, such as heart rate zones from a VO2 max test or loads based on a percentage of a 1RM for strength training, which ensures the overload is appropriate. Assessments of flexibility and muscle imbalance help prevent injury, while re-testing every 6\u20138 weeks shows whether the program is working, so it can be adjusted.`,t4:`In rugby league, players need anaerobic power for tackles and sprints, aerobic fitness to recover between efforts over 80 minutes, and high levels of strength and muscular endurance. Two relevant training methods are high-intensity interval training (HIIT) and resistance training.

HIIT is highly relevant to rugby league. It involves short bouts of near-maximal work, such as 10 \xD7 40 m sprints with 20 seconds of recovery, which closely replicates the repeated-effort demands of a game. HIIT trains the ATP-PC and anaerobic glycolysis systems while also improving aerobic capacity, which speeds up recovery between efforts. As a result, a player can make repeated tackles and sprints late in the game without their performance declining. HIIT is also time-efficient, which is valuable during the in-season.

Resistance training is also highly relevant, as rugby league involves physical collisions. Exercises such as squats, bench press and power cleans increase strength and power, which allows a player to win tackles, break through defensive lines and resist fatigue in contact. It also strengthens muscles and connective tissue around the joints, which reduces injury risk, a key priority in a collision sport.

Both methods are highly relevant, but HIIT is arguably the most important for game performance because it trains the specific energy system demands of the game. However, resistance training is essential for injury prevention. Therefore, an effective program combines both methods, with the balance changing across the season.`,t5:`Progressive overload and specificity are two of the most important principles of training. When applied correctly, they are highly effective in improving both aerobic and strength performance, although each has limitations if misapplied.

Progressive overload means gradually increasing the training load so that the body continues to adapt. In aerobic training, this is applied by increasing the distance, duration or intensity, for example by increasing a runner's weekly distance by about 5\u201310% per week, or by increasing interval pace. This is highly effective because it continually stresses the cardiovascular system, which leads to adaptations such as increased stroke volume and VO2 max. In strength training, overload is applied by adding weight once the athlete can complete all prescribed sets and repetitions, for example progressing from 3 \xD7 8 at 80 kg to 3 \xD7 8 at 82.5 kg. This leads to muscle hypertrophy and improved neural recruitment. However, overload is only effective if it is gradual. Increasing load too quickly is ineffective, as it leads to overtraining, fatigue and injury such as stress fractures, so recovery must be built in.

Specificity means training must match the demands of the sport, including its energy systems, muscles and movement patterns. In aerobic training, a marathon runner should complete long, continuous runs at race pace to train the aerobic system, rather than relying on cycling. In strength training, specificity means choosing exercises that replicate the movement and speed of the sport, such as power cleans and jump squats for a sprinter, rather than slow machine exercises. This is highly effective because the adaptations transfer directly to performance. However, too narrow a focus can lead to muscle imbalances and overuse injuries, so some general training is still valuable.

Overall, both principles are essential and effective to a large extent. They are most effective when applied together, as overload drives adaptation and specificity ensures the adaptation improves performance in the athlete's sport.`,t6:`Aerobic training, such as continuous and interval running, leads to physiological adaptations when the principles of progressive overload, specificity and training thresholds are applied. Training must occur in the aerobic training zone of about 70\u201385% of maximum heart rate, at least three times a week over several weeks.

The first adaptation is an increase in stroke volume, the amount of blood pumped from the left ventricle with each beat. Repeated aerobic training increases the size of the left ventricle, so it fills with more blood and contracts more forcefully. Because more blood is pumped per beat, the heart does not need to beat as often, which leads to a lower resting and submaximal heart rate. As a result, the athlete can work at the same pace with less effort.

The second adaptation is an increase in VO2 max, the maximum amount of oxygen the body can take in and use per minute. This increases because of greater cardiac output, increased capillary density around the muscles and more mitochondria in muscle cells, so more oxygen is delivered to and used by the working muscles.

The relationship between these adaptations and performance is direct. Together, they mean more energy is produced aerobically, so the athlete relies less on anaerobic glycolysis and accumulates less lactate. For example, a 10 km runner can sustain a faster race pace for longer before fatigue sets in, which improves their race time. This shows that aerobic training produces adaptations that work together to improve endurance performance.`,t7:`When designing a training session, a coach must consider the same core aspects for an individual sport, such as tennis, and a group sport, such as netball. However, the way each aspect is applied differs significantly.

In both sports, the session must have a clear aim linked to the training program, such as improving serve accuracy in tennis or defensive pressure in netball. Similarly, safety is essential in both. The coach must check the surface, equipment and weather, and ensure correct technique. However, safety management is more complex in netball because more players are moving in a limited space, so there is a greater risk of collisions, which requires closer supervision.

Both sessions require a warm-up and cool-down. In tennis, the warm-up can be individualised to the player's movement patterns, such as lateral footwork and shoulder mobility. In contrast, a netball warm-up is conducted as a group and must prepare all players for sprinting, jumping and landing, while also building team focus.

Skill instruction differs significantly. In tennis, the coach can give one-on-one feedback and closely refine a single player's technique, such as the ball toss on the serve. Whereas in netball, the coach must manage players with different positions and abilities, so skill work is often organised in small groups based on position, such as shooting practice for goalers.

Conditioning also differs. A tennis session may target the player's own energy system demands, such as repeated short sprints with recovery. In contrast, netball conditioning must suit all players, although it can be modified by position, as centres need greater aerobic fitness than goalkeepers.

Strategies and tactics are a key difference. In tennis, the coach focuses on the individual's game plan against a specific opponent. In contrast, netball sessions must develop team strategies, such as centre pass set plays and zone defence, which require communication and cohesion between players.

Finally, both sessions should end with reflection. In tennis, the player and coach review the session together. Whereas in netball, the coach must gather feedback from the whole team. Overall, both sessions share the same structure, but group sport sessions are more complex because they must balance individual needs with team goals.`,t8:`A yearly training program is divided into phases to ensure athletes reach peak performance at the right time. Comparing an individual sport, such as 1500 m swimming, with a group sport, such as Australian Football (AFL), shows that both use similar phases, but they differ in timing, peaking and emphasis.

Both programs are divided into similar phases: the off-season (transition), pre-season, in-season (competition) and back to transition. Both also use macrocycles, mesocycles and microcycles to plan and progress training, and both begin with general preparation before moving to specific preparation.

However, the timing and length of the phases differ. The swimmer's year is built around one or two major target meets, such as the national championships and Olympic trials, so the program may contain two shorter peaks. In contrast, the AFL program has one long pre-season of about 12\u201316 weeks, followed by a 24-round in-season that lasts around six months.

Peaking and tapering are a key difference. The swimmer reduces training volume by about 40\u201360% over 1\u20133 weeks before their target meet, while maintaining intensity, so they reach a single, precise peak. In contrast, an AFL player cannot peak for one event. Instead, the aim is to maintain a high level of performance every week across the season, with a small taper only before finals.

The fitness and skill emphasis also differs. The swimmer's pre-season includes a high volume of aerobic training, for example 50\u201370 km per week in the pool, with sport-specific technique work. Whereas the AFL player's pre-season balances aerobic base training, repeated sprint ability, strength and team skills such as kicking, marking and set plays. During the in-season, the AFL focus shifts to recovery and maintenance, because weekly games create cumulative fatigue. Whereas the swimmer can continue to build fitness between meets.

Overall, both yearly programs follow the same periodisation principles. However, the swimmer's program is built around a precise individual peak, while the AFL program aims to sustain team performance across a long competition period.`,t9:`Arousal is the level of physical and mental activation of an athlete, while anxiety is a negative emotional state of worry and nervousness. Anxiety can be trait anxiety (a general tendency to be anxious) or state anxiety (anxiety in a specific situation). According to the inverted-U hypothesis, performance is best at a moderate, optimal level of arousal, so psychological strategies are used either to raise arousal or to calm an over-aroused, anxious athlete.

In an individual sport such as golf, the optimal level of arousal is low, because putting requires fine motor control and concentration. If a golfer becomes anxious, muscle tension increases, which leads to a poor stroke. Relaxation techniques such as deep breathing and progressive muscle relaxation lower heart rate and muscle tension. A consistent pre-shot routine and mental rehearsal, where the golfer visualises the putt, focus attention on the task rather than the outcome. Positive self-talk, such as 'smooth stroke', replaces negative thoughts.

In a group sport such as rugby union, the strategies differ because the optimal arousal level is generally higher and varies by position. A forward preparing for scrums and tackles needs high arousal, so psych-up strategies such as music, team talks and energising self-talk are used. In contrast, the goal kicker needs low arousal, so they use a routine and breathing, similar to the golfer. Group sports also involve team-based strategies. Goal setting as a team and building cohesion reduce anxiety, because players trust one another and feel less pressure as individuals.

My investigation shows that the same strategies are used in both types of sport, but they must be individualised to the athlete, the skill and the position, rather than applied uniformly. Overall, these strategies are highly effective when they are practised in training until they become automatic, because an athlete who can control their own arousal is far more likely to perform at their best under pressure.`,t10:`A strategy is an overall plan that is prepared before competition to achieve a goal, while a tactic is a specific action used during competition to carry out the strategy. Several factors influence how both are applied, and these differ between individual and group sports.

In an individual sport such as tennis, the opponent is a key factor. If an opponent has a weak backhand, the player's strategy might be to target that side, and the tactic would be to hit deep cross-court shots to the backhand. The player's own ability also matters, as a strong server will use a serve-and-volley strategy. Conditions such as the surface and wind influence decisions; for example, a player might use more topspin on a slow clay court. The advantage in an individual sport is that the player can change tactics immediately, without needing to communicate with teammates.

In a group sport such as soccer, the same factors apply, but the application is more complex. A team may use a high-pressing strategy against a team that is weak at playing out from the back, but this depends on the fitness and ability of all players. The game situation is very significant. For example, a team that is leading late in the game may switch to a defensive formation to protect the lead. However, changes must be communicated, often through the coach and captain, and every player must understand their role, so tactics are harder to change quickly.

In conclusion, strategies and tactics in both types of sport are influenced by the opponent, ability, conditions and game situation. The most successful athletes and teams are those that remain flexible and adapt their tactics as the game unfolds.`,t11:`Research from the Australian Institute of Sport (AIS) and Sports Dietitians Australia shows that the nutritional and fluid requirements of an endurance athlete, such as a marathon runner, differ significantly from those of a strength/power athlete, such as a weightlifter. These differences come from the different energy systems and training demands of each sport.

Carbohydrate is the main difference. Endurance athletes rely heavily on muscle glycogen, so they need about 6\u201310 g of carbohydrate per kg of body mass per day. For events lasting longer than 90 minutes, they use carbohydrate loading, increasing intake to 10\u201312 g/kg for 36\u201348 hours before the race, while tapering training. This maximises glycogen stores, which delays fatigue and 'hitting the wall'. In contrast, strength/power athletes rely mainly on the ATP-PC system and anaerobic glycolysis for short efforts, so their carbohydrate needs are lower, at about 4\u20137 g/kg per day.

Protein requirements also differ. Strength/power athletes need about 1.6\u20132.0 g/kg per day to support muscle hypertrophy and repair. This should be spread across the day in serves of 20\u201340 g, including soon after training, because this maximises muscle protein synthesis. Endurance athletes need less, at about 1.2\u20131.6 g/kg, mainly to repair muscle damage from long training sessions.

Timing before, during and after exercise also differs. Before exercise, the endurance athlete eats a high-carbohydrate, low-fat meal 2\u20134 hours before, while the strength athlete prioritises carbohydrate and protein. During a marathon, the endurance athlete consumes 30\u201390 g of carbohydrate per hour through gels and sports drinks, which is unnecessary for a short weightlifting session. After exercise, both need recovery nutrition. However, the endurance athlete prioritises carbohydrate to refuel glycogen, whereas the strength athlete prioritises protein.

Fluid requirements are greater for endurance athletes. Research shows that a fluid loss of more than 2% of body mass impairs performance, which is more likely in long events in hot conditions. Endurance athletes should therefore drink to a planned schedule and use electrolyte drinks to replace sodium. Both athletes should monitor hydration by weighing themselves before and after exercise and checking urine colour, and replace 125\u2013150% of fluid lost.

This analysis shows that nutrition must be specific to the energy demands of each sport, and that the key difference is the greater carbohydrate and fluid needs of the endurance athlete compared with the higher protein needs of the strength/power athlete.`,t12:`Sleep, nutrition and hydration are essential recovery strategies because they restore the body after training, which reduces fatigue and lowers the risk of injury.

Sleep is the most important recovery strategy. Athletes should aim for 8\u201310 hours per night. During deep sleep, the body releases growth hormone, which repairs muscle tissue and restores energy. Research shows that athletes who sleep fewer than 8 hours have a significantly higher risk of injury, because fatigue slows reaction time, impairs coordination and decision-making, and reduces concentration. A consistent routine, such as a regular bedtime and no screens before bed, improves sleep quality.

Nutrition reduces fatigue by replenishing energy stores and repairing tissue. Carbohydrate after training refuels muscle glycogen, so the athlete is not fatigued at the next session, while protein of about 20\u201340 g after training repairs muscle damage. Micronutrients are also important. For example, calcium and vitamin D maintain bone density, which reduces the risk of stress fractures, and iron prevents fatigue caused by low haemoglobin.

Hydration is important because a fluid loss of more than 2% of body mass increases heart rate and body temperature and reduces concentration. This leads to early fatigue and poor technique, which increases the chance of injury. Athletes should replace 125\u2013150% of fluid lost after exercise.

Athletes and support staff can monitor these strategies using sleep trackers, food diaries and pre- and post-training body weight and urine colour checks. This allows problems to be identified early, which helps prevent fatigue and injury.`,t13:`Caffeine and creatine are two of the most widely used supplements in sport. Both are classified by the Australian Institute of Sport (AIS) as Group A supplements, meaning there is strong evidence that they improve performance in specific situations. However, both have risks.

Caffeine is a stimulant that acts on the central nervous system. It blocks adenosine receptors, which reduces the perception of fatigue and effort and increases alertness. Research shows that a dose of about 3\u20136 mg per kg of body mass, taken around 60 minutes before exercise, improves endurance performance, such as cycling and running, and can also improve concentration and reaction time in team sports. However, caffeine has side effects. It can cause anxiety, gastrointestinal upset and an increased heart rate, and if taken late in the day it disrupts sleep, which harms recovery. Responses also vary greatly between individuals.

Creatine is used to increase stores of phosphocreatine in the muscles, which is used to resynthesise ATP in the ATP-PC system. This allows athletes to recover faster between short, high-intensity efforts, so it benefits repeated-sprint sports and strength training, increasing training quality and gains in strength and muscle mass. Athletes typically load with about 20 g per day for 5 days, then take 3\u20135 g per day. However, it often causes a weight gain of 1\u20132 kg from water retention, which can be a disadvantage in endurance or weight-category sports, and it provides no benefit for endurance performance.

A key risk for both is contamination. Supplements may contain banned substances, and under strict liability the athlete is responsible for any positive test. This is why athletes should only use batch-tested products.

On balance, both supplements can be effective when used for the right sport and at the right dose, but they should only be used under the guidance of a sports dietitian and should not replace good nutrition, sleep and training.`,t14:`In basketball, biomechanical principles can be applied to develop a more efficient jump shot, which improves accuracy and reduces wasted energy.

The first principle is the summation of forces. Force is generated by the sequential and timed use of body parts, from the largest and slowest to the smallest and fastest. In a jump shot, force begins in the legs, transfers through the hips and trunk, then to the shoulder, elbow and finally the wrist and fingers. When this sequence is well timed, the maximum force is transferred to the ball with minimal effort. This allows the player to shoot from long range without straining their arm.

The second principle is projectile motion, which explains how the release angle, height and speed determine the ball's path. A higher release point makes the shot harder to block, and a release angle of about 45\u201355 degrees creates a high arc. As a result, the ball enters the hoop at a steeper angle, which increases the size of the target and the chance of scoring.

Coaches use video analysis, often in slow motion with apps such as Hudl Technique, to measure release angles and identify breaks in the kinetic chain, then give the player feedback. Efficient technique not only improves performance but also reduces the risk of injury, because force is spread across large muscle groups rather than overloading the shoulder.`,t15:`In a weekly team-sport competition such as rugby league, players have only 5\u20137 days between games to recover from muscle damage, energy depletion and mental fatigue. Without effective recovery, fatigue accumulates and both performance and injury risk worsen as the season progresses. Cold water immersion and relaxation are two well-supported strategies.

Cold water immersion (CWI), a physiological strategy, involves sitting in water at about 10\u201315 \xB0C for 10\u201315 minutes after a game. The cold causes blood vessels to constrict, which reduces swelling and inflammation, and the water pressure helps remove metabolic waste. Research shows that CWI reduces muscle soreness and the perception of fatigue in the days after a game, so players can return to quality training sooner. This makes it highly suitable for a collision sport with a weekly schedule. However, CWI should not be used immediately after strength training sessions, as it may reduce strength adaptations.

Relaxation techniques, such as progressive muscle relaxation and breathing exercises, are a psychological strategy. They involve tensing and then relaxing muscle groups while controlling breathing. This lowers heart rate and stress hormones, which reduces mental fatigue and anxiety and improves sleep quality. Better sleep is essential because it is when tissue repair occurs.

Using both strategies is justified because a weekly competition creates both physical and mental fatigue. Together, they help the player recover fully each week, which allows them to sustain a high level of performance across the season.`,t16:`Technology for recording and monitoring training allows coaches and athletes to make decisions based on objective data, which can improve performance and reduce injury.

GPS units are worn by players in sports such as AFL and rugby league to measure total distance, high-speed running and accelerations. Coaches use this data to monitor training load and calculate the acute:chronic workload ratio. If a player's load increases too quickly, their risk of injury rises, so the coach can reduce their training. This allows players to stay available for selection and perform consistently across the season.

Video analysis is used in almost all sports to improve technique and tactics. For example, a swimmer's stroke can be filmed underwater and analysed in slow motion, which allows the coach to correct inefficiencies, while netball teams review game footage to identify weaknesses in their defensive structure and plan tactics for the next opponent.

Heart rate monitors and wearables, such as WHOOP straps, measure training intensity and heart rate variability (HRV). A drop in HRV can indicate fatigue or illness, so training can be adjusted before overtraining occurs, which improves recovery.

However, there are limitations. The technology can be expensive, which makes it less accessible to amateur athletes. Large amounts of data can lead to data overload if coaches lack the expertise to interpret it, and collecting personal health data raises privacy concerns. Therefore, monitoring technology is highly valuable, but only when the data is analysed correctly and used to guide decisions alongside the coach's judgement.`,t17:`Managing a soft tissue injury, such as a grade 2 hamstring strain, involves a clear process from the moment the injury occurs through to the athlete's return to play. Following this process ensures the injury heals properly and reduces the risk of re-injury.

The first step is to classify the injury. Soft tissue injuries include sprains, strains, contusions and abrasions, whereas hard tissue injuries involve bones and joints. Correct classification is important because it determines the treatment.

The second step is to assess the injury using TOTAPS. The first aider Talks to the athlete about what happened and where it hurts, Observes for swelling, bruising and deformity, and Touches the area to locate pain. The athlete then completes Active movement, then Passive movement with assistance, and finally a Skill test. If pain occurs at any stage, the athlete is removed from play. This prevents further damage from playing on with an injury.

The third step is immediate management using RICER for the first 48\u201372 hours: Rest, Ice for about 15\u201320 minutes every two hours, Compression with a firm bandage, Elevation above the heart, and Referral to a physiotherapist or doctor. This reduces bleeding and swelling, which limits tissue damage and speeds up healing. The athlete must also avoid No HARM factors \u2014 Heat, Alcohol, Running and Massage \u2014 because they increase blood flow and swelling.

The fourth step is rehabilitation. After about 72 hours, heat may be used to increase blood flow and promote healing. The athlete then progresses through mobilisation, such as gentle stretching to restore range of motion; graduated exercise, such as strength work and jogging that builds to sprinting; and sport-specific skills, such as change of direction drills. Each stage is only progressed when the athlete can complete it without pain.

The final step is the return to play. The athlete must meet clear criteria: full range of motion, strength similar to the uninjured leg, the ability to perform sport-specific skills at full speed without pain, and psychological readiness. Medical clearance from a doctor or physiotherapist is required. Returning too early is a major cause of re-injury, which is why this decision must be shared between the athlete, medical staff and coach.`,t18:`Drug use in sport raises serious ethical and health concerns. Drug testing is the main way these concerns are addressed, although it has limitations.

Many performance-enhancing drugs have serious health effects. Anabolic steroids increase muscle mass and strength but can cause liver damage, heart disease, hormonal imbalances and aggression. Erythropoietin (EPO) increases red blood cell production to improve endurance, but it thickens the blood, which increases the risk of stroke and heart attack. Stimulants can cause heart problems and dependence. Drugs used to manage injury also raise concerns. Painkillers and anti-inflammatory drugs may allow an athlete to play on with an injury, which can turn a minor injury into a serious long-term one. Some drugs, such as diuretics, are used as masking agents to hide other drugs.

The ethical issues are significant. Using drugs to gain an advantage is cheating, because it undermines fair competition and the spirit of sport. Clean athletes may feel pressured to use drugs to remain competitive. In some cases, athletes are coerced by coaches or support staff, as in the Essendon supplements program, which led to 34 players being banned. Elite athletes are also role models, so drug use can influence young people.

Drug testing aims to address these issues. The World Anti-Doping Agency (WADA) sets the Prohibited List, and Sport Integrity Australia conducts testing in and out of competition. The Athlete Biological Passport monitors an athlete's blood and hormone markers over time, which can detect doping even when the drug itself is not found. Under strict liability, athletes are responsible for any substance in their body, even if it came from a contaminated supplement. Athletes with medical conditions can apply for a Therapeutic Use Exemption (TUE).

On balance, drug testing is effective in deterring and detecting many cases of doping and in protecting fair competition. However, it is limited by the development of new drugs, the high cost of testing, and the pressure athletes face to perform. Therefore, testing must be combined with education and a culture that values athletes' health over winning.`},MODELS_ER={er1:`Australia's healthcare system has been effective to a moderate extent in providing equity of access for groups experiencing health inequities. Universal schemes such as Medicare and the PBS have removed many financial barriers. However, for Aboriginal and Torres Strait Islander peoples and people living in rural and remote areas, access remains unequal because of cultural, geographical and workforce barriers. This is reflected in their poorer health outcomes.

Medicare and the PBS are the foundation of equity. Medicare provides free public hospital treatment and subsidises GP and specialist care, while the PBS caps the cost of essential medicines, at about $7.70 per script for concession card holders. These schemes are highly effective in principle, because access to essential care does not depend on income or private insurance. Expanded bulk billing incentives and Medicare Urgent Care Clinics have further reduced costs for low-income patients. Furthermore, specific measures exist for Aboriginal and Torres Strait Islander peoples, such as the Medicare-funded annual health check (Item 715) and the Closing the Gap PBS Co-payment Program, which reduces or removes the cost of medicines. These measures show that the system recognises the need for targeted, not just universal, access.

However, for Aboriginal and Torres Strait Islander peoples, universal access has not produced equal outcomes. A life expectancy gap of about 8 years remains, and the burden of disease is about 2.3 times that of non-Indigenous Australians. This is because access is not only about cost. Experiences of racism and a lack of cultural safety in mainstream services reduce trust, so people delay seeking care until conditions are advanced. Remoteness also means many communities have no permanent doctor, and the historical and socioeconomic determinants of health, such as overcrowded housing, lead to conditions such as rheumatic heart disease that the health system treats rather than prevents. The most effective response has been Aboriginal Community Controlled Health Organisations (ACCHOs). These organisations are run by local communities and provide culturally safe, holistic care, which leads to higher rates of health checks and engagement. However, they rely on government funding that is often short-term, which limits their effectiveness. Therefore, the system is only partly effective for First Nations peoples. Its most successful elements are community-controlled, yet these remain under-resourced.

People in rural and remote areas also experience significant inequity of access. They have fewer GPs and specialists per person, longer travel times and longer waits, and many towns have no regular access to dental care, mental health services or specialist cancer treatment. As a result, rural Australians have higher rates of potentially preventable hospitalisations and lower life expectancy than people in major cities. The system has responded with telehealth, which became permanent in Medicare in 2022, the Royal Flying Doctor Service, and rural workforce incentives such as bonded medical places. Telehealth has been highly effective in reducing distance barriers for consultations. However, it cannot replace physical examinations, surgery or emergency care, and it is limited by poor internet connectivity in many remote areas. Workforce incentives have had limited success, because shortages persist. Therefore, the system is moderately effective for rural populations, but location still largely determines access.

Across both groups, a common limitation is that the system is designed mainly for treatment rather than prevention, with only about 2% of health expenditure spent on prevention. Out-of-pocket costs for specialists, allied health and dental care, which are not well covered by Medicare, fall most heavily on low-income households. These households are over-represented among First Nations and rural Australians. This means equity of access is limited not only by distance and cultural safety but also by the gaps in what the universal system covers.

In conclusion, the healthcare system has been effective to a moderate extent. Medicare and the PBS provide a strong universal foundation, and targeted strategies such as ACCHOs and telehealth have improved access. However, persistent gaps in health outcomes for Aboriginal and Torres Strait Islander peoples and rural and remote Australians show that universal coverage is not enough. Greater equity requires sustained, community-led and culturally safe services, a stronger rural workforce and a greater investment in prevention.`,er2:`Digital health, artificial intelligence (AI) and health data are transforming the Australian healthcare system. Overall, their impact on the health of Australians and the sustainability of the system is largely positive, because they improve access, safety and efficiency. However, the extent of this impact is limited by privacy and cybersecurity risks, the digital divide and incomplete adoption, so careful regulation and investment are needed to realise their full value.

Digital health has had its greatest impact on access to care. Telehealth, which became permanent in Medicare in 2022, allows people to consult GPs, specialists and psychologists by video or phone. This is highly effective for rural and remote Australians, people with disabilities and young people, who can access headspace's online and phone counselling services. Electronic prescriptions and healthdirect's 24/7 advice line add convenience, while virtual hospitals, such as RPA Virtual Hospital, monitor patients at home, which reduces hospital admissions. These services improve health outcomes because people receive care earlier, rather than delaying until conditions become serious. However, the benefits are not shared equally. Older people, low-income households and people in remote areas with poor internet are less able to use digital services, so digital health can widen existing inequities unless the digital divide is addressed.

Health data has improved the safety and quality of care. My Health Record allows clinicians to see a patient's medicines, allergies and test results, which reduces medication errors and duplicated tests. Data also allows governments to identify trends, such as rising rates of diabetes in particular regions, and target resources accordingly. However, the impact of My Health Record has been limited, because not all providers upload information and many systems are not interoperable. This means records are often incomplete, which reduces clinicians' trust in them. Therefore, health data is valuable, but its effectiveness depends on better connection between systems.

AI has significant potential to improve health outcomes. AI tools that analyse medical images can detect conditions such as breast cancer, melanoma and diabetic eye disease earlier and more consistently, which leads to earlier treatment and better survival. Predictive tools identify patients at risk of deterioration, and AI scribes reduce the time GPs spend on paperwork, which allows them to see more patients and reduces burnout. However, AI raises important risks. If it is trained on data that under-represents groups such as Aboriginal and Torres Strait Islander peoples, it may be less accurate for them, which could worsen inequities. AI also requires clear accountability and human oversight, because errors in diagnosis have serious consequences.

Privacy and security are the most significant limitation across all three areas. Health information is highly sensitive, and large breaches, such as the 2022 Medibank cyber attack, which exposed the data of millions of customers, have reduced public trust. The Privacy Act 1988 and the My Health Records Act regulate consent and the use of health information, and research data is de-identified. However, if Australians do not trust the system, they may opt out, which limits the benefits of data sharing. Strong regulation and cybersecurity are therefore essential for these technologies to be effective.

In terms of sustainability, digital health, AI and health data are highly valuable. Health expenditure is about 10% of GDP and rising due to an ageing population and chronic disease. Technology helps manage this demand by reducing hospital admissions, supporting people to manage chronic conditions at home and improving the efficiency of the workforce. However, these technologies require significant upfront investment in infrastructure, training and security, and new technologies can also increase costs. Therefore, technology supports sustainability only when it is used to prevent illness and reduce the need for expensive care.

In conclusion, digital health, AI and health data have had a largely positive impact on the health of Australians and are essential to a sustainable healthcare system, particularly by improving access and efficiency. However, their impact is limited by privacy risks, incomplete adoption and the digital divide. Their full value will only be achieved if they are supported by strong regulation, investment in interoperability and strategies that ensure all Australians can benefit.`,er3:`The Sustainable Development Goals (SDGs) were adopted by the United Nations in 2015 as 17 integrated goals to be achieved by 2030, guided by the principle of 'leave no one behind'. Applying SDGs 3, 4, 10 and 11 to Western Sydney, a community I have studied, shows how these goals can inform community action. Because the goals are interrelated, the most effective action addresses them together rather than separately.

Western Sydney is a large, culturally diverse and fast-growing region. It experiences higher rates of obesity, type 2 diabetes and cardiovascular disease than the Sydney average, with diabetes prevalence in some areas close to double that of parts of the eastern suburbs. Many residents speak a language other than English at home. Some areas experience lower incomes and fewer health services, while much of the region has limited public transport, fewer green spaces and higher summer temperatures. These issues show that the community's health problems are connected to education, inequality and the urban environment, not only to individual behaviour.

SDG 3 (good health and wellbeing) informs community action by focusing on its target of reducing premature deaths from non-communicable diseases by one-third. Applying this goal means prioritising the community's leading causes of illness. For example, community diabetes screening, culturally appropriate healthy eating programs and partnerships between hospitals and GPs can detect and manage diabetes earlier. The Western Sydney Diabetes initiative is an example of this, as it brings health services, councils and community organisations together. However, SDG 3 alone tends to focus on treating illness. Its effectiveness therefore depends on the other goals, which address the causes of these conditions.

SDG 4 (quality education) is closely related to SDG 3, because education improves health literacy, employment and income, which in turn lead to better health. In Western Sydney, community action informed by SDG 4 could include health education in community languages, school-based nutrition and physical activity programs, and adult education about chronic disease. This is significant because improving health literacy allows people to understand health information, navigate services and make healthier choices. The implication is that investment in education produces long-term health gains, even though these take years to appear.

SDG 10 (reduced inequalities) highlights that the community's health problems are concentrated in disadvantaged groups. Applying this goal means directing action to the people with the greatest need, such as low-income families, recently arrived migrants and Aboriginal and Torres Strait Islander residents. Examples include subsidised healthy food programs, free or bulk-billed services and engaging community leaders to build trust. This relates directly to SDG 3, because reducing inequality addresses the social determinants that cause poorer health outcomes. Without SDG 10, community action could improve average health while leaving the most disadvantaged behind.

SDG 11 (sustainable cities and communities) informs action on the built environment, which strongly influences physical activity and health. The lack of walkable neighbourhoods, safe bike paths and public transport in parts of Western Sydney encourages car use and sedentary behaviour, which contributes to obesity. The lack of tree canopy also increases heat-related illness. Community members can advocate to local councils for more parks, shade, connected bike paths and access to public transport, learning from other communities that have increased activity by creating green corridors. This interacts with SDG 3, because an active, cooler environment reduces the risk of chronic disease for the whole population.

Analysing the four goals together shows that they reinforce one another. Education (SDG 4) and reduced inequality (SDG 10) address the causes of poor health, a healthier urban environment (SDG 11) makes healthy choices easier, and together these lead to the health outcomes targeted by SDG 3. The implication for Western Sydney is that community action should be coordinated across health services, schools, councils and community organisations, and should be co-designed with residents so that it meets local needs.

In conclusion, the application of SDGs 3, 4, 10 and 11 provides a strong framework for community action in Western Sydney. It directs attention to the root causes of chronic disease and to the most disadvantaged groups. However, the success of this action depends on long-term funding, community leadership and coordinated commitment from all levels of government.`,er4:`Australia's population is ageing. About 17% of Australians are aged 65 and over, and this is projected to rise to around 22\u201323% by the 2060s. This change presents significant challenges, particularly the rising burden of chronic disease and pressure on aged care and the health workforce. However, it also creates important opportunities. Overall, the challenges are significant but manageable, provided Australia invests in strategies that support healthy ageing rather than only responding to illness.

The most significant challenge is the increasing burden of chronic disease and multimorbidity. As people age, they are more likely to live with several conditions at once, such as arthritis, coronary heart disease, diabetes and dementia. Dementia is now a leading cause of death in Australia, and the number of people living with it is projected to roughly double by 2058. This leads to more GP visits, hospital admissions and medicines, which increases health expenditure. The Intergenerational Report projects that health and aged care will be among the fastest-growing areas of government spending. This challenge is highly significant, because a smaller proportion of working-age people will be paying taxes to support these costs.

A second major challenge is the demand for aged care and the workforce needed to provide it. More older people need support at home or residential care, but there are shortages of nurses, personal care workers and allied health professionals. The Royal Commission into Aged Care Quality and Safety (2021) found widespread failures in care. These were linked partly to understaffing and poor pay, which shows that workforce shortages directly affect the health and dignity of older Australians. Informal carers, many of whom are older themselves, provide a large share of care, which can harm their own physical and mental health. Therefore, the availability of carers is a critical challenge.

However, an ageing population also presents valuable opportunities. Older Australians contribute their knowledge, skills and experience in many ways. Many continue in paid work for longer, and they contribute billions of dollars each year through volunteering and grandparent childcare, which supports families and the economy. The growth of services for older people, the 'silver economy', creates jobs in health, leisure and technology. Most importantly, if healthy ageing is promoted, people live more years in good health, which reduces the time they spend needing high-cost care. This shows that the impact of ageing depends on how healthy people are as they age, not just on how many older people there are.

Several strategies are needed to support healthy ageing, and they vary in effectiveness. The new Aged Care Act places the rights and needs of older people at the centre of care, and the Support at Home program helps people live independently for longer. This is effective because most older people prefer to remain at home, and home care is less costly than residential care. However, waiting times for home care packages have been long, which reduces this effectiveness. Prevention strategies are highly effective in reducing future demand. For example, falls prevention programs that include strength and balance exercise reduce the risk of fractures, a major cause of hospitalisation and loss of independence. Promoting physical activity, healthy eating and social connection reduces the risk of chronic disease and dementia. Dementia-friendly communities and the National Dementia Action Plan support people to live well with dementia. Digital health, such as telehealth and remote monitoring, can help older people manage conditions at home, although its effectiveness is limited for those with low digital literacy.

Workforce strategies are also essential. Improving pay and conditions for aged care workers, increasing training places and supporting carers through respite services are necessary to meet demand. Without a strong workforce, other strategies cannot succeed.

In conclusion, an ageing population presents significant challenges for Australia's health, particularly chronic disease, the demand for aged care and workforce shortages. However, these challenges are outweighed by the opportunities if Australia supports healthy ageing. The most effective strategies are those that focus on prevention, independence and a strong aged care workforce, because they improve quality of life for older Australians while making the health system more sustainable.`,er5:`The principles of training, physiological adaptations and improved performance are directly related. When principles such as progressive overload, specificity, training thresholds and reversibility are correctly applied, they cause the body to adapt, and these adaptations lead to improved performance. Analysing a marathon runner (aerobic) and a weightlifter (strength-based) shows that the same principles apply to both, but they produce different adaptations because they are applied in different ways.

For the marathon runner, specificity means training must target the aerobic energy system and the movement pattern of running. Long, continuous runs at a steady pace, tempo runs at about lactate threshold, and aerobic intervals train the body to produce energy aerobically for over two hours. Training thresholds are central to this. The runner must train in the aerobic training zone of about 70\u201385% of maximum heart rate, because training below this threshold does not provide enough stimulus for adaptation. Progressive overload is applied by gradually increasing weekly distance by about 5\u201310% or increasing the pace of tempo runs, so the cardiovascular system is continually challenged.

These principles cause several key physiological adaptations. Repeated aerobic training increases the size of the left ventricle, which increases stroke volume. Because more blood is pumped per beat, resting and submaximal heart rates decrease, and cardiac output increases. Capillary density around the muscles increases and the number and size of mitochondria increase, so more oxygen is delivered to and used by the working muscles. As a result, VO2 max increases. Lactate threshold also increases, meaning the runner can work at a higher percentage of VO2 max before lactate accumulates.

The relationship between these adaptations and performance is clear. Because the runner can deliver and use more oxygen, they produce more energy aerobically and rely less on anaerobic glycolysis, so less lactate accumulates. This means they can sustain a faster pace for longer before fatigue sets in, which improves their race time. This shows that the training principles do not improve performance directly. They cause adaptations, and these adaptations are what improve performance.

For the weightlifter, the principles are applied differently. Specificity means training must target the muscles, movement patterns and the ATP-PC energy system used in lifts such as the snatch and clean and jerk. The weightlifter therefore uses heavy resistance training at about 80\u201395% of their one-repetition maximum (1RM), with low repetitions and full recovery between sets. Progressive overload is applied by adding load once the lifter can complete all prescribed sets and repetitions, such as progressing from 3 \xD7 3 at 120 kg to 3 \xD7 3 at 122.5 kg. Training thresholds for strength require loads high enough to recruit the largest motor units, which is why heavy loads are used.

These principles cause different adaptations. Muscle hypertrophy increases the cross-sectional area of muscle fibres, particularly fast-twitch fibres, so the muscle can produce more force. Neural adaptations also occur. The nervous system recruits more motor units and coordinates them more effectively, which explains why strength increases rapidly in the first weeks of training, before muscle size changes. Stores of ATP and creatine phosphate in the muscle also increase, and connective tissue, such as tendons, becomes stronger.

These adaptations are directly related to improved performance. Greater muscle size and neural recruitment allow the weightlifter to produce more force and power. This means they can lift heavier loads in competition, while stronger connective tissue reduces the risk of injury from heavy lifting.

Comparing the two athletes shows the importance of specificity in the relationship between principles and performance. The same principles are applied, but the runner's training produces cardiovascular and aerobic muscular adaptations, while the weightlifter's produces muscular and neural adaptations. If the runner trained like the weightlifter, they would not improve their endurance, and vice versa. Reversibility also affects both athletes, because adaptations are lost if training stops; aerobic adaptations begin to decline within a few weeks. The implication is that coaches must apply the principles consistently and specifically, and must build in recovery so that overload leads to adaptation rather than overtraining.

In conclusion, the principles of training, physiological adaptations and performance form a chain. The principles provide the stimulus, the body adapts, and the adaptations improve performance. For both aerobic and strength athletes, improved performance depends on applying the principles in a way that matches the specific demands of their sport.`,er6:`Both the yearly training program and the individual training sessions must be carefully planned to achieve peak performance. Comparing a 400 m swimmer, an athlete in an individual sport, with a netball player, an athlete in a group sport, shows that both follow the same principles of periodisation and session design. However, they differ significantly in how performance is timed and how individual and team needs are balanced.

Both yearly programs are periodised into phases: the off-season (transition), pre-season, in-season (competition) and back to transition. They are also both organised into macrocycles, mesocycles and microcycles. Both programs begin pre-season with general preparation, which builds a base of aerobic fitness and strength, and then move to specific preparation, where training becomes more closely matched to the sport. Similarly, both include recovery weeks to avoid overtraining. These similarities show that periodisation principles apply to all sports.

However, the structure and timing of the yearly program differ. The swimmer's program is built around one or two major target events, such as the national championships and international selection trials. As a result, the swimmer's year may contain two shorter cycles, each ending in a peak. In contrast, the netball player's program has one main pre-season of about 12\u201316 weeks, followed by a long competition phase. In the Super Netball league, this lasts around 14 rounds plus finals. This is a key difference, because the netball program must sustain performance over many weeks rather than for a few races.

Peaking and tapering highlight this difference. Before a target meet, the swimmer tapers by reducing training volume by about 40\u201360% over 1\u20133 weeks, while maintaining intensity. This allows the body to recover fully and perform at its best on the day. In contrast, the netball player cannot peak for every game. Instead, the aim during the in-season is to maintain fitness and skill while managing fatigue, with only a small taper before finals. Therefore, the swimmer's program is designed around a precise peak, whereas the netball program aims for consistent performance.

The emphasis of training also differs. The swimmer's pre-season includes a high volume of aerobic and anaerobic training in the pool, often 40\u201360 km per week, combined with technique work on starts, turns and stroke efficiency, as well as dryland strength training. Whereas the netball player's pre-season must develop aerobic fitness, repeated-sprint ability, agility, strength and landing technique, while also developing team skills and tactics. During the in-season, the swimmer can continue to build fitness between meets. In contrast, the netball player's training focuses on recovery, maintenance and preparing tactics for each opponent.

Training sessions also share a common structure. Both sessions require a clear aim linked to the yearly program, attention to safety, a warm-up, a main body of skill and conditioning work, a cool-down and reflection. Similarly, both coaches must apply the principles of progressive overload and specificity within each session.

However, the delivery of sessions differs significantly. In swimming, the coach can individualise every part of the session. The swimmer's main set is based on their own heart rate zones and target times, such as 8 \xD7 100 m at a specific pace, and the coach can give one-on-one feedback on technique. In contrast, a netball session must cater for a whole squad of players with different positions, abilities and fitness levels. The coach therefore often organises skill work by position, such as shooting practice for goalers and defensive drills for defenders, while conditioning is modified for each position, as centres need greater aerobic fitness than goalkeepers.

Strategies and tactics are another key difference. The swimmer's tactical preparation is limited to pacing and race plans. Whereas netball sessions must develop team strategies, such as centre pass set plays and defensive zones, which require communication and cohesion. Safety is also more complex in netball, because many players move in a limited space, which increases the risk of collisions and ankle injuries.
