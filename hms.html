92 GP medical clearance before exercising.","It ensures safety, enables individualised prescription and provides baseline data.","Professionals add BP, heart rate, body composition, movement screens and ECGs for elite athletes.","It meets duty of care, which protects both the client and the professional."],tip:"'Explain' = why and how. Link each part of screening to its consequence: 'Identifying uncontrolled hypertension means intensity can be reduced, which lowers cardiac risk'.",reel:["h:Before your first gym session, *one form* could save your life.","p:APSS|Australia's Adult Pre-Exercise Screening System. Stage 1 is compulsory.","l:It asks about|Heart conditions;Chest pain or fainting;Asthma or diabetes;Joint problems","p:A 'Yes'?|See your GP for medical clearance before you start.","l:Why it matters|Safety;Tailored program;Baseline data;Duty of care","r:Screen \u2192 Identify risk \u2192 Refer \u2192 Tailor"],mcq:[["In the APSS, which stage is compulsory for all clients?",["Stage 1","Stage 2","Stage 3","None of them"],0,"Stage 1 is the compulsory self-screening questionnaire."],["If a client answers 'yes' to a Stage 1 question, the professional should:",["Begin high-intensity training","Refer them for medical clearance","Ignore it if they look fit","Skip to fitness testing"],1,"A 'yes' indicates potential risk, so medical clearance is needed."],["Which is a reason pre-exercise screening helps program design?",["It replaces training","It provides baseline information to individualise intensity","It guarantees no injury","It measures skill level"],1,"Screening informs safe and appropriate prescription."]],sa:{q:"Explain the importance of pre-exercise screening before a person begins a new training program.",m:4,c:[["4","Clearly explains several reasons for screening, showing how it leads to safe, individualised training"],["2\u20133","Describes some reasons for screening"],["1","Identifies a feature of screening"]],pts:["Identifies risk (cardiac, injury, conditions)","Medical clearance/referral","Individualised prescription/baseline","Duty of care/legal"]}},t2:{fa:"fa2",iq:0,v:"Discuss",t:"Discuss the use of performance/fitness testing for recreational participants and elite athletes to improve their health, participation and performance",inc:[],big:"Fitness tests give objective data to guide training, but the RIGHT test depends on who you are testing and why.",notes:[["Why test?","Fitness testing provides **objective data** to identify **strengths and weaknesses**, set a **baseline**, inform **program design**, **monitor progress**, **motivate**, and in elite sport, help with **talent identification and selection**. Tests should be **valid** (measure what they claim to), **reliable** (consistent results when repeated) and **specific** to the sport or goal."],["Common tests","**Aerobic:** multistage fitness (beep) test, Yo-Yo intermittent recovery test, Cooper 12-minute run, VO2 max lab test. **Anaerobic:** 30-second Wingate test, repeated sprint ability. **Strength:** 1RM bench and squat, handgrip dynamometer. **Power:** vertical jump, standing long jump. **Speed:** 10/40 m sprint. **Agility:** Illinois agility run, 505 test. **Flexibility:** sit-and-reach. **Body composition:** skinfolds, DEXA."],["Recreational participants","For recreational people, testing focuses on **health and participation**: simple field tests (walk tests, sit-and-reach, waist circumference) that are **low cost, safe and motivating**. Testing shows progress, builds confidence and encourages adherence. But maximal tests can be **unsafe or discouraging** for unfit or older people, and poor results may reduce motivation. Submaximal, health-related tests are more appropriate."],["Elite athletes","Elite athletes use **sport-specific, highly accurate laboratory testing** (VO2 max, lactate threshold, DEXA, force plates, GPS load monitoring). Results guide **periodisation, selection, injury risk management and return to play**. For example, AFL and NRL clubs track repeat-sprint ability and GPS load. Limitations: **cost, time, fatigue**, testing can interfere with competition schedules, and results don't always predict game performance."],["Discussion","For both groups, testing improves outcomes **when it is matched to the person's goals and used to change the program**. Testing for its own sake has little value. The best approach is purposeful, valid, safe testing, with results fed back into training."]],con:[["Validity","The test measures what it is supposed to measure.","Beep test for aerobic capacity in team sport"],["Reliability","The test gives consistent results under the same conditions.","Same surface, time and warm-up each time"],["Baseline","Initial result used for comparison later.","Pre-season 1RM squat"],["Specificity of testing","Tests should match the demands of the sport.","Repeated sprint test for rugby league"]],sum:["Testing gives objective data: baseline, strengths and weaknesses, program design, progress, motivation.","Tests must be valid, reliable and sport-specific.","Recreational: simple, safe, submaximal tests focused on health and participation.","Elite: sport-specific lab and GPS testing for periodisation, selection and injury risk management.","Limits: cost, safety, motivation, fatigue. Testing only helps if results change the program."],tip:"'Discuss' = benefits AND limitations. Contrast recreational vs elite, and conclude with a position on when testing is most useful.",reel:["h:Why do NRL players do the *beep test* every preseason?","l:Testing gives you|Baseline;Strengths and weaknesses;Program direction;Motivation","c:Recreational|Simple;Safe;Health-focused||Elite|Lab and GPS;Sport-specific;Selection","p:Valid + reliable|Measures the right thing, and gives the same result each time.","p:Catch|Testing only helps if the results CHANGE the program.","r:Who \u2192 Which test \u2192 Why \u2192 How it changes training"],mcq:[["A test that gives consistent results when repeated under the same conditions is:",["Valid","Reliable","Specific","Maximal"],1,"Reliability = consistency."],["Which test is most appropriate for an older recreational participant?",["Wingate 30s test","Maximal treadmill VO2 max to exhaustion","6-minute walk test","1RM squat"],2,"It is submaximal, safe and health-related."],["A key use of fitness testing for elite athletes is:",["Replacing coaching","Informing periodisation and selection","Guaranteeing wins","Diagnosing illness"],1,"Elite testing guides training phases and selection decisions."]],sa:{q:"Discuss the use of fitness testing for recreational participants compared with elite athletes.",m:6,c:[["5\u20136","Presents a balanced discussion of benefits and limitations of testing for BOTH groups with relevant examples of tests"],["3\u20134","Describes uses of testing for one or both groups"],["1\u20132","Identifies fitness tests or reasons for testing"]],pts:["Purpose of testing (baseline, program design, motivation)","Recreational: safe, simple, motivation/participation","Elite: lab/sport-specific, selection, periodisation, injury","Limitations: cost, safety, motivation","Validity/reliability; conclusion"]}},t3:{fa:"fa2",iq:0,v:"Explain",t:"Explain how exercise assessment can assist in developing training programs",inc:[],big:"Assessment turns guesswork into a plan: test, identify needs, set goals, prescribe, re-test.",notes:[["The assessment-to-program cycle","**1. Screen** (APSS). **2. Assess**: fitness tests, movement screens, sport demands and the athlete's goals. **3. Analyse** strengths and weaknesses against the requirements of the sport (a needs analysis). **4. Set SMART goals.** **5. Prescribe**, choosing type, intensity, duration and frequency (FITT). **6. Monitor and re-test**, then adjust. This is a continuous loop."],["How assessment helps","**Individualisation:** two players in the same team may need different programs (e.g. one lacks aerobic capacity, one lacks power). **Correct intensity:** a 1RM test lets you set loads at a percentage of maximum (e.g. 70\u201385% for hypertrophy). VO2 max or maximum heart rate lets you set aerobic training zones. **Injury prevention:** movement screens identify imbalances. **Motivation and accountability:** athletes see measurable progress. **Evaluation:** re-testing shows whether the program worked or needs changing."],["Example","A netball goal defender's assessment shows good aerobic fitness but weak vertical jump and poor single-leg balance. The program then prioritises **plyometrics and lower-body strength** (power), plus **balance and landing mechanics** to reduce ACL injury risk, while maintaining aerobic fitness."]],con:[["Needs analysis","Identifying the physical, skill and psychological demands of a sport or role.","Netball: agility, power, aerobic endurance"],["SMART goals","Specific, Measurable, Achievable, Relevant, Time-bound.","Improve vertical jump by 5 cm in 8 weeks"],["FITT","Frequency, Intensity, Time, Type: the variables of exercise prescription.","3x per week, 80% 1RM, 45 min, resistance"],["Re-testing","Repeating tests to measure progress and adjust the program.","Mid-season re-test"]],flow:["Screen","Assess","Analyse needs","Set SMART goals","Prescribe (FITT)","Monitor & re-test"],sum:["Assessment cycle: screen \u2192 assess \u2192 analyse \u2192 goals \u2192 prescribe \u2192 monitor and re-test.","It enables individualisation, even within the same team.","Test results set accurate intensities (e.g. % of 1RM, heart rate zones).","Movement screens identify injury risk; re-testing evaluates the program.","Provides motivation and accountability through measurable progress."],tip:"Use a worked example (athlete \u2192 test result \u2192 program change). Markers love seeing assessment data directly change a training decision.",reel:["h:Training without testing is just *guessing*.","l:The cycle|Screen;Assess;Set SMART goals;Prescribe (FITT);Re-test","p:Get the load right|1RM test \u2192 lift at 70\u201385% for hypertrophy.","p:Same team, different program|One player needs aerobic work, another needs power.","r:Test result \u2192 Program decision"],mcq:[["A 1RM test helps program design by:",["Measuring flexibility","Allowing loads to be set as a % of maximum","Measuring aerobic capacity","Testing agility"],1,"Knowing 1RM lets you prescribe precise relative intensities."],["The purpose of re-testing during a program is to:",["Replace training sessions","Evaluate progress and adjust the program","Increase fatigue","Screen for heart conditions"],1,"Re-testing closes the loop and guides changes."],["A needs analysis identifies:",["The athlete's favourite food","The demands of the sport compared with the athlete's current abilities","The cost of equipment","Only injury history"],1,"It matches the athlete's capacities to the sport's requirements."]],sa:{q:"Explain how exercise assessment can assist a coach to develop a training program for an athlete of your choice.",m:5,c:[["5","Clearly explains how assessment results directly inform specific program decisions, using a relevant example"],["3\u20134","Describes how assessment can help program design with some example"],["1\u20132","Identifies assessments or program features"]],pts:["Assessment cycle","Individualisation","Setting intensity (1RM / HR zones)","Injury prevention","Example athlete with test \u2192 program change"]}},t4:{fa:"fa2",iq:1,v:"Assess",t:"Assess the types of training and training methods and their relevance for a variety of sports",inc:["Anaerobic: anaerobic interval, HIIT, SIT, plyometric, resistance","Aerobic: continuous, fartlek, aerobic interval, circuit","Flexibility: static, dynamic, ballistic, PNF","Strength: free/fixed weights, body-weight exercises, elastics","Skill and tactical development: drills, modified games, games for specific outcomes"],big:"The best training method is the one that matches the energy systems, movements and skills of the sport. Relevance is everything.",notes:[["Anaerobic training","Anaerobic training develops the **ATP-PC and anaerobic glycolysis (lactic acid) systems** for short, high-intensity efforts. **Anaerobic interval:** high-intensity work (10s\u20132 min) with rest, e.g. 6 \xD7 200 m. **HIIT:** short bursts at 80\u201395% of max heart rate with active recovery. **SIT (sprint interval training):** all-out efforts (e.g. 6 \xD7 30 s) with long rest. **Plyometrics:** stretch-shortening-cycle exercises (bounding, depth jumps) to build **power**. **Resistance:** weights for strength and power. *Most relevant to:* sprinting, netball, basketball, rugby league, tennis."],["Aerobic training","Aerobic training develops the **aerobic system** and VO2 max. **Continuous:** steady effort for 20+ minutes at 60\u201380% of max heart rate (e.g. a 10 km run). **Fartlek:** 'speed play', varied pace over varied terrain, which suits intermittent sports. **Aerobic interval:** longer work bouts (e.g. 4 \xD7 4 min) with short rest. **Circuit:** stations completed with minimal rest. *Most relevant to:* marathon, triathlon, swimming, AFL midfielders, football (soccer)."],["Flexibility training","**Static:** hold a stretch for 15\u201330 s; safe and good in the cool-down. **Dynamic:** controlled, sport-specific movement through range (leg swings, walking lunges); best for the warm-up. **Ballistic:** bouncing at the end of range; high injury risk, so only for advanced athletes in specific sports (e.g. martial arts, dance). **PNF:** stretch, isometric contract, relax and stretch further. It produces the greatest gains, but needs a partner. *Most relevant to:* gymnastics, dance, diving, hurdles."],["Strength training","**Free weights** (barbells, dumbbells) require balance and stabiliser muscles, so they are more functional. **Fixed weights** (machines) are safer and isolate muscles, so they suit beginners and rehabilitation. **Body-weight** exercises (push-ups, chin-ups) are accessible and need no equipment. **Elastics** give variable resistance, are portable, and are used for rehab and injury prevention. Variables: sets, reps, load, rest. Lower reps and higher loads build strength; 6\u201312 reps build hypertrophy; 15+ reps build muscular endurance."],["Skill and tactical development","**Drills:** repetitive practice of a skill in a closed environment (e.g. shooting drills); good for the cognitive and associative learners. **Modified games:** smaller fields, fewer players or adapted rules, giving more touches and decisions (Game Sense). **Games for specific outcomes:** games designed to develop one tactic (e.g. a 3v2 overlap game to practise attacking width). These suit open-skill team sports."],["Assessing relevance","Judge relevance using the **energy system demands, movement patterns, fitness components and skill demands** of the sport, plus the athlete's level, phase of season and injury history. For example, **fartlek is highly relevant for soccer** (intermittent pace changes) but **less relevant for a 100 m sprinter**, who needs SIT, plyometrics and resistance training."]],con:[["HIIT","Short, high-intensity bursts with brief recovery.","8 \xD7 30 s at 90% max HR, 30 s recovery"],["SIT","Sprint interval training: all-out efforts with long recovery.","6 \xD7 30 s maximal bike sprints"],["Plyometrics","Exercises that use the stretch-shortening cycle to develop power.","Depth jumps, bounding"],["PNF","Proprioceptive neuromuscular facilitation: stretch, contract, relax, stretch further.","Partner hamstring stretch"],["Fartlek","'Speed play': continuous training with varied pace and terrain.","Jog-sprint-walk on a trail"]],sum:["Anaerobic (interval, HIIT, SIT, plyometrics, resistance) suits short, explosive, high-intensity sports.","Aerobic (continuous, fartlek, aerobic interval, circuit) suits endurance and intermittent sports.","Flexibility: dynamic in the warm-up, static in the cool-down, PNF for greatest gains, ballistic is risky.","Strength: free (functional), fixed (safe/isolate), body weight (accessible), elastics (rehab).","Skill: drills (closed), modified games and outcome games (open, tactical). Judge relevance by sport demands."],tip:"'Assess' = judge relevance. For each method say HOW relevant it is to a named sport and WHY (energy system, movements, skills). Use 'highly relevant / less relevant because\u2026'.",reel:["h:Should a marathon runner train like a sprinter? *Nope.* Here's why.","c:Anaerobic|HIIT;SIT;Plyos;Resistance||Aerobic|Continuous;Fartlek;Intervals;Circuit","l:Flexibility|Dynamic: warm-up;Static: cool-down;PNF: biggest gains;Ballistic: risky","p:Soccer = Fartlek|Constant pace changes, just like match play.","p:Skills|Drills for beginners. Modified games for decisions.","r:Method \u2192 Energy system \u2192 Sport demands \u2192 Relevance"],mcq:[["Which training method is MOST relevant for a soccer midfielder?",["Ballistic stretching","Fartlek","1RM powerlifting only","Static stretching only"],1,"Fartlek's varied pace mimics the intermittent demands of soccer."],["PNF stretching involves:",["Bouncing at the end of range","Holding for 10 minutes","Stretch, isometric contraction, relax, then a further stretch","Only dynamic movement"],2,"PNF uses contract-relax to gain greater range."],["Plyometric training primarily develops:",["Aerobic capacity","Flexibility","Power","Body composition"],2,"Plyometrics train the stretch-shortening cycle for power."]],sa:{q:"Assess the relevance of TWO training methods for an athlete in a sport of your choice.",m:6,c:[["5\u20136","Makes a clear judgement about the relevance of two methods, linked explicitly to the energy system, movement and skill demands of a named sport"],["3\u20134","Describes two training methods and how they relate to a sport"],["1\u20132","Identifies training methods"]],pts:["Named sport + demands","Method 1: description + relevance judgement + why","Method 2: description + relevance judgement + why","Energy systems/fitness components","Comparative judgement"]}},t5:{fa:"fa2",iq:1,v:"Evaluate",t:"Evaluate the application of the principles of training to both aerobic and strength training",inc:["Progressive overload","Training thresholds","Reversibility","Specificity","Variety","Warm-up and cool-down"],big:"The principles of training are the rules that make training work. Apply them well and the body adapts; ignore them and it plateaus or breaks down.",notes:[["Progressive overload","Gradually increasing the training load (intensity, duration, frequency) so the body keeps adapting. **Aerobic:** increase distance or pace by about 5\u201310% a week, or extend interval duration. **Strength:** add load (about 2\u20135%) when you can complete the target reps (the '2-for-2 rule'). *Evaluation:* essential for continued improvement, but overloading too fast causes **overtraining and injury**, so it must be gradual and monitored."],["Training thresholds","The minimum intensity needed to cause adaptation. **Aerobic threshold:** \u224870% of max heart rate (lower bound of the aerobic training zone, \u224870\u201385% MHR). **Anaerobic/lactate threshold:** \u224885% of max heart rate. Training just below it improves the ability to work at higher intensity without lactate build-up. **Strength:** loads of roughly 60%+ of 1RM for strength gains in trained people. *Evaluation:* thresholds make intensity precise and efficient, but they vary between individuals, so testing is needed."],["Reversibility","'Use it or lose it.' Adaptations are lost when training stops. **Aerobic gains decline quickly** (noticeable after 2\u20133 weeks, a significant decline within weeks). **Strength is lost more slowly**, because muscle memory retains it. *Evaluation:* explains why off-season maintenance programs and injury cross-training matter."],["Specificity","Training must match the sport's energy systems, muscles, movements and speeds. **Aerobic:** a swimmer must train in the pool, because running fitness doesn't fully transfer. **Strength:** a sprinter needs explosive, multi-joint lifts, not slow bodybuilding sets. *Evaluation:* the most important principle for performance, but too much specificity can cause overuse injuries and boredom, which is where variety helps."],["Variety","Changing exercises, methods and environments to keep motivation high and reduce overuse injury, while staying specific. **Aerobic:** mix continuous, fartlek and cross-training (cycling). **Strength:** rotate exercises or equipment (free weights vs elastics). *Evaluation:* improves adherence and reduces staleness, but too much variety can reduce specificity."],["Warm-up and cool-down","**Warm-up** (10\u201320 min): general cardio, dynamic stretching, sport-specific drills. It raises muscle temperature, heart rate and blood flow, and prepares the neuromuscular system, which reduces injury risk and improves performance. **Cool-down:** light aerobic activity plus static stretching. It helps remove lactate, prevents blood pooling, and gradually returns heart rate to resting. *Evaluation:* strong evidence for the warm-up (e.g. FIFA 11+ reduces injuries by about 30\u201350%). The cool-down's effect on soreness is less clear, but it aids the return to resting state and flexibility."]],con:[["Progressive overload","Gradually increasing training stress to keep adaptation going.","Adding 2.5 kg once 3 \xD7 8 is achieved"],["Training threshold","Minimum intensity needed for adaptation.","Aerobic zone \u224870\u201385% max HR"],["Reversibility","Loss of training adaptations when training stops.","VO2 max drops after weeks of no training"],["Specificity","Training matches the demands of the activity.","Swimmer trains in the pool"],["Variety","Changing training to maintain motivation and reduce overuse.","Cross-training on a bike"]],sum:["Progressive overload: increase load gradually (\u22485\u201310% a week aerobic; add load when reps are achieved for strength).","Thresholds: aerobic \u224870%, anaerobic \u224885% max HR; strength \u224860%+ 1RM.","Reversibility: aerobic gains are lost faster than strength, so maintenance programs matter.","Specificity is the most important for performance; variety prevents boredom and overuse.","Warm-up has strong injury-prevention evidence (FIFA 11+); cool-down aids recovery to resting state."],tip:"'Evaluate' = apply each principle to BOTH aerobic AND strength training with specific examples, then judge its importance or limitations. A table-like structure (principle \u2192 aerobic \u2192 strength \u2192 judgement) works well.",reel:["h:Same effort, no gains? You're breaking a *training principle*.","p:Progressive overload|Increase gradually: about 5\u201310% a week. Too fast = injury.","c:Aerobic threshold|\u224870% max HR||Anaerobic threshold|\u224885% max HR","p:Reversibility|Use it or lose it. Aerobic fitness fades faster than strength.","p:Specificity|A swimmer gets fit in the POOL, not on the treadmill.","l:Don't forget|Variety;Warm-up;Cool-down","r:Principle \u2192 Aerobic eg \u2192 Strength eg \u2192 Judgement"],mcq:[["The aerobic training zone generally lies between:",["40\u201350% max HR","70\u201385% max HR","90\u2013100% max HR","100\u2013110% max HR"],1,"Between the aerobic (\u224870%) and anaerobic (\u224885%) thresholds."],["A swimmer who does most of their training on a treadmill is ignoring the principle of:",["Variety","Specificity","Reversibility","Warm-up"],1,"Training must match the movement and muscles of the sport."],["Which statement about reversibility is correct?",["Strength is lost faster than aerobic fitness","Aerobic adaptations are generally lost faster than strength","Adaptations are permanent","Reversibility only applies to children"],1,"Aerobic gains decline quickly; strength declines more slowly."]],sa:{q:"Evaluate how the principles of progressive overload and specificity are applied to aerobic AND strength training.",m:8,c:[["7\u20138","Makes informed judgements about the application of BOTH principles to BOTH aerobic and strength training, with specific, accurate examples and clear evaluation"],["5\u20136","Explains application of both principles to aerobic and strength training"],["3\u20134","Describes the principles with some application"],["1\u20132","Identifies principles of training"]],pts:["Progressive overload definition + aerobic example (5\u201310%/week)","Progressive overload strength example (add load when reps met)","Specificity aerobic (sport, energy system)","Specificity strength (movement patterns, speed)","Judgement: risks (overtraining), importance, interaction"]}},t6:{fa:"fa2",iq:1,v:"Examine",t:"Examine the relationship between the principles of training, physiological adaptations and improved performance",inc:["Heart rate","Stroke volume and cardiac output","Oxygen uptake and lung capacity","Haemoglobin level","Muscle hypertrophy","Fast/slow twitch muscle fibres"],big:"Principles of training cause physiological adaptations, and those adaptations are WHY performance improves. Always connect all three links of the chain.",notes:[["The chain","**Principle applied** (e.g. progressive overload in the aerobic zone) \u2192 **physiological adaptation** (e.g. bigger stroke volume) \u2192 **improved performance** (e.g. faster 10 km time). Band 6 responses make all three links explicit."],["Heart rate","Aerobic training lowers **resting heart rate** (trained athletes can be below 50 bpm, compared with \u224872 bpm untrained) and lowers **submaximal heart rate**, and heart rate **recovers faster** after exercise. *Why:* the heart pumps more blood per beat, so fewer beats are needed. *Performance:* the same pace feels easier and the athlete recovers faster between efforts."],["Stroke volume and cardiac output","**Stroke volume** (blood pumped per beat) increases because the left ventricle enlarges and becomes stronger. **Cardiac output** (Q = SV \xD7 HR) stays similar at rest (lower HR, higher SV) but **increases at maximum** because of the larger SV. *Performance:* more oxygenated blood reaches the working muscles, so the athlete can work harder for longer."],["Oxygen uptake and lung capacity","**VO2 max** (maximum oxygen uptake) increases, by about 10\u201320% or more with aerobic training. This comes from better delivery (cardiac output, more capillaries) and better use (more mitochondria and aerobic enzymes). **Lung capacity** (total lung volume) changes little, but **ventilation efficiency and the strength of the respiratory muscles improve**, and tidal volume during exercise increases. *Performance:* the athlete can work at a higher intensity aerobically and delay fatigue."],["Haemoglobin level","Aerobic training (and especially **altitude training**) increases **total haemoglobin** and red blood cell mass, so more oxygen can be carried. Plasma volume also rises, so the *concentration* may not change much at sea level. *Performance:* improved oxygen transport, and a higher VO2 max."],["Muscle hypertrophy","**Resistance training** with progressive overload (6\u201312 reps, \u224867\u201385% 1RM) increases the cross-sectional area of muscle fibres (mainly fast-twitch), through more contractile proteins (actin and myosin). *Performance:* greater strength and power (e.g. scrummaging, sprint acceleration)."],["Fast- and slow-twitch fibres","**Slow-twitch (Type I):** fatigue resistant, aerobic, rich in mitochondria and capillaries. **Fast-twitch (Type IIa/IIx):** powerful, fast-contracting, anaerobic. Fibre type is largely **genetic**, but training is **specific**. Aerobic training improves the aerobic capacity of all fibres, and Type IIx can take on IIa (more fatigue-resistant) characteristics. Anaerobic and power training develops the size and power of fast-twitch fibres. *Performance:* endurance athletes become more fatigue resistant; sprinters become more explosive."]],con:[["Stroke volume","Volume of blood ejected from the left ventricle per beat.","Increases with aerobic training"],["Cardiac output","Q = SV \xD7 HR, the volume of blood pumped per minute.","Up to 30\u201340 L/min in elite athletes at max"],["VO2 max","Maximum rate of oxygen uptake and use during exercise.","Best single measure of aerobic fitness"],["Hypertrophy","Increase in muscle size from larger fibres.","Result of resistance training 6\u201312 reps"],["Slow-twitch (Type I)","Fatigue-resistant, aerobic muscle fibres.","Dominant in marathon runners"]],flow:["Principle applied","Physiological adaptation","Improved performance"],sum:["Always link: principle \u2192 adaptation \u2192 performance.","Aerobic training: \u2193 resting and submaximal HR, \u2191 SV, \u2191 max cardiac output, \u2191 VO2 max.","Lung capacity changes little; ventilation efficiency improves. Total haemoglobin rises (altitude).","Resistance training (6\u201312 reps, progressive overload) \u2192 hypertrophy \u2192 strength and power.","Fibre type is mostly genetic, but training makes fibres more aerobic (endurance) or more powerful (sprint)."],tip:"'Examine' = inquire into the relationships. Write in chains: 'Applying overload at 70\u201385% MHR increases stroke volume, which lowers HR at a given pace, allowing the runner to sustain race pace for longer'.",reel:["h:Why does your resting heart rate *drop* when you get fit?","p:Bigger pump|Aerobic training enlarges the left ventricle, so stroke volume rises.","c:Untrained|\u224872 bpm resting||Trained athlete|<50 bpm resting","p:Q = SV \xD7 HR|More blood per beat = more oxygen to the muscles at max.","p:Hypertrophy|6\u201312 reps + overload \u2192 bigger fibres \u2192 more strength.","l:Fibre types|Type I: endurance;Type II: power;Mostly genetic;Training-specific","r:Principle \u2192 Adaptation \u2192 Performance"],mcq:[["After aerobic training, resting heart rate decreases mainly because:",["Lung capacity doubles","Stroke volume increases","Haemoglobin falls","Muscles shrink"],1,"A stronger heart pumps more per beat, so fewer beats are needed."],["Cardiac output is calculated as:",["SV \xF7 HR","SV \xD7 HR","HR \u2212 SV","VO2 \xD7 HR"],1,"Q = stroke volume \xD7 heart rate."],["Muscle hypertrophy is best developed by:",["Continuous training at 60% MHR","Resistance training with progressive overload, \u22486\u201312 reps","Static stretching","Rest"],1,"Moderate reps and loads with overload maximise hypertrophy."]],sa:{q:"Examine the relationship between aerobic training and TWO physiological adaptations, and how these improve performance.",m:6,c:[["5\u20136","Clearly examines the chain from training principle to two accurate physiological adaptations to performance, with sport-specific examples"],["3\u20134","Explains two adaptations and their link to performance"],["1\u20132","Identifies adaptations"]],pts:["Principles applied (overload, threshold, specificity)","Adaptation 1 with mechanism (e.g. SV\u2191 \u2192 HR\u2193)","Adaptation 2 with mechanism (e.g. VO2max\u2191)","Performance outcome with example","Relationship explicit"]}},t7:{fa:"fa2",iq:2,v:"Compare",t:"Compare aspects to consider when designing a training session for individual and group sports",inc:["Health and safety","Aim of session (goal specific)","Warm-up and cool-down","Skill instruction and practice","Conditioning","Strategies and tactics","Athlete reflection and/or coach evaluation"],big:"Individual sessions can be precisely personalised; group sessions must balance shared goals with individual differences and team tactics.",notes:[["Health and safety","**Both:** screening, a safe environment and equipment, hydration, heat policies, first aid, injury management. **Individual (e.g. tennis, swimming):** easier to monitor one athlete's load and fatigue closely. **Group (e.g. netball, rugby):** more players to monitor, collision risk, more space needed, and a higher coach-to-player ratio needed."],["Aim of session","**Individual:** goals tailored to one athlete (e.g. improve the second serve). **Group:** shared team goals (e.g. defensive structure) plus positional goals. Harder to meet every player's needs."],["Warm-up and cool-down","**Both** need them. **Individual:** specific to that athlete's event and injury history. **Group:** often a structured team warm-up (e.g. FIFA 11+, a netball warm-up program) plus position-specific additions; it also builds cohesion."],["Skill instruction and practice","**Individual:** one-on-one feedback, precise technique work, closed drills. **Group:** demonstrations to many, small-group stations, game-based drills, peer feedback. Feedback is less frequent for each player."],["Conditioning","**Individual:** precisely matched to that athlete's testing (e.g. % of 1RM, HR zones). **Group:** often position-based groups (forwards vs backs), and game-based conditioning that combines fitness with skill."],["Strategies and tactics","**Individual:** game plans against a specific opponent (e.g. serve to the backhand). **Group:** set plays, team structures, communication, roles. Takes a large share of session time."],["Reflection and evaluation","**Individual:** athlete journals, video review, direct coach conversations. **Group:** team debriefs, video sessions, GPS/load data, leadership groups, as well as individual check-ins."]],con:[["Session aim","The specific goal that every part of the session builds towards.","Improve defensive transition"],["Game-based conditioning","Developing fitness through games rather than separate running.","Small-sided 4v4 games"],["Positional training","Training tailored to the demands of a player's role.","Front row vs halfback conditioning"],["Coach evaluation","Coach reviews the session against its aim to plan the next one.","Reviewing video and GPS data"]],sum:["Both sports need: safety, a clear aim, warm-up and cool-down, skill, conditioning, tactics, reflection.","Individual: highly personalised, precise feedback and load, opponent-specific tactics.","Group: shared and positional aims, more players to monitor, game-based training, team tactics.","Group sessions use stations and modified games to raise involvement and give more touches.","Reflection: individual journals and video vs team debriefs, GPS data and leadership groups."],tip:"'Compare' = similarities AND differences, using comparative language. Organise by aspect (aspect \u2192 individual \u2192 group \u2192 similarity or difference), not by sport.",reel:["h:Training 1 athlete vs 15. *What changes?*","c:Individual|Personal goals;1-on-1 feedback;Opponent game plan||Group|Team and positional goals;Stations;Set plays","p:Same for both|Safety, a clear aim, warm-up, conditioning, reflection.","p:Group trick|Modified games = more touches + fitness + tactics at once.","r:Aspect \u2192 Individual vs Group \u2192 Similar or different?"],mcq:[["Compared with an individual sport session, a group sport session will MOST likely:",["Have no tactical component","Use position-specific and game-based training","Provide more one-on-one feedback per athlete","Not need a warm-up"],1,"Group sessions cater for different positions and use games."],["Which aspect is common to BOTH individual and group sessions?",["Set plays","Opponent-specific serve strategy","A clear session aim","Scrum practice"],2,"Every well-designed session has a clear, goal-specific aim."],["An advantage of individual sport sessions is:",["Building team cohesion","Highly precise individual feedback and load","More players to supervise","Practising set plays"],1,"Individual focus allows precise tailoring."]],sa:{q:"Compare the aspects a coach must consider when designing a training session for an individual sport and a group sport.",m:8,c:[["7\u20138","Provides a sustained comparison of several aspects with clear similarities AND differences, using specific examples from an individual and a group sport"],["5\u20136","Explains similarities and differences for some aspects with examples"],["3\u20134","Describes aspects for one or both types of sport"],["1\u20132","Identifies aspects of session design"]],pts:["Named individual + group sport","Aim, safety, warm-up/cool-down","Skill instruction, conditioning","Strategies/tactics, reflection","Comparative language throughout"]}},t8:{fa:"fa2",iq:2,v:"Compare",t:"Compare a yearly training program for an individual sport and a group sport",inc:["Phases of competition: pre-season, in-season, off-season","Sub-phases","Peaking and tapering","Sport-specific attributes: fitness components, skill requirements"],big:"Periodisation organises the year so the athlete peaks at the right time. Individual athletes peak for a few key events; teams must sustain performance across a long season.",notes:[["Periodisation and phases","**Periodisation** divides the year into phases with specific goals. The **macrocycle** is the whole year; **mesocycles** are blocks of 4\u20136 weeks; **microcycles** are weekly plans. **Pre-season:** build the aerobic base and general strength, then move to sport-specific, higher-intensity work. **In-season (competition):** maintain fitness, refine skill and tactics, manage recovery and load. **Off-season (transition):** active rest, injury rehabilitation, mental recovery, maintaining a base level of fitness."],["Sub-phases","Pre-season splits into **general preparation** (high volume, lower intensity) and **specific preparation** (lower volume, higher intensity, sport-specific). In-season may include **pre-competition**, **competition** and **peak** sub-phases. The off-season is the **transition** phase."],["Peaking and tapering","**Peaking** means timing the year so that maximal performance occurs at the most important competition. **Tapering** means reducing training **volume** (by about 40\u201360%) while **maintaining intensity** in the 1\u20133 weeks before an event, which lets the athlete recover fully while keeping their fitness. **Individual sports** (e.g. swimming, athletics) can plan a precise taper and peak for 1\u20132 major events (e.g. national titles, Olympics), sometimes using a 'double periodisation' with two peaks. **Group sports** (e.g. NRL, netball) have weekly games over a long season, so they cannot fully taper each week. They use **mini-tapers**, load management and rotation, and aim to peak for the finals."],["Sport-specific attributes","**Swimming (individual):** aerobic and anaerobic capacity, muscular endurance and power, technique (stroke efficiency, starts and turns). **Rugby league (group):** repeated sprint ability, strength and power for collisions, aerobic base, agility, tackling and passing under fatigue, team structures. The program prioritises different components in different phases."],["Key comparisons","**Similar:** both use periodisation, the same phases, the principles of training and recovery. **Different:** an individual sport has **fewer, more precise peaks** and a highly individualised program; a group sport has a **longer competition phase** and must **maintain** performance weekly, balance positional needs, and manage the squad's load (e.g. GPS monitoring)."]],con:[["Periodisation","Dividing the training year into phases with specific goals.","Macro, meso and micro cycles"],["Tapering","Reducing training volume while maintaining intensity before competition.","Swimmer cuts volume 50% for 2 weeks before nationals"],["Peaking","Timing training so that best performance occurs at the key event.","Peak for Olympic final"],["Double periodisation","A year with two competition peaks.","Swimmer peaks for nationals and world titles"]],flow:["Off-season (transition)","Pre-season: general","Pre-season: specific","In-season","Peak/taper \u2192 Finals"],sum:["Phases: pre-season (general \u2192 specific), in-season (maintain and refine), off-season (active rest).","Macrocycle (year) \u2192 mesocycle (4\u20136 weeks) \u2192 microcycle (week).","Taper: cut volume by \u224840\u201360%, keep intensity, 1\u20133 weeks before an event.","Individual sports: 1\u20132 precise peaks, possibly double periodisation.","Group sports: long season, mini-tapers and load management, peak for finals; positional demands."],tip:"Draw or describe both programs side by side. Use specific sports and specific examples of what changes in each phase. Comparative language is essential.",reel:["h:How do Olympians hit their best on *one exact day*?","l:The year|Off-season: rest;Pre-season: build;In-season: maintain;Peak: finals","p:The taper|Cut volume \u224840\u201360%, KEEP the intensity, 1\u20133 weeks out.","c:Swimmer|1\u20132 big peaks;Precise taper||Rugby league|26-week season;Mini-tapers;Load management","r:Phases \u2192 Sub-phases \u2192 Taper/Peak \u2192 Individual vs Group"],mcq:[["Tapering involves:",["Increasing volume and intensity","Reducing volume while maintaining intensity","Stopping all training","Only stretching"],1,"Cutting volume but keeping intensity preserves fitness and allows recovery."],["Why do group sports find it hard to taper for every game?",["They don't use periodisation","Weekly games over a long season","They have no off-season","They only train aerobically"],1,"Weekly competition means only mini-tapers and load management are possible."],["The general preparation sub-phase emphasises:",["High intensity, low volume","High volume, lower intensity base building","Tapering","Active rest"],1,"The early pre-season builds a base with volume."]],sa:{q:"Compare a yearly training program for an individual sport with that of a group sport.",m:8,c:[["7\u20138","Provides a detailed comparison of phases, sub-phases, peaking/tapering and sport-specific attributes for named individual and group sports, with clear similarities and differences"],["5\u20136","Explains similarities and differences in yearly programs with examples"],["3\u20134","Describes features of a yearly program"],["1\u20132","Identifies phases of a training year"]],pts:["Named sports","Phases + sub-phases for both","Peaking/tapering differences","Sport-specific fitness/skill emphasis","Comparative language & similarities"]}},t9:{fa:"fa2",iq:2,v:"Investigate",t:"Investigate how individual and group sports apply psychological strategies to improve participation and performance, including optimising arousal and managing stress and anxiety",inc:[],big:"Performance depends on the mind as much as the body. The aim is not zero nerves but OPTIMAL arousal for the task.",notes:[["Arousal and performance","**Arousal** is a state of physical and mental activation. The **inverted-U hypothesis** says performance improves as arousal rises, up to an **optimal point**, then declines. The optimal level depends on the **task**: fine, complex skills (golf putt, archery, free throw) need **lower** arousal; gross, simple skills (weightlifting, rugby tackling, sprint start) tolerate **higher** arousal. It also depends on the **athlete's experience** (experts cope with higher arousal) and **personality**."],["Stress and anxiety","**Stress** is the body's response to a perceived demand. **Anxiety** is negative emotion and worry. **Trait anxiety** is a general tendency to be anxious; **state anxiety** is anxiety in a specific situation (e.g. before a grand final). Anxiety can be **cognitive** (worry, negative thoughts) or **somatic** (butterflies, a racing heart, tense muscles). The **sources**: the importance of the event, the expectations of others, fear of failure, the crowd, injury."],["Strategies to manage anxiety and optimise arousal","**Relaxation techniques:** deep breathing, progressive muscle relaxation (PMR), centering. These lower somatic anxiety. **Mental rehearsal/visualisation:** imagining successful performance, which builds confidence and focus. **Concentration/attention skills:** cue words, focusing on the process rather than the outcome. **Goal setting:** process goals reduce outcome pressure. **Positive self-talk:** replacing 'don't miss' with 'smooth and strong'. **Pre-performance routines:** e.g. a goal kicker's routine. **Psyching-up** (music, energising self-talk, team chants) **raises** under-arousal."],["Individual vs group application","**Individual sports** (tennis, golf, swimming): the athlete has full personal responsibility and fewer distractions, but also nowhere to hide. They rely more on self-talk, routines, visualisation and individual sessions with a psychologist. **Group sports**: team cohesion, shared goals and leadership matter. They use team talks, shared rituals, role clarity, and social support from teammates. Arousal needs **differ by position** (a goal kicker or shooter vs a prop forward), so team psych-up strategies can over-arouse some players."],["Participation","For recreational participants, managing anxiety (e.g. fear of judgement, competition stress) and building **enjoyment, self-efficacy and social connection** increases **participation and adherence**. Mastery-focused, inclusive environments keep people in sport."]],con:[["Arousal","Level of physical and mental activation.","Heart racing before a final"],["Inverted-U hypothesis","Performance rises with arousal to an optimal point, then falls.","An over-aroused basketballer misses free throws"],["State anxiety","Anxiety felt in a specific situation.","Nerves before a penalty shootout"],["Mental rehearsal","Imagining a skill or performance without physical movement.","A gymnast visualising a routine"],["Progressive muscle relaxation","Tensing and relaxing muscle groups to reduce somatic anxiety.","Pre-race relaxation"]],sum:["Inverted-U: optimal arousal depends on task complexity, experience and personality.","Fine/complex skills need lower arousal; gross/simple skills tolerate higher arousal.","Anxiety: trait vs state; cognitive (worry) vs somatic (physical).","Strategies: relaxation, mental rehearsal, concentration, goal setting, self-talk, routines, psyching up.","Individual sports use self-reliant strategies; group sports use cohesion and position-specific arousal management."],tip:"'Investigate' = inquire into and draw conclusions. Link each strategy to the problem it solves (over- vs under-arousal, cognitive vs somatic anxiety), with sport examples from both individual and group contexts.",reel:["h:Why do pros miss *easy* shots in grand finals?","p:Inverted-U|Performance rises with arousal\u2026 until it doesn't.","c:Fine skills|Golf putt;Free throw;\u2192 LOW arousal||Gross skills|Tackle;Lift;\u2192 HIGHER arousal","l:Calm down|Deep breathing;PMR;Visualisation;Cue words","p:Pump up|Music, energising self-talk, team chants.","r:Diagnose arousal \u2192 match the strategy \u2192 sport example"],mcq:[["According to the inverted-U hypothesis:",["More arousal always improves performance","Performance is best at an optimal, moderate level of arousal","Arousal has no effect","Low arousal is always best"],1,"Performance peaks at an optimal level, then declines."],["Which skill generally requires the LOWEST optimal arousal?",["Weightlifting","A rugby tackle","A golf putt","A 100 m sprint start"],2,"Fine, complex skills need lower arousal."],["Progressive muscle relaxation mainly targets:",["Cognitive anxiety","Somatic anxiety","Under-arousal","Tactical errors"],1,"It reduces the physical symptoms of anxiety."]],sa:{q:"Investigate how psychological strategies can be used to optimise arousal and manage anxiety in an individual sport AND a group sport.",m:8,c:[["7\u20138","Thorough investigation of several strategies applied to both an individual and a group sport; clearly links strategies to optimising arousal/managing anxiety; draws conclusions"],["5\u20136","Explains strategies and their use in both contexts"],["3\u20134","Describes psychological strategies with some application"],["1\u20132","Identifies psychological strategies"]],pts:["Arousal/inverted-U, anxiety types","Strategies (relaxation, rehearsal, self-talk, routines, goal setting)","Individual sport application","Group sport application (cohesion, position)","Conclusions"]}}},DOTS_FA2B={t10:{fa:"fa2",iq:2,v:"Discuss",t:"Discuss the factors that influence how strategies and tactics are applied to individual and group sports",inc:[],big:"A strategy is the overall game plan; tactics are the in-game actions. Both must adapt to the opponent, conditions, score and players' abilities.",notes:[["Strategy vs tactics","A **strategy** is the **pre-planned, overall approach** (e.g. a tennis player plans to attack the opponent's weaker backhand). **Tactics** are the **specific actions and adjustments made during the game** to carry out the strategy or respond to changes (e.g. switching to serve-and-volley when the opponent is standing deep)."],["Factors that influence them","**Opponent:** their strengths, weaknesses and style (scouting, video analysis). **Own athletes' abilities:** fitness, skill level, experience, injuries. **Environmental conditions:** weather (wind in cricket and golf, rain in football), surface (clay vs grass in tennis), altitude, heat. **Game situation:** score, time remaining, field position, number of players (e.g. after a sin-bin). **Rules and officials:** rule changes, how the referee interprets the rules. **Competition context:** importance of the match, home or away, finals. **Coach philosophy and team culture.** **Technology and data:** live GPS, analytics, wearables."],["Individual sports","The athlete often makes **independent, real-time decisions** (in tennis, coaching during matches is limited). Strategies centre on **personal strengths vs the opponent's weaknesses**, pacing (e.g. a 1500 m runner choosing sit-and-kick vs front-running), and the conditions. Flexibility depends on the athlete's own decision-making."],["Group sports","These need **communication, defined roles and structures** (set plays, defensive lines) and the **coordination of many players**. The coach has more influence (interchanges, time-outs, messengers). Factors such as **team cohesion**, player combinations and the opposition's structures matter. Complexity is higher, but there are more options."],["Discussion","In both kinds of sport, strategies must be **planned but flexible**. Over-rigid plans fail when conditions change; too much improvisation lacks structure. The best performers and teams **prepare thoroughly and adapt intelligently**."]],con:[["Strategy","An overall, pre-planned approach to a competition.","Kick deep to pin opponents in their own half"],["Tactic","A specific action or adjustment during play.","Switching to a zone defence after a substitution"],["Scouting","Analysing an opponent to plan strategies.","Video review of a netball opponent's attack"],["Game situation","The score, time and position that shape decisions.","Playing for possession when leading late"]],sum:["Strategy = overall plan; tactics = actions and adjustments during play.","Factors: opponent, own abilities, conditions, game situation, rules, competition context, data.","Individual: independent decisions, pacing, personal strengths vs the opponent.","Group: roles, communication, set plays, coach interventions, cohesion.","Best approach: plan thoroughly but adapt flexibly."],tip:"For 'discuss', show how factors can help OR limit tactics, using examples from both an individual and a group sport, then conclude.",reel:["h:Same team, totally different game plan *in the rain*. Why?","c:Strategy|The plan BEFORE||Tactics|The moves DURING","l:Factors|Opponent;Your abilities;Weather and surface;Score and time;Rules","p:Individual|Tennis: you make your own calls mid-match.","p:Group|Netball: roles, set plays, coach time-outs.","r:Factor \u2192 How it changes tactics \u2192 Example"],mcq:[["A tennis player deciding to target an opponent's weak backhand before the match is using a:",["Tactic","Strategy","Drill","Taper"],1,"A pre-planned overall approach is a strategy."],["Which is an environmental factor influencing tactics?",["Coach philosophy","Wind conditions","Team cohesion","Scouting"],1,"Weather and surface are environmental factors."],["Compared with individual sports, group sport tactics typically require more:",["Independent decisions","Communication and defined roles","Pacing decisions","Personal pre-performance routines"],1,"Group tactics rely on coordinating many players."]],sa:{q:"Discuss the factors that influence how strategies and tactics are applied in an individual sport and a group sport.",m:6,c:[["5\u20136","Presents a well-reasoned discussion of several factors and how they influence strategies/tactics in both an individual and a group sport, with examples"],["3\u20134","Describes factors with examples from one or both types of sport"],["1\u20132","Identifies factors or defines strategy/tactics"]],pts:["Strategy vs tactic definitions","Factors: opponent, ability, conditions, game situation","Individual sport example","Group sport example","Conclusion on flexibility"]}},t11:{fa:"fa2",iq:3,v:"Analyse",t:"Using research, analyse the dietary requirements, pre-, during and post-performance needs and fluid intake requirements of athletes from different sports",inc:[],big:"An athlete's nutrition depends on the energy systems and duration of their sport. Carbohydrate fuels, protein repairs, fluid keeps everything working.",notes:[["Daily dietary requirements","**Carbohydrate** is the main fuel for moderate to high-intensity exercise. Recommendations scale with training load: **3\u20135 g/kg/day** for light training, **5\u20137 g/kg** for moderate training (\u22481 h/day), **6\u201310 g/kg** for endurance training (1\u20133 h/day) and **8\u201312 g/kg** for extreme training (more than 4\u20135 h/day). **Protein:** **1.2\u20132.0 g/kg/day**, spread across meals (\u22480.3 g/kg every 3\u20134 h), for repair and adaptation. **Fats:** \u224820\u201335% of energy, from healthy sources. **Micronutrients:** iron (especially female and endurance athletes), calcium and vitamin D (bone health). Sources: Australian Institute of Sport (AIS) and Sports Dietitians Australia guidelines."],["Comparing sports","**Endurance (marathon, triathlon, road cycling):** very high carbohydrate needs and **carbohydrate loading** before events longer than 90 minutes (10\u201312 g/kg for 36\u201348 h) to maximise glycogen stores. **Strength and power (sprinting, weightlifting):** moderate carbohydrate, emphasis on protein timing for repair and hypertrophy, and creatine may be relevant. **Team sports (football, netball, AFL):** high carbohydrate because of intermittent, high-intensity efforts over long durations; recovery between games is critical. **Weight-category and aesthetic sports (boxing, gymnastics):** careful energy management, and a risk of **low energy availability (RED-S)**."],["Pre-performance","A meal **1\u20134 hours before**: high in carbohydrate, moderate in protein, low in fat and fibre (easy to digest), e.g. pasta, rice, toast with honey, a banana. Familiar foods only. A small carbohydrate snack 30\u201360 minutes before if needed."],["During performance","For events **under 1 hour**: water is usually enough. **1\u20132.5 hours**: **30\u201360 g of carbohydrate per hour** (sports drinks, gels, lollies). **More than 2.5 hours**: up to **90 g/hour** using mixed carbohydrate sources. Team sports: sports drinks at breaks."],["Post-performance: the 3 Rs","**Refuel** (carbohydrate \u22481\u20131.2 g/kg per hour for the first few hours to replace glycogen), **Repair** (\u224820\u201340 g protein soon after), **Rehydrate** (replace **\u2248125\u2013150% of fluid lost**, i.e. 1.25\u20131.5 L for each kg of body mass lost, plus sodium). E.g. a chocolate milk, or a chicken and rice meal."],["Fluid intake","Even **2% loss of body mass** from dehydration can impair performance (reduced blood volume, higher heart rate and core temperature, poorer concentration). Monitor with **pre- and post-training weigh-ins** and **urine colour**. Drink to a plan: before (\u22485\u20137 mL/kg 2\u20134 h before), during (to limit loss to under 2%), and after (125\u2013150%). Sweat rates vary with heat, intensity and the individual, so endurance and team sport athletes in hot conditions need the most. Avoid **overdrinking** (hyponatraemia)."]],con:[["Glycogen","Stored carbohydrate in muscles and liver, the key fuel for intense exercise.","Depleted after 90+ min of running"],["Carbohydrate loading","Increasing carbohydrate intake (10\u201312 g/kg) for 36\u201348 h before endurance events.","Marathon runner the 2 days before a race"],["3 Rs of recovery","Refuel, Repair, Rehydrate.","Chocolate milk after a game"],["Hyponatraemia","Low blood sodium caused by drinking too much water.","Overdrinking during a long event"],["RED-S","Relative Energy Deficiency in Sport: not eating enough for training demands.","Affects bone health and hormones"]],sum:["Carbohydrate scales with load (3\u201312 g/kg); protein 1.2\u20132.0 g/kg spread across the day.","Endurance athletes carb-load; strength athletes emphasise protein timing; team sports need high carbohydrate.","Pre-event: high-carb, low-fat, low-fibre, familiar meal 1\u20134 h before.","During: 30\u201360 g carb/h (1\u20132.5 h events); up to 90 g/h for more than 2.5 h.","After: the 3 Rs. Replace 125\u2013150% of fluid lost; a 2% loss of body mass impairs performance."],tip:"'Analyse' + 'using research': cite guidelines (AIS, Sports Dietitians Australia) and contrast at least two different sports, showing WHY needs differ (duration, energy system, body mass).",reel:["h:A marathoner and a weightlifter walk into a kitchen. *Different plates.* Why?","c:Endurance|Carbs up to 10\u201312 g/kg;Carb loading||Power|Protein focus;Moderate carbs","p:Pre-game|High-carb, low-fat, low-fibre meal 1\u20134 hours before.","p:During|30\u201360 g carbs per hour for 1\u20132.5 hour events.","l:The 3 Rs|Refuel;Repair;Rehydrate (125\u2013150%)","s:2%|body mass lost = performance drops","r:Sport demands \u2192 Before / During / After \u2192 Fluid"],mcq:[["After exercise, athletes should aim to replace approximately what percentage of fluid lost?",["50%","100%","125\u2013150%","300%"],2,"Ongoing sweat and urine losses mean you need more than 100%."],["Carbohydrate loading is MOST relevant for:",["A 100 m sprinter","A marathon runner","A golfer","A diver"],1,"Events of 90+ minutes benefit from maximised glycogen."],["A pre-performance meal should be:",["High fat and high fibre","High carbohydrate, low fat and familiar","Protein only","Eaten 10 minutes before"],1,"Easy-to-digest carbohydrate, eaten 1\u20134 h before."]],sa:{q:"Using research, analyse the different nutritional and fluid requirements of an endurance athlete and a strength/power athlete.",m:8,c:[["7\u20138","Detailed analysis of the daily, pre-, during and post-performance and fluid needs for BOTH athletes, with research-based quantities and clear reasons for differences"],["5\u20136","Explains nutritional needs of both athletes with some quantities and reasons"],["3\u20134","Describes nutritional needs of one or both athletes"],["1\u20132","Identifies nutrients or fluid needs"]],pts:["Carbohydrate g/kg differences + carb loading","Protein needs & timing","Pre/during/post for each","Fluid: 2% loss, 125\u2013150%, monitoring","Research reference (AIS/SDA) & reasons"]}},t12:{fa:"fa2",iq:3,v:"Explain",t:"Explain how sleep, nutrition and hydration can reduce fatigue and positively influence movement and injury prevention",inc:["Guidelines","Planning","Routines","Monitoring"],big:"Sleep, food and fluid are the cheapest performance enhancers there are. Getting them wrong increases fatigue, poor technique and injury.",notes:[["Sleep","**Guidelines:** adults need **7\u20139 hours**; teenagers **8\u201310 hours**; athletes often benefit from more. **Why it matters:** growth hormone release and tissue repair, memory consolidation of motor skills, mood, immune function. **Poor sleep:** slower reaction time, worse decision-making and accuracy, and a higher injury risk. Adolescent athletes sleeping under 8 hours have significantly higher injury rates. **Routines:** consistent bed and wake times, screens off 30\u201360 minutes before bed, a dark and cool room, limiting caffeine after midday, and naps of 20\u201330 minutes. **Monitoring:** sleep diaries and wearables."],["Nutrition","Low glycogen leads to **early fatigue**, and fatigue leads to **poor technique and slower reactions**, which raises **injury risk** (e.g. more injuries late in matches). Adequate **carbohydrate** sustains energy; **protein** repairs muscle; **calcium and vitamin D** support bone (preventing stress fractures); **iron** prevents fatigue from anaemia. **Planning:** periodise nutrition around training (more carbohydrate on heavy days), prepare meals and snacks in advance. **Monitoring:** body mass, energy levels, blood tests (iron), and a sports dietitian."],["Hydration","Dehydration reduces blood volume, raises heart rate and core temperature, and impairs concentration and coordination, which leads to **earlier fatigue, poor movement quality and heat illness**. **Guidelines:** start exercise well hydrated and limit loss to under 2% of body mass. **Routines:** a water bottle at all times, drinking at scheduled breaks, electrolytes in the heat. **Monitoring:** urine colour charts (pale straw = good), pre- and post-session weigh-ins."],["Putting it together","These three factors **interact**: poor sleep increases appetite for poor food choices; dehydration worsens perceived fatigue. A planned routine (e.g. a weekly plan with sleep targets, meal prep and a hydration schedule) and **monitoring** (wellness questionnaires, wearables) let coaches spot problems before injury occurs."]],con:[["Fatigue","Reduced capacity to produce force or perform, both physical and mental.","Slower sprint times late in a match"],["Sleep hygiene","Habits and environment that promote good sleep.","No screens for 60 min before bed"],["Wellness monitoring","Regular athlete self-reports on sleep, soreness, mood and energy.","Daily questionnaire at an NRL club"],["Urine colour chart","A simple hydration monitoring tool.","Pale straw = well hydrated"]],flow:["Poor sleep / low fuel / dehydration","Fatigue","Poor technique & reaction","Injury risk \u2191"],sum:["Sleep: 8\u201310 h for teens; supports repair, motor learning, reaction time. Under 8 h \u2192 higher injury risk.","Nutrition: carbohydrate delays fatigue, protein repairs, calcium/vitamin D and iron protect bone and energy.","Hydration: limit loss to under 2%; dehydration \u2192 fatigue, poor coordination, heat illness.","Use guidelines + planning + routines + monitoring (diaries, weigh-ins, urine colour, wearables).","Fatigue \u2192 poor movement quality \u2192 injury. Fixing the inputs breaks the chain."],tip:"'Explain' = cause and effect. Use the chain: poor sleep/fuel/fluid \u2192 fatigue \u2192 poor technique/decisions \u2192 injury. Mention all four 'including' points: guidelines, planning, routines, monitoring.",reel:["h:The cheapest performance enhancer? *Sleep.*","s:8\u201310 h|sleep recommended for teenagers","p:Tired = injured|Teen athletes on under 8 h sleep get injured more.","p:Fuel|Low glycogen \u2192 fatigue \u2192 sloppy technique \u2192 injury.","l:Hydration routine|Start hydrated;Lose under 2%;Check urine colour;Weigh in and out","r:Guidelines + Plan + Routine + Monitor"],mcq:[["The recommended sleep for teenagers is:",["5\u20136 hours","6\u20137 hours","8\u201310 hours","12\u201314 hours"],2,"Adolescents need 8\u201310 hours."],["How does fatigue increase injury risk?",["It improves technique","It reduces movement quality and reaction time","It increases flexibility","It has no effect"],1,"Fatigued athletes move less well and react more slowly."],["A simple field method for monitoring hydration is:",["DEXA scan","Urine colour chart","VO2 max test","1RM test"],1,"Urine colour and body-mass changes are practical tools."]],sa:{q:"Explain how sleep, nutrition and hydration can reduce fatigue and help prevent injury in athletes.",m:6,c:[["5\u20136","Clearly explains how each factor reduces fatigue and influences movement/injury, referring to guidelines, planning, routines and monitoring"],["3\u20134","Describes how sleep, nutrition and/or hydration affect fatigue or injury"],["1\u20132","Identifies guidelines or practices"]],pts:["Sleep guidelines + mechanism + injury link","Nutrition: carbs, protein, micronutrients","Hydration: 2%, effects, monitoring","Routines and planning","Monitoring tools"]}},t13:{fa:"fa2",iq:3,v:"Discuss",t:"Discuss the use of supplements, vitamins/minerals, protein, caffeine and creatine products for improved performance",inc:[],big:"A 'food first' approach comes first. A few supplements have strong evidence; most don't. All of them carry contamination risk for athletes subject to drug testing.",notes:[["Food first and the AIS framework","The **AIS Sports Supplement Framework** ranks supplements by evidence. **Group A:** strong evidence for specific situations (e.g. caffeine, creatine, beta-alanine, bicarbonate, nitrate, sports foods, and medical supplements such as iron and vitamin D when a deficiency is diagnosed). **Group B:** emerging evidence. **Group C:** little evidence. **Group D:** banned or at high risk of contamination. Most athletes should get what they need from a well-planned diet."],["Vitamins and minerals","Supplementation only helps where there is a **diagnosed deficiency**, for example **iron** (female and endurance athletes, vegetarians), **vitamin D** (indoor athletes, low sun exposure) or **calcium**. Taking extra when not deficient **does not improve performance** and some can be harmful in excess (e.g. vitamin A, iron overload)."],["Protein","Protein needs (1.2\u20132.0 g/kg) are usually met by food. **Protein powders** are a convenient option after training or when travelling, and \u224820\u201340 g after exercise maximises muscle protein synthesis. Excess protein gives no further gain, is expensive, and may displace carbohydrate."],["Caffeine","Caffeine has **strong evidence** (Group A). **3\u20136 mg/kg about 60 minutes before** exercise improves endurance, alertness and reaction time, and reduces perceived effort. Side effects: anxiety, a racing heart, gut upset and **disrupted sleep**. Effects vary between individuals. It is not banned (monitored by WADA)."],["Creatine","Creatine has **strong evidence** for **repeated high-intensity efforts and strength and power** (it increases phosphocreatine stores, so the ATP-PC system recovers faster). Typical dose: a loading phase of 20 g/day for 5 days, then 3\u20135 g/day, or simply 3\u20135 g/day. Side effects: **weight gain of 1\u20132 kg** (water retention), which is not ideal for endurance or weight-category athletes, and possible gut discomfort."],["Risks and ethics","Supplements are often **poorly regulated** and may be **contaminated** with banned substances. Athletes are bound by **strict liability**, meaning they are responsible for anything in their body. The **HASTA** batch-testing program helps reduce this risk. Other concerns: cost, false claims, and the message they send to young athletes. Under-18s are generally advised against using performance supplements."]],con:[["AIS Sports Supplement Framework","Classifies supplements A\u2013D by evidence and risk.","Caffeine and creatine = Group A"],["Food first","Meeting needs through diet before considering supplements.","Milk and yoghurt before protein powder"],["Strict liability","The athlete is responsible for any banned substance found in their body.","A contaminated supplement still means a ban"],["Phosphocreatine","High-energy compound that rapidly regenerates ATP.","Increased by creatine supplementation"]],sum:["Food first. Use the AIS framework (A strong evidence \u2192 D banned/high risk).","Vitamins/minerals only help if there is a diagnosed deficiency (iron, vitamin D, calcium).","Protein: powders are convenient; \u224820\u201340 g post-exercise; more gives no extra benefit.","Caffeine (3\u20136 mg/kg, 60 min before) and creatine (3\u20135 g/day) both have strong evidence.","Risks: contamination, strict liability, side effects, cost, ethics, especially for young athletes."],tip:"'Discuss' each product: evidence FOR + side effects or risks AGAINST + who it's relevant for, then give an overall position (e.g. 'food first, targeted Group A use only').",reel:["h:Should you take *pre-workout*? Let's look at the evidence.","p:Food first|Most athletes get what they need from good meals.","c:Strong evidence|Caffeine;Creatine||Weak evidence|Most 'boosters';Extra vitamins","p:Caffeine|3\u20136 mg/kg about 60 min before. Watch your sleep.","p:Creatine|Faster ATP-PC recovery for repeat sprints. Expect +1\u20132 kg.","p:Strict liability|Contaminated? Still YOUR ban.","r:Evidence \u2192 Benefit \u2192 Risk \u2192 Who it suits"],mcq:[["Creatine supplementation is MOST likely to benefit:",["A marathon runner","A rugby league player doing repeated sprints","A golfer","A lawn bowler"],1,"Creatine improves repeated high-intensity efforts via the ATP-PC system."],["Vitamin and mineral supplements improve performance when:",["Taken in large doses by anyone","A deficiency has been diagnosed","Taken just before competition","Combined with caffeine"],1,"Extra doses give no benefit without a deficiency."],["Under 'strict liability', an athlete who tests positive due to a contaminated supplement:",["Is automatically cleared","Is still responsible","Can blame the manufacturer only","Is retested next year"],1,"Athletes are responsible for whatever is in their system."]],sa:{q:"Discuss the use of caffeine AND creatine to improve performance.",m:6,c:[["5\u20136","Presents a balanced discussion of benefits, mechanisms, side effects and relevance for both supplements, with a position"],["3\u20134","Describes benefits and/or risks of both supplements"],["1\u20132","Identifies effects of caffeine or creatine"]],pts:["Caffeine: mechanism, dose, benefits (endurance, alertness, RPE)","Caffeine risks (sleep, anxiety)","Creatine: ATP-PC, repeat sprints, dose","Creatine risks (weight gain)","Contamination/AIS/position"]}},t14:{fa:"fa2",iq:4,v:"Explain",t:"Explain how biomechanics can be used to develop efficient movements for sustained movement and improved performance",inc:[],big:"Biomechanics applies physics to human movement. Efficient technique gets more performance out of less energy and less stress on the body.",notes:[["What biomechanics is","**Biomechanics** is the study of the forces acting on and produced by the body, and their effects. Efficient movement means **maximum output for minimum energy and injury risk**, which is key for **sustained movement** (e.g. running a marathon, swimming 1500 m)."],["Key principles","**Motion:** linear, angular and general. **Force:** Newton's laws. A greater force applied over a longer time gives greater momentum (impulse); e.g. a sprinter's push-off. **Balance and stability:** a lower centre of gravity and wider base of support give more stability (rugby tackle position, wrestling). **Levers:** longer levers give greater speed at the end (tennis racquet, cricket bowling arm). **Summation of forces:** sequential use of body parts from large to small, from the ground up (throwing, golf swing). **Fluid mechanics:** reducing **drag** (streamlined swimming body position, a cyclist's tuck, suits) and using **lift** (javelin angle, swimming hand pitch)."],["Developing efficient movement","Use **video analysis** (slow-motion, apps like Hudl Technique or Dartfish), **motion capture**, **force plates** and **wearable sensors** to identify inefficiencies. Then coaches correct technique: e.g. reducing **overstriding** in running (landing under the centre of mass reduces braking forces and the load on the knees), improving swimming **streamline and body roll** to reduce drag, and sequencing a throwing action properly to maximise velocity while reducing shoulder stress."],["Sustained movement and injury prevention","Efficient movement uses less energy, which means **better running economy**, delays fatigue and sustains performance. Good mechanics also **reduce injury**: correct **landing mechanics** (knees over toes, soft landings) reduce ACL injury risk in netball, and correct lifting technique protects the lower back. Equipment design (shoes, bikes fitted to the athlete) is also guided by biomechanics."]],con:[["Biomechanics","The study of forces and their effects on human movement.","Analysing a sprint start"],["Summation of forces","Sequential use of body parts to maximise force (largest to smallest).","Legs \u2192 hips \u2192 trunk \u2192 arm in a throw"],["Drag","Resistance from air or water opposing motion.","Swimmer streamlining to reduce drag"],["Running economy","Oxygen cost of running at a given speed; lower is more efficient.","Reduced overstriding improves economy"],["Centre of gravity","Point where body mass is concentrated; lowering it increases stability.","Low body position in a tackle"]],sum:["Biomechanics = forces and their effects on movement; efficiency = more output, less energy and injury.","Principles: force/impulse, balance and stability, levers, summation of forces, fluid mechanics.","Video analysis, force plates and sensors identify inefficiencies so technique can be corrected.","Efficiency improves economy, which delays fatigue and sustains movement (e.g. marathon, swimming).","Good mechanics prevent injury: landing technique (ACL), lifting technique (back)."],tip:"Use specific sporting examples for each biomechanical principle and finish with the effect on energy cost or injury. 'Explain' needs the cause \u2192 effect link.",reel:["h:Why do elite swimmers look *effortless*? Physics.","p:Summation of forces|Legs \u2192 hips \u2192 trunk \u2192 arm. Big to small, ground up.","p:Drag|Streamline your body = less resistance = faster for less energy.","p:Stop overstriding|Land under your centre of mass. Less braking, less knee load.","l:Analyse it|Slow-mo video;Force plates;Wearable sensors","r:Principle \u2192 Technique fix \u2192 Less energy and injury"],mcq:[["A swimmer reducing frontal surface area to go faster is applying:",["Summation of forces","Reducing drag (fluid mechanics)","Levers","Balance"],1,"Streamlining reduces drag."],["Summation of forces means:",["Using all muscles at the same time","Sequentially using body parts from large to small","Only using arm muscles","Reducing force"],1,"Sequential, ground-up force transfer maximises velocity."],["Reducing overstriding in distance running improves performance mainly by:",["Increasing braking forces","Improving running economy and reducing impact","Increasing drag","Lowering flexibility"],1,"Less braking means less energy wasted and less load on joints."]],sa:{q:"Explain how biomechanical principles can be used to develop efficient movement in a sport of your choice.",m:5,c:[["5","Clearly explains how two or more biomechanical principles improve efficiency in a named sport, linking to energy cost, performance and/or injury"],["3\u20134","Describes biomechanical principles with sport application"],["1\u20132","Identifies biomechanical principles"]],pts:["Named sport","Principle 1 + application + effect","Principle 2 + application + effect","Analysis tools (video)","Efficiency/injury link"]}},t15:{fa:"fa2",iq:4,v:"Justify",t:"Justify recovery strategies used for sustained movement and performance",inc:["Physiological strategies: cool-down, hydrotherapy","Psychological strategies: relaxation"],big:"Adaptation happens during recovery, not during training. Justify each strategy with the mechanism that makes it work.",notes:[["Why recovery matters","Training causes **fatigue, muscle damage, glycogen depletion and dehydration**. Adaptation (supercompensation) happens during **recovery**. Poor recovery leads to **overtraining**, injury, illness and a drop in performance. Recovery is especially important with **congested schedules** (e.g. tournaments, weekly team sport)."],["Cool-down (physiological)","5\u201315 minutes of light aerobic activity plus stretching. **Justification:** it keeps blood circulating through the muscle pump, which **prevents venous pooling** (and dizziness), helps the **removal of lactate and metabolic by-products**, and gradually returns heart rate, breathing and body temperature to resting. Static stretching may help maintain range of motion. The evidence on preventing soreness (DOMS) is limited, but a cool-down remains a low-cost, low-risk recovery routine."],["Hydrotherapy (physiological)","**Cold water immersion (CWI)** at 10\u201315\xB0C for 10\u201315 minutes **causes vasoconstriction**, which reduces inflammation, swelling and perceived soreness, so it is good between games in a tournament. **Contrast water therapy** alternates hot and cold (e.g. 1 min cold / 2 min hot \xD73). The vasoconstriction\u2013vasodilation 'pumping' may aid circulation and the removal of waste. **Spas and pools**: warm water and buoyancy support relaxation and gentle movement, and hydrostatic pressure reduces swelling. **Caution:** using cold immersion straight after *strength* sessions regularly may blunt hypertrophy adaptations, so match the strategy to the training goal."],["Relaxation (psychological)","**Techniques:** deep breathing, progressive muscle relaxation, meditation, mindfulness, music, massage. **Justification:** these reduce cortisol and sympathetic nervous system activity, **lower stress and anxiety**, improve **sleep quality** (when the most repair happens), and restore motivation and mental freshness. This is especially important after high-pressure competition."],["Other strategies","Sleep, nutrition (the 3 Rs), massage, compression garments, active recovery sessions, and monitoring (wellness questionnaires, HRV)."]],con:[["Supercompensation","The body adapts to a higher level during recovery after training stress.","Fitness improves in the days after hard training"],["Cold water immersion","Immersion in 10\u201315\xB0C water to reduce inflammation and soreness.","Ice baths between tournament games"],["Contrast water therapy","Alternating hot and cold water exposure.","1 min cold / 2 min hot \xD7 3"],["Overtraining","Chronic fatigue and reduced performance from too little recovery.","Elevated resting HR, poor sleep, illness"],["DOMS","Delayed onset muscle soreness, 24\u201372 h after unaccustomed exercise.","Sore legs two days after a new session"]],sum:["Adaptation (supercompensation) happens during recovery. Poor recovery \u2192 overtraining.","Cool-down: prevents blood pooling, helps remove waste, gradually returns HR and temperature to rest.","Cold water: vasoconstriction \u2192 less inflammation and soreness. Contrast: a pumping effect.","Avoid regular CWI straight after strength sessions (it may blunt hypertrophy).","Relaxation: lowers stress and cortisol \u2192 better sleep and mental freshness."],tip:"'Justify' = support with evidence and reasoning. For each strategy: what it is \u2192 physiological/psychological mechanism \u2192 evidence or example \u2192 when it's most appropriate.",reel:["h:Ice baths: *science* or suffering?","p:Recovery = gains|Your body adapts AFTER training, not during.","p:Cool-down|Muscle pump stops blood pooling and helps clear waste.","c:Cold water|Vasoconstriction;Less swelling and soreness||Contrast|Hot \u2194 cold;Pumping effect","p:Careful|Regular ice baths right after weights may blunt muscle growth.","p:Relaxation|Lower stress \u2192 better sleep \u2192 better repair.","r:Strategy \u2192 Mechanism \u2192 Evidence \u2192 When to use"],mcq:[["Cold water immersion reduces inflammation mainly through:",["Vasodilation","Vasoconstriction","Increasing heart rate","Raising body temperature"],1,"Cold narrows blood vessels, which reduces swelling."],["A key physiological justification for a cool-down is:",["It increases lactate","It prevents venous pooling and helps waste removal","It builds maximum strength","It replaces sleep"],1,"Continued light movement maintains circulation."],["Relaxation is classified as a:",["Physiological recovery strategy","Psychological recovery strategy","Training method","Supplement"],1,"It targets stress and mental fatigue."]],sa:{q:"Justify the use of O
