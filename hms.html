NE physiological and ONE psychological recovery strategy for an athlete in a weekly team-sport competition.",m:6,c:[["5\u20136","Provides well-supported justification of both strategies with accurate mechanisms and relevance to the athlete's context"],["3\u20134","Explains both strategies with some justification"],["1\u20132","Identifies recovery strategies"]],pts:["Context: weekly competition, fatigue","Physiological (e.g. CWI): procedure + mechanism + benefit","Psychological (relaxation): technique + mechanism + benefit","Evidence/limitations","Linked to sustained performance"]}},t16:{fa:"fa2",iq:4,v:"Examine",t:"Examine the role technology can play in improving performance",inc:["Training innovations","Equipment advances","Recording and monitoring training and performance"],big:"Technology gives athletes better tools, better equipment and better data, but it raises questions about cost, access and fairness.",notes:[["Training innovations","**Altitude tents and chambers** (live high, train low) increase red blood cells. **Virtual reality** for decision-making (e.g. quarterbacks, cricket batters). **Anti-gravity treadmills** for rehab. **Velocity-based training** (sensors on barbells measure bar speed to adjust load daily). **Smart trainers and Zwift** for indoor cycling. **Blood flow restriction training** for strength during rehab."],["Equipment advances","**Carbon-plated 'super shoes'** improve running economy by about 4% and contributed to marathon records, leading World Athletics to regulate sole thickness. **Full-body polyurethane swimsuits** (2008\u201309) were banned in 2010 after a flood of world records. **Lighter, stiffer bikes and aerodynamic helmets**, carbon tennis racquets, **better protective gear** (helmets, mouthguards), and **prosthetics** for Paralympic athletes."],["Recording and monitoring","**GPS units** track distance, high-speed running and load (standard in the NRL, AFL and A-League). **Heart rate monitors** and **HRV** monitor intensity and readiness. **Video analysis** (Hudl, Dartfish) for technique and tactics. **Force plates** measure jump power and asymmetry. **Wearables** track sleep and recovery (WHOOP, Oura). **Hawk-Eye and VAR** support officiating. Data leads to individualised load management, which **reduces injury** (the acute:chronic workload ratio) and improves tactical preparation."],["Examining the impact","**Benefits:** more precise training, injury reduction, better technique, faster recovery, improved safety. **Issues:** **cost and access** (an advantage for wealthy nations and clubs), **'technological doping'** (where is the line?), over-reliance on data at the expense of athlete feel, privacy of athlete data, and the 'spirit of sport'. Governing bodies regulate equipment to keep competition fair."]],con:[["GPS tracking","Wearable units that measure distance, speed and load.","High-speed running metres in the NRL"],["Velocity-based training","Using bar-speed sensors to adjust resistance training load.","Reducing load when bar speed drops"],["Technological doping","Gaining an unfair advantage through equipment.","2008 polyurethane swimsuits"],["Acute:chronic workload ratio","Comparing recent load to longer-term load to manage injury risk.","Avoiding sudden spikes in training load"]],sum:["Training innovations: altitude tents, VR, velocity-based training, anti-gravity treadmills.","Equipment: super shoes (\u22484% economy), banned polyurethane suits, aero bikes, safer protective gear.","Monitoring: GPS, heart rate/HRV, video analysis, force plates, sleep wearables.","Benefits: precision, injury reduction, technique, safety.","Issues: cost/access, technological doping, privacy, over-reliance. Regulation keeps it fair."],tip:"'Examine' = inquire into impact. Use specific named technologies, explain HOW each improves performance, then consider limitations or ethical issues.",reel:["h:Shoes that make you *4% more efficient*? Fair or not?","l:Train smarter|Altitude tents;VR decision training;Velocity-based training","p:Super shoes|Carbon plates boosted running economy, so the rules changed.","p:Data wins|GPS load tracking helps clubs avoid injury spikes.","c:Benefits|Precision;Safety;Less injury||Issues|Cost;Fairness;Privacy","r:Tech \u2192 How it helps \u2192 Limitation or ethics"],mcq:[["GPS units in team sports are mainly used to:",["Measure flexibility","Monitor distance, speed and training load","Diagnose injuries","Measure VO2 max directly"],1,"GPS quantifies external load for load management."],["Full-body polyurethane swimsuits were banned because they:",["Were unsafe","Gave an unfair performance advantage","Were too expensive to make","Caused injuries"],1,"They produced a flood of records, which raised fairness concerns."],["A limitation of performance technology is:",["Improved technique","Unequal access due to cost","Injury reduction","Better data"],1,"Wealthier athletes, clubs and nations benefit more."]],sa:{q:"Examine how technology for recording and monitoring training can improve performance. Refer to specific examples.",m:6,c:[["5\u20136","Detailed examination of specific technologies, how they improve performance/reduce injury, and their limitations"],["3\u20134","Describes technologies and some benefits"],["1\u20132","Identifies technologies"]],pts:["GPS/load monitoring + injury link","Video analysis + technique/tactics","HR/HRV/wearables + recovery","Examples from named sports","Limitations: cost, data overload, privacy"]}},t17:{fa:"fa2",iq:4,v:"Explain",t:"Explain the management and prevention of sporting injuries",inc:["Classification of sports injuries: direct and indirect, soft and hard tissue, overuse","Injury assessment including TOTAPS (Talk, Observe, Touch, Active movement, Passive movement, Skill test)","Injury management","Rehabilitation: progressive mobilisation, graduated exercise, training, heat and cold","Return to play policy and procedures: application to different sports, responsibility"],big:"Classify it, assess it (TOTAPS), manage it (RICER / No HARM), rehab it progressively, and only return when it's safe, using clear policy.",notes:[["Classifying injuries","**Direct:** caused by an external force (a tackle, being hit by a ball), e.g. bruising, fractures. **Indirect:** caused by internal forces, with no contact (an awkward landing, overstretching), e.g. ACL tears, hamstring strains. **Soft tissue:** muscles, tendons, ligaments, skin (sprains = ligament; strains = muscle/tendon; contusions; abrasions). **Hard tissue:** bones and teeth (fractures, dislocations). **Overuse:** repetitive stress over time (stress fractures, tendinopathy, shin splints)."],["Injury assessment: TOTAPS","**T**alk: ask the athlete what happened, where it hurts, any history. **O**bserve: look for swelling, deformity, bruising, compare to the other side. **T**ouch: gently feel for tenderness, heat, deformity. **A**ctive movement: the athlete moves the injured part themselves through its range. **P**assive movement: the assessor gently moves the part through its range. **S**kill test: perform sport-specific skills (e.g. hop, sidestep) before any return. **Stop at any stage** if there is pain or obvious serious injury. Before TOTAPS, use **DRSABCD** for serious incidents, and the **CRT6/HIA** for suspected concussion."],["Injury management","For soft tissue injuries in the first 48\u201372 hours: **RICER**: Rest, Ice (15\u201320 min every 2 hours), Compression, Elevation, Referral. Avoid **No HARM**: no Heat, Alcohol, Running or Massage, because these increase bleeding and swelling. Newer frameworks such as **PEACE & LOVE** add Protection and Education, then Load, Optimism, Vascularisation (pain-free cardio) and Exercise. Hard tissue: immobilise (splint), and refer to medical care."],["Rehabilitation","**Progressive mobilisation:** restore range of motion gradually once acute inflammation subsides. **Graduated exercise:** progressively increase strength, then power, then balance and proprioception, then sport-specific work (e.g. hops, cutting). **Training:** maintain fitness with cross-training (bike, pool) while injured. **Heat and cold:** cold in the acute phase to reduce swelling; heat in the later phase to increase blood flow and tissue extensibility before exercise."],["Return to play","**Criteria:** full pain-free range of motion, strength \u224890% or more of the uninjured side, successful sport-specific skill tests, psychological readiness, and **medical clearance**. **Policies differ by sport**: e.g. Australian concussion guidelines require **at least 21 days** before returning to contact sport for community athletes, and the NRL and AFL have strict HIA protocols. **Responsibility is shared**: athlete, coach, medical staff, club, parents, and governing bodies. The rule is: 'If in doubt, sit them out'."],["Prevention","Pre-participation screening, an appropriate warm-up (e.g. FIFA 11+, Netball KNEE program), correct technique, conditioning (especially eccentric hamstring strength), protective equipment, safe environments, rules, load management, sleep and nutrition."]],con:[["Direct injury","Injury caused by an external force or contact.","Fractured cheekbone from a stray elbow"],["Indirect injury","Injury caused by internal forces without contact.","Non-contact ACL rupture when landing"],["Overuse injury","Injury from repeated stress over time.","Stress fracture in a distance runner"],["TOTAPS","Talk, Observe, Touch, Active, Passive, Skill: on-field assessment.","Assessing a rolled ankle"],["RICER","Rest, Ice, Compression, Elevation, Referral.","First 48\u201372 h of a soft-tissue injury"],["No HARM","No Heat, Alcohol, Running, Massage in the first 48\u201372 hours.","Avoid hot showers on a fresh sprain"]],flow:["Classify","Assess (TOTAPS)","Manage (RICER, No HARM)","Rehab (mobilise \u2192 strengthen \u2192 skill)","Return-to-play criteria"],sum:["Classify: direct vs indirect; soft vs hard tissue; overuse.","Assess with TOTAPS (Talk, Observe, Touch, Active, Passive, Skill). Stop if pain or serious injury.","Manage soft tissue with RICER and avoid HARM for 48\u201372 h.","Rehab: progressive mobilisation \u2192 graduated exercise \u2192 sport skills; cross-train; cold early, heat later.","Return to play: pain-free range, \u224890% strength, skill tests, clearance. Concussion: at least 21 days (community)."],tip:"Use the injury pathway as your structure: classify \u2192 assess \u2192 manage \u2192 rehab \u2192 return. A specific example (e.g. an ankle sprain in netball) carried right through makes an 'explain' answer outstanding.",reel:["h:Rolled ankle on court. *What now?* Run the play.","c:Direct|Contact (tackle, ball)||Indirect|No contact (landing, twisting)","l:TOTAPS|Talk;Observe;Touch;Active;Passive;Skill","p:First 48\u201372 hours|RICER. And No HARM: no Heat, Alcohol, Running, Massage.","l:Rehab|Mobilise;Strengthen;Balance;Sport skills","p:Concussion|At least 21 days before contact sport (community). If in doubt, sit them out.","r:Classify \u2192 Assess \u2192 Manage \u2192 Rehab \u2192 Return"],mcq:[["In TOTAPS, the 'P' stands for:",["Pain","Passive movement","Progression","Physio"],1,"Passive movement: the assessor moves the limb."],["A non-contact ACL tear is classified as:",["Direct, hard tissue","Indirect, soft tissue","Overuse, hard tissue","Direct, soft tissue"],1,"Ligaments are soft tissue; no contact means indirect."],["Which should be AVOIDED in the first 48\u201372 hours of a soft tissue injury?",["Ice","Compression","Heat and massage","Elevation"],2,"No HARM: heat and massage increase bleeding and swelling."]],sa:{q:"Explain the process of managing a soft tissue injury from the moment it occurs to the athlete's return to play.",m:8,c:[["7\u20138","Comprehensive, sequenced explanation including classification, TOTAPS, immediate management (RICER/No HARM), progressive rehabilitation and return-to-play criteria/responsibility, with an example"],["5\u20136","Explains most stages of management with some detail"],["3\u20134","Describes some management procedures"],["1\u20132","Identifies injury management procedures"]],pts:["Classification of the injury","TOTAPS assessment","RICER/No HARM 48\u201372h","Rehab: mobilisation \u2192 graduated exercise \u2192 skill; heat/cold","Return-to-play criteria & responsibility"]}},t18:{fa:"fa2",iq:4,v:"Discuss",t:"Discuss the impact of drug use on injury management and improving performance",inc:["Health implications","Ethical considerations","Drug testing"],big:"Some drugs legitimately help injured athletes heal; others are used to cheat. Either way there are health risks, ethical lines and testing rules.",notes:[["Drugs in injury management","**Legitimate medical use:** **analgesics** (paracetamol) for pain; **anti-inflammatories (NSAIDs)** such as ibuprofen reduce inflammation and pain; **corticosteroid injections** for inflammation (permitted with restrictions and a Therapeutic Use Exemption (TUE) in competition); **local anaesthetics** to numb pain. **Issues:** masking pain can let an athlete **play on injured and worsen the damage** (e.g. painkilling injections before a grand final). NSAIDs may slow some tissue healing (e.g. bone) and cause stomach or kidney problems. Opioid painkillers carry risks of dependence."],["Performance-enhancing drugs (PEDs)","**Anabolic agents (steroids):** increase muscle mass and strength and speed recovery. Health risks: heart disease, liver damage, hormonal disruption, aggression, acne, infertility. **EPO and blood doping:** increase red blood cells and oxygen transport. Health risks: thick blood, clots, stroke, heart attack. **Stimulants:** increase alertness and reduce fatigue. Health risks: heart arrhythmias, addiction, overheating. **Peptide hormones** (e.g. growth hormone) for muscle and recovery. **Diuretics and masking agents:** used to lose weight rapidly or hide other drugs. **Beta-blockers:** reduce tremor in precision sports (archery, shooting)."],["Ethical considerations","**Fairness and the spirit of sport:** an unfair advantage over clean athletes. **Health:** athletes risk their long-term health, and there is pressure on others to follow. **Role modelling:** influence on young people. **Coercion** by coaches or support staff (e.g. the **Essendon supplement program**, 2012). **Integrity** of results and public trust. Grey areas: 'legal' technologies (altitude tents) vs illegal methods, and TUEs."],["Drug testing","The **World Anti-Doping Agency (WADA)** publishes the annual **Prohibited List**. In Australia, **Sport Integrity Australia** conducts testing. Athletes can be tested **in-competition and out-of-competition**, by **urine and blood** sample. Elite athletes must provide **whereabouts** information. The **Athlete Biological Passport** monitors blood and steroid markers over time. **Strict liability** applies. Penalties: usually a **4-year ban** for intentional doping. **TUEs** allow medically necessary prohibited medications."],["Discussion","Drugs used properly in injury management can **help athletes recover and return to sport**, but misuse to mask pain risks long-term harm. PEDs may improve performance in the short term, but they carry serious **health, ethical and career** consequences. Testing deters doping but can't catch everything. Education and a culture of integrity are equally important."]],con:[["WADA Prohibited List","Annual list of substances and methods banned in sport.","Anabolic steroids, EPO, some stimulants"],["Therapeutic Use Exemption (TUE)","Permission to use a prohibited medication for a genuine medical condition.","Asthma medication above thresholds"],["Athlete Biological Passport","Long-term monitoring of biological markers to detect doping.","Blood profile changes over a season"],["Masking pain","Using drugs to hide pain so an athlete can play injured.","Painkilling injection before a final"],["Sport Integrity Australia","Australia's national anti-doping and integrity agency.","Conducts athlete testing"]],sum:["Injury management drugs (analgesics, NSAIDs, corticosteroids) help, but masking pain risks worse injury.","PEDs: steroids, EPO and blood doping, stimulants, growth hormone, diuretics, beta-blockers.","Health risks: heart and liver damage, clots, stroke, hormonal problems, addiction.","Ethics: fairness, spirit of sport, coercion (Essendon), role modelling.","Testing: WADA list, Sport Integrity Australia, in- and out-of-competition, biological passport, strict liability, 4-year bans."],tip:"'Discuss' = both sides. Contrast legitimate medical use vs misuse, benefits vs health and ethical costs, and evaluate testing's effectiveness, then reach a position.",reel:["h:Playing a grand final on a *painkilling injection*. Smart or dangerous?","c:Helps healing|Pain relief;Less inflammation||Risk|Masks pain;Worse injury","l:Banned methods|Steroids;EPO and blood doping;Stimulants;Diuretics","p:Ethics|Fairness, the spirit of sport, coercion (remember Essendon).","p:Testing|WADA list. Sport Integrity Australia. In and out of competition.","r:Medical use vs misuse \u2192 Health \u2192 Ethics \u2192 Testing"],mcq:[["EPO and blood doping improve performance by:",["Increasing muscle mass","Increasing red blood cells and oxygen transport","Reducing tremor","Masking other drugs"],1,"More red blood cells means more oxygen delivery."],["A Therapeutic Use Exemption allows an athlete to:",["Avoid drug testing","Use a prohibited medication for a genuine medical condition","Use steroids for recovery","Compete without whereabouts"],1,"TUEs are granted for genuine medical need."],["A key risk of using painkillers to play while injured is:",["Faster healing","Masking pain and worsening the injury","Improved skill","Lower heart rate"],1,"Pain is a protective signal; masking it risks further damage."]],sa:{q:"Discuss the ethical and health implications of drug use in sport, with reference to drug testing.",m:8,c:[["7\u20138","Presents a sustained, balanced discussion of health AND ethical implications with specific drugs/cases and evaluates the role of drug testing"],["5\u20136","Explains health and ethical implications with some reference to testing"],["3\u20134","Describes drugs used in sport and some implications"],["1\u20132","Identifies drugs or issues"]],pts:["Specific drugs + health effects","Injury management drugs & masking","Ethics: fairness, coercion, role models","Testing: WADA, SIA, ABP, strict liability, TUE","Position/judgement"]}}},UP_A={h1:{ex:{title:"The chronic disease shift",text:"Australia's Health reports show that life expectancy at birth is about 81 years for males and 85 years for females, among the highest in the OECD. However, chronic conditions now cause most of the burden of disease. Coronary heart disease, dementia, stroke, lung cancer and COPD are the leading causes of death, and about half of Australians live with at least one chronic condition. Much of this burden comes from modifiable risk factors such as tobacco use, overweight and obesity, and poor diet.",use:"Although Australians have a high life expectancy of about 81 years for males and 85 for females, about half live with at least one chronic condition. This shows that we are living longer but not always in good health, largely because of modifiable risk factors such as obesity and smoking."},mist:["Quoting statistics without explaining what they show. Every number needs a 'which means\u2026' sentence.","Writing about 'Australians' as one group. Analyse means showing how outcomes differ for males and females, and for different population groups.","Confusing morbidity (illness) with mortality (death).","Describing risky behaviours as purely individual choices instead of linking them to sociological factors such as SES, peers and media."]},h2:{ex:{title:"Rheumatic heart disease in remote communities",text:"Rheumatic heart disease (RHD) is almost unknown in most of Australia, but rates among Aboriginal and Torres Strait Islander peoples in remote Northern Territory communities are among the highest in the world. It begins with untreated Strep A infections of the throat and skin, which spread easily in overcrowded housing. Repeated infections damage the heart valves, often in children and young adults.",use:"For example, rheumatic heart disease is far more common among Aboriginal and Torres Strait Islander peoples in remote communities, because overcrowded housing spreads Strep A infections and limited access to primary care means they go untreated. This shows how environmental and socioeconomic determinants interact to produce health inequity."},mist:["Listing determinants separately instead of showing how they interact (e.g. remoteness + overcrowding + limited services).","Blaming individual behaviour without explaining the historical causes: colonisation, dispossession and intergenerational trauma.","Forgetting to cover ONE other group in the same depth as Aboriginal and Torres Strait Islander peoples.","Giving actions without explaining why they work. Community control and cultural safety are key reasons."]},h3:{ex:{title:"Australia vs Japan",text:"Japan has one of the highest life expectancies in the world, about 84\u201385 years compared with Australia's 83. A key difference is obesity: only around 4\u20135% of Japanese adults are obese, compared with about 30% of Australian adults. Japan's traditional diet is high in fish, vegetables and soy, portions are smaller, and people walk and use public transport more. Australia does better on smoking rates, partly because of tobacco control such as plain packaging (2012).",use:"Whereas about 30% of Australian adults are obese, only around 4\u20135% of Japanese adults are. This partly explains Japan's higher life expectancy and lower rates of cardiovascular disease, and it suggests Australia could learn from Japan's focus on diet and active transport."},mist:["Describing each country separately instead of comparing them side by side (use whereas, similarly, in contrast).","Giving only differences. Compare needs similarities too.","Stating rankings without accounting for why they differ (diet, health system, policy, culture, inequity).","Using out-of-date or made-up statistics. Use approximate figures you are confident about."]},h4:{ex:{title:"The 80% fall in CVD deaths",text:"The age-standardised death rate from cardiovascular disease has fallen by more than 80% since its peak in 1968. Fewer people smoke, blood pressure and cholesterol are better controlled with PBS medicines such as statins, and emergency treatments such as stents and faster ambulance response save more lives. However, CVD still causes about 1 in 4 deaths, and rates remain higher for males, older people, Aboriginal and Torres Strait Islander peoples and people in low-SES and remote areas.",use:"Although the CVD death rate has fallen by more than 80% since 1968 due to reduced smoking and better medical treatment, CVD still causes about 1 in 4 deaths. This is because risk factors such as obesity and physical inactivity remain highly prevalent."},mist:["Mixing up prevalence (how many people have a condition) and incidence (new cases in a period).","Describing trends without explaining the factors behind them.","Forgetting 'where and for whom', i.e. which groups have higher rates and why.","Covering CVD and cancer well but giving the third condition only a sentence."]},h5:{ex:{title:"Dementia and the ageing population",text:"Dementia is now one of the leading causes of death in Australia and the leading cause of death for women. The number of Australians living with dementia is projected to roughly double by 2058 as the population ages. It increases demand for aged care, carers and specialist services, which is why strategies such as the National Dementia Action Plan and dementia-friendly communities aim to help people live well at home for longer.",use:"For example, the number of Australians living with dementia is projected to roughly double by 2058, which will increase demand for aged care and carers. This is why strategies such as Support at Home, which helps older people live independently, are a priority."},mist:["Only writing about challenges. The dot point asks for opportunities too, such as volunteering, grandparent childcare and workforce experience.","Not defining healthy ageing, or confusing it with simply living longer.","Giving strategies without linking them to a specific challenge they address.","Forgetting to finish with a conclusion, which Investigate requires."]},h6:{ex:{title:"The bulk billing squeeze",text:"Because Medicare rebates did not keep up with the cost of running a practice, many GP clinics stopped bulk billing, and out-of-pocket costs rose. Surveys found that a significant share of people delayed seeing a GP because of cost, and some went to hospital emergency departments instead. The government responded by tripling the bulk billing incentive for children, pensioners and concession card holders in 2023, later expanding incentives, and opening Medicare Urgent Care Clinics.",use:"Although Medicare is designed to provide universal access, declining bulk billing has increased out-of-pocket costs, so some low-income Australians delay seeing a GP. This shows that the system is only partly effective in providing equity of access."},mist:["Describing Medicare and the PBS without making a judgement. Assess needs a clear verdict, such as 'effective to a large extent'.","Only listing strengths, or only weaknesses. Weigh both.","Writing 'equity' without naming who misses out (low SES, rural and remote, First Nations peoples).","Forgetting future opportunities, which the dot point specifically includes."]},h7:{ex:{title:"Who looks after a heart attack patient?",text:"When someone has a heart attack, a state-run ambulance takes them to a state public hospital. Their emergency surgery is free as a public patient because the federal and state governments jointly fund public hospitals. After discharge, their GP visits are subsidised by federal Medicare, their medicines by the federal PBS, and the Heart Foundation (an NGO) provides rehabilitation information and support. Local council parks and walking tracks support their recovery.",use:"For example, a heart attack patient is treated by a state-run ambulance and public hospital, is then supported by federally funded Medicare GP visits and PBS medicines, and receives rehabilitation information from the Heart Foundation, an NGO. This shows how responsibility is shared across all levels."},mist:["Listing which level does what without explaining HOW they share responsibility (funding vs delivery vs environment).","Mixing up federal and state roles. States run public hospitals; the federal government funds Medicare and the PBS.","Forgetting local government and the non-government sector.","Not explaining why sharing matters, or its downside (fragmentation and cost-shifting)."]},h8:{notes:[["What is person-centred care?","**Person-centred care** means organising care around the person, not around the system. The person is treated as a **partner in their own care**. Their preferences, culture and values are respected, families and carers are involved, and services are **coordinated** so the person does not have to piece their care together themselves. It is a principle of the **Australian Charter of Healthcare Rights** and the national safety and quality standards."],["Why collaboration is needed","No single organisation can meet all of a person's needs. Governments have the **funding and reach**, while non-government organisations (NGOs) often have **community trust, local knowledge and specialist expertise**. When they work together, the person gets joined-up care instead of being passed between disconnected services."],["How they collaborate: four examples","**headspace:** the federal government funds headspace through **Primary Health Networks (PHNs)**, and local NGOs run the centres. Young people aged 12\u201325 get mental health, physical health, alcohol and other drug, and work and study support in **one place**. **Aboriginal Community Controlled Health Organisations (ACCHOs):** government-funded but **run by local communities**, so care is culturally safe and holistic. Many also offer transport and social support. **Primary Health Networks:** 31 federally funded regions that **commission local services** and link GPs, hospitals and community organisations. **The NDIS:** government funding follows the participant, who **chooses** their own private or not-for-profit providers."],["Why it matters","Collaboration reduces **gaps and duplication**, improves **continuity of care** (one plan, shared information), and makes services easier to navigate. Shared tools such as **My Health Record** help, because different providers can see the same information. For an Outline question, name the collaboration, say briefly how it works, and state the benefit to the person."]],ex:{title:"headspace",text:"headspace was established in 2006 as the National Youth Mental Health Foundation. The federal government funds it through Primary Health Networks, and local non-government lead agencies operate the 150+ centres around Australia. Young people aged 12\u201325 can get help with mental health, physical and sexual health, alcohol and other drugs, and work and study in one youth-friendly place, and also online and by phone through eheadspace.",use:"For example, headspace is funded by the federal government through Primary Health Networks but run by local non-government organisations. This allows young people aged 12\u201325 to access mental health, physical health and work and study support in one place, which is person-centred because care is organised around the young person's needs."},mist:["Writing too much. Outline means the main features. Name the collaboration, how it works and the benefit, then move on.","Describing what one organisation does alone instead of how government and NGOs work together.","Not defining person-centred care, or not linking the example back to it.","Using vague examples ('community groups help') instead of named ones such as headspace or ACCHOs."]},h9:{ex:{title:"Treatment vs prevention spending",text:"Australia spends about 10% of GDP on health, more than $240 billion a year, and spending is rising faster than the economy. However, only about 2% of health spending goes to prevention, even though much of the burden of disease comes from preventable chronic conditions. The National Preventive Health Strategy aims to increase prevention spending to 5% of total health spending by 2030.",use:"Although Australia spends about 10% of GDP on health, only about 2% of this goes to prevention. This means the system mainly pays to treat chronic diseases that could have been prevented, which threatens its sustainability as the population ages."},mist:["Only describing how much is spent. Discuss needs points for and against, then a position.","Forgetting future populations. Use the ageing population and Intergenerational Report projections.","Not linking expenditure to equity (out-of-pocket costs, private insurance incentives that benefit higher earners).","Confusing Medicare (public scheme) with private health insurance."]}},UP_B={h10:{ex:{title:"St John's wort and the pill",text:"St John's wort is a herbal product some people take for low mood. It is sold as a listed (AUST L) medicine, which means it has been checked for safety and quality but not evaluated for effectiveness. It interacts with several prescription medicines, including the oral contraceptive pill, which it can make less effective, and some antidepressants. Many users do not tell their doctor they are taking it.",use:"For example, St John's wort is a listed (AUST L) complementary medicine that can reduce the effectiveness of the contraceptive pill. This shows why people should use complementary approaches alongside, not instead of, medical advice, and tell their doctor what they take."},mist:["Describing complementary therapies without explaining WHY people use them (prevention, chronic conditions, holistic care, control).","Saying all complementary therapies 'don't work'. Some have evidence; the point is to evaluate it.","Forgetting the AUST L vs AUST R difference, which is a precise, mark-earning detail.","Leaving out the risks: interactions, delayed treatment, cost and limited regulation."]},h11:{ex:{title:"'Detox' teas on social media",text:"Influencers often promote 'detox' or 'skinny' teas with before-and-after photos and discount codes. Many contain laxatives or diuretics, so any weight lost is mostly water and stool rather than fat, and they can cause dehydration and electrolyte imbalance. The products are usually promoted by people who are paid to sell them, not by qualified health professionals.",use:"For example, 'detox' teas promoted by paid influencers often contain laxatives, so weight lost is mainly water and can lead to dehydration. A critical health consumer would check the source's qualifications, look for peer-reviewed evidence, and notice the conflict of interest."},mist:["Defining a critical health consumer but not explaining why it matters (harm, wasted money, delayed treatment).","Giving vague advice like 'check if it's reliable'. Name the criteria: source, evidence, currency, motive.","Forgetting consumer protections such as the TGA, AHPRA and the ACCC.","Not using a specific example of misinformation."]},h12:{notes:[["What you are investigating","This dot point is about the **pressures on the healthcare system now** (current challenges) and the **changes that are reshaping it** (emerging changes). To **investigate**, explain what each challenge is, what is causing it, how the system is responding, and then **draw a conclusion** about how well it is coping."],["Current challenges and their causes","**Rising demand:** an ageing population and the growth of chronic disease mean more people need ongoing care, so GP visits, hospital admissions and medicines all increase. **Workforce shortages:** there are not enough GPs, nurses and aged care workers, especially in rural and remote areas. Fewer graduates choose general practice, and burnout after COVID-19 led many to leave. As a result, people wait longer and rural communities miss out. **Declining bulk billing:** Medicare rebates did not keep up with costs for many years, so many clinics began charging gap fees. Some people delayed care and went to emergency departments instead. **Hospital pressure:** long emergency department waits, **ambulance ramping** and elective surgery backlogs after COVID-19. **Mental health demand:** especially among young people, with long waits for psychologists."],["How the system is responding","**Medicare Urgent Care Clinics** treat urgent but non-life-threatening conditions free of charge, which takes pressure off emergency departments. **Tripled bulk billing incentives** (2023), later expanded, aim to make GP visits free again for more people. **Expanded scopes of practice:** pharmacists can now prescribe for some conditions, such as uncomplicated urinary tract infections, and nurse practitioners provide more care independently. **Workforce incentives:** bonded medical places and rural training pathways aim to attract doctors to the regions."],["Emerging changes","**Digital health:** permanent telehealth, e-prescriptions and **virtual hospitals** bring care into the home. **Artificial intelligence:** AI reads medical images and AI scribes reduce paperwork. **Genomics and personalised medicine** match treatment to the individual. **Climate change** brings heatwaves, bushfire smoke and new disease patterns, which the system must prepare for. The **Australian Centre for Disease Control** is being established to improve pandemic preparedness."],["Drawing a conclusion","These challenges are **linked**: workforce shortages make access worse in rural areas, and ageing drives up costs, which threatens sustainability. The emerging responses offer real solutions, but they **take time** (training a doctor takes over a decade) and some, such as digital health, risk **widening the digital divide**. A strong conclusion judges how well the system is adapting, e.g. it is responding actively, but long-term workforce investment will decide its success."]],ex:{title:"Medicare Urgent Care Clinics",text:"Medicare Urgent Care Clinics began opening in 2023 to treat urgent but not life-threatening conditions, such as minor fractures, cuts, sprains and infections. They are bulk billed, open extended hours and do not need an appointment. Around 80+ clinics have opened, aiming to reduce pressure on hospital emergency departments, where long waits and ambulance ramping had become a major challenge.",use:"For example, Medicare Urgent Care Clinics, opened from 2023, provide free care for urgent but non-life-threatening conditions such as sprains and minor infections. This responds to emergency department congestion, although it does not solve the underlying shortage of GPs."},mist:["Listing challenges without explaining their causes or the system's response.","Mixing up 'current' and 'emerging'. Organise your answer so the marker can see both.","Forgetting to draw a conclusion, which Investigate requires.","Using vague claims ('the system is under pressure') without specific evidence or examples."]},h13:{notes:[["What 'relationship' means here","The relationship between technology and health is **two-way and mixed**. Technology can **improve** health by giving better diagnosis, treatment and access, and it can **harm** health through sedentary behaviour, poor sleep, misinformation and cost. A **Discuss** answer weighs the positives against the negatives and reaches a reasoned position."],["How technology improves health","**Better diagnosis and treatment:** MRI and CT scans detect disease earlier, and keyhole and robotic surgery mean faster recovery. The **cochlear implant**, an Australian invention, restores hearing. **Better access:** telehealth lets rural Australians see specialists without travelling, and headspace's eheadspace gives young people online and phone counselling. **Self-management:** continuous glucose monitors help people with diabetes control their blood sugar, and fitness apps and wearables can motivate people to move more. **Health promotion:** campaigns on social media reach young people where they spend their time."],["How technology harms health","**Sedentary behaviour:** screen time displaces physical activity. Fewer than 1 in 10 young Australians meet the physical activity guidelines. **Sleep:** using devices late at night delays the release of melatonin, which reduces sleep quality, and poor sleep affects mood, concentration and mental health. **Social media:** it is linked to cyberbullying, body image concerns and anxiety in some young people, which is why Australia introduced a **social media minimum age of 16**. **Misinformation:** false health claims spread faster than evidence. **Cost:** expensive new technology increases health spending."],["Who benefits and who misses out","The benefits are **not shared equally**. The **digital divide** means older people, low-income households, some Aboriginal and Torres Strait Islander communities and people in remote areas with poor internet are less able to use digital health. If not addressed, technology can **widen** existing health inequities."],["Making a judgement","The relationship is **neither simply good nor bad**. Technology's impact depends on **who has access, how it is used and how it is regulated**. A strong position: overall, technology has greatly improved health outcomes and access, but its benefits are greatest when people have digital health literacy and when harmful uses are regulated."]],ex:{title:"Australia's social media minimum age",text:"In 2024, Australia passed a law requiring social media platforms to take reasonable steps to stop under-16s from holding accounts, with the change taking effect in late 2025. The aim is to reduce harms linked to social media, such as cyberbullying, exposure to harmful content and body image pressure. Critics argue it could cut young people off from support networks and be hard to enforce.",use:"On the other hand, social media is linked to cyberbullying and body image concerns among young people, which led Australia to introduce a social media minimum age of 16. However, critics argue this may also cut some young people off from online support, showing the relationship is complex."},mist:["Only giving positives or only negatives. Discuss needs both sides.","Not reaching a position at the end.","Writing generally about 'technology' without specific examples (telehealth, CGMs, the social media minimum age).","Forgetting equity: the digital divide is a key point markers look for."]},h15:{ex:{title:"My Health Record",text:"My Health Record is Australia's national digital health record, held by most Australians since it became opt-out in 2019. It can store medicines, allergies, test results, immunisations and hospital discharge summaries, so that clinicians in different places can see the same information. However, not all providers upload information consistently, and many systems are not fully interoperable, so records are often incomplete.",use:"For example, most Australians have a My Health Record, which allows clinicians to see a patient's medicines and allergies and reduces medication errors. However, its impact is limited because not all providers upload information, so records are often incomplete."},mist:["Describing digital health services without evaluating them. Evaluate needs criteria and a judgement.","Ignoring 'to what extent' health information is connected (interoperability and incomplete records).","Forgetting challenges: privacy, cybersecurity, the digital divide and cost.","Only covering individuals. The dot point asks about organisations too."]},h16:{ex:{title:"AI in breast cancer screening",text:"AI tools are being trialled and used in Australia to help read mammograms in breast cancer screening programs. Mammograms are usually read by two radiologists; an AI system can act as an additional reader, flagging suspicious areas and helping detect cancers earlier while reducing the workload on a stretched workforce. Human radiologists still make the final decision.",use:"For example, AI is being used to help read mammograms in breast screening, flagging suspicious areas so cancers can be detected earlier and radiologists' workload is reduced. However, patients must consent to their data being used, and human oversight is essential in case the AI makes errors."},mist:["Describing AI uses without examining how they improve health outcomes or reduce spending.","Forgetting privacy measures (Privacy Act 1988, consent, de-identification, cybersecurity).","Ignoring the risk of bias: AI trained on unrepresentative data can be less accurate for some groups.","Presenting AI as replacing doctors. In Australia it supports clinicians under human oversight."]},h17:{ex:{title:"How SDG 4 supports SDG 3",text:"Education is one of the strongest predictors of health. More education improves health literacy, so people can understand health information and use services well. It also leads to better jobs and income, which provide healthier housing, food and access to care. Globally, children of mothers with more education are more likely to be vaccinated and to survive early childhood.",use:"SDG 4 (Quality Education) contributes to SDG 3 (Good Health and Wellbeing) because education improves health literacy, so people are better able to make healthy choices and use health services. Education also leads to higher income, which improves access to nutritious food and health care."},mist:["Listing the four SDGs without describing their key features (2015, 17 goals, 2030, universal, integrated, leave no one behind).","Giving the goal names without any targets or examples.","Writing about the SDGs as if they only apply to developing countries. They are universal.","Treating the goals as separate when the dot point stresses that they are interconnected."]},h18:{ex:{title:"Western Sydney Diabetes",text:"Western Sydney has some of the highest rates of type 2 diabetes in NSW. The Western Sydney Diabetes initiative brings together the local health district, the Primary Health Network, councils, community organisations and businesses. It runs screening and education in community languages, supports GPs to manage diabetes, and advocates for healthier food environments and more active neighbourhoods. This links SDG 3 (health), SDG 4 (education), SDG 10 (reaching culturally diverse and low-income groups) and SDG 11 (healthier urban environments).",use:"For example, the Western Sydney Diabetes initiative applies SDGs 3, 4, 10 and 11 by combining diabetes screening, health education in community languages and advocacy for healthier neighbourhoods. This is highly effective in targeting a major local health issue, although its long-term success depends on ongoing funding."},mist:["Describing the SDGs without applying them to a specific, named community.","Not using evaluation criteria. Say what 'effective' means (reach, equity, sustainability, health outcomes).","Giving strategies without explaining how the community can advocate for them.","Forgetting to say what can be learned from other communities."]}},UP_C={t1:{ex:{title:"The APSS in action",text:"A 45-year-old man joins a gym wanting to start high-intensity training. On the Adult Pre-Exercise Screening System (APSS) Stage 1 questionnaire, he answers 'yes' to experiencing chest discomfort during exertion. Under the APSS, the trainer must refer him to his GP for medical clearance before he starts. His GP finds high blood pressure and early heart disease, so his program begins at low intensity with gradual progression.",use:"For example, if a client answers 'yes' to chest pain on the APSS Stage 1 questionnaire, they must be referred to a GP for medical clearance before training. This is important because it can detect undiagnosed heart disease and prevent a cardiac event during exercise."},mist:["Saying screening 'checks if you're healthy' without explaining WHY it matters (safety, referral, individualised prescription, duty of care).","Not naming the APSS or describing its stages.","Forgetting that a 'yes' answer leads to medical clearance before training.","Ignoring screening by professionals (blood pressure, body composition, ECGs for elite athletes)."]},t2:{ex:{title:"The Yo-Yo test in team sports",text:"The Yo-Yo intermittent recovery test is widely used in team sports such as AFL, football and rugby league. Players run 20 m shuttles at increasing speeds with 10 seconds of active recovery between them, which closely matches the stop-start demands of a game. Coaches use results to compare players, set conditioning targets and track fitness across the season. For a recreational participant, a simpler and safer test such as a 2 km walk or the beep test might be used instead.",use:"Elite team-sport athletes often complete the Yo-Yo intermittent recovery test because it replicates the repeated sprints of a game, giving valid data for selection and conditioning. In contrast, recreational participants benefit more from simple, safe tests that build motivation, such as a timed 2 km walk."},mist:["Describing tests without discussing their use. Discuss needs advantages, limitations and a position.","Treating recreational and elite testing as the same. Purpose, safety and precision differ.","Forgetting validity and reliability.","Ignoring the link to health and participation for recreational people (motivation, goal setting)."]},t3:{ex:{title:"From test results to a program",text:"A 400 m runner completes a 40 m sprint, a 300 m time trial and a lactate threshold test. The results show excellent speed, but a large drop-off in the final 100 m of the time trial. The coach identifies lactate tolerance as the weakness and adds anaerobic intervals, such as 6 \xD7 300 m at about 90% effort with short recovery, while maintaining speed work. The athlete is re-tested after six weeks to check the program is working.",use:"For example, if a 400 m runner's time trial shows a large drop-off in the final 100 m, the coach can identify poor lactate tolerance and prescribe anaerobic intervals. This shows how assessment allows the program to target the athlete's specific weakness."},mist:["Explaining fitness tests without linking the results to program design.","Forgetting the cycle: screen, assess, analyse, set goals, prescribe, re-test.","Not giving a specific athlete and a specific program change.","Forgetting that tests set intensity (e.g. % of 1RM, heart rate zones)."]},t4:{ex:{title:"HIIT for a rugby league player",text:"Rugby league players make repeated high-intensity efforts, such as tackles, sprints and hit-ups, with short recoveries over 80 minutes. A session of 10 \xD7 40 m sprints with 20 seconds of recovery trains the ATP-PC and anaerobic glycolysis systems, while also improving aerobic recovery between efforts. This closely matches game demands, making HIIT highly relevant for the sport.",use:"HIIT is highly relevant for a rugby league player because sessions such as 10 \xD7 40 m sprints with 20 seconds of recovery replicate the repeated efforts of a game. This trains the anaerobic systems and improves recovery between efforts, so the player can keep making tackles late in the game."},mist:["Describing training methods without assessing their relevance to a named sport.","Not making a judgement (e.g. 'highly relevant', 'less relevant'), which Assess requires.","Giving a method without a specific example session (sets, reps, rest).","Not linking the method to the energy systems and fitness components the sport needs."]},t5:{ex:{title:"Progressive overload for a runner and a lifter",text:"A runner preparing for a half marathon increases weekly distance by about 5\u201310% per week, from 30 km to 33 km to 36 km, with an easier recovery week every fourth week. A weightlifter completes 3 \xD7 8 squats at 80 kg; once all reps are completed with good technique, the load increases to 82.5 kg. In both cases the body is gradually and progressively challenged, but increasing load too quickly would raise the risk of injury and overtraining.",use:"For example, a runner applies progressive overload by increasing weekly distance by about 5\u201310%, while a weightlifter adds load once all prescribed reps are completed. Both are effective, but overload must be gradual, as increasing load too quickly leads to overtraining and injury."},mist:["Defining the principles without applying them to BOTH aerobic AND strength training.","Not evaluating. Say how effective each principle is, and its limitations or risks.","Forgetting training thresholds (aerobic: 70\u201385% of max HR; strength: high % of 1RM).","Giving examples without numbers (sets, reps, % of 1RM, heart rate zones, distance)."]},t6:{ex:{title:"Sprinter vs marathon runner",text:"A marathon runner's training produces mainly aerobic adaptations: a larger left ventricle and higher stroke volume, a lower resting heart rate (often under 50 bpm), more capillaries and mitochondria, and a higher VO2 max. A 400 m sprinter's training produces more anaerobic and muscular adaptations: hypertrophy of fast-twitch fibres, greater force production and better tolerance of lactate. The principle of specificity explains why the same body adapts so differently.",use:"Because of the principle of specificity, a marathon runner's aerobic training increases stroke volume and VO2 max, so they can sustain race pace for longer. Whereas a sprinter's training causes hypertrophy of fast-twitch fibres, which increases force and speed."},mist:["Listing adaptations without explaining the mechanism (HOW it happens).","Not linking each adaptation to improved performance.","Missing the first link in the chain: which principle of training caused the adaptation.","Confusing stroke volume and cardiac output (Q = SV \xD7 HR)."]},t7:{ex:{title:"Tennis vs netball sessions",text:"A tennis coach can design a session entirely around one player: a warm-up targeting their shoulder and footwork, one-on-one feedback on their second serve, and conditioning matched to their own heart rate zones. A netball coach must plan for twelve players in different positions: a team warm-up such as the KNEE program, positional skill stations (shooters, mid-courters, defenders), game-based conditioning and set plays that need the whole team to communicate.",use:"Whereas a tennis coach can give one-on-one feedback on a single player's serve, a netball coach must organise skill work into positional groups, because players such as goal shooters and wing defences need different skills. This makes group-session design more complex."},mist:["Describing each session separately instead of comparing them side by side.","Covering only some of the aspects (health and safety, aim, warm-up/cool-down, skill, conditioning, tactics, reflection).","Forgetting similarities. Compare needs both.","Not naming specific sports."]},t8:{ex:{title:"A swimmer's taper vs an AFL season",text:"A 200 m swimmer builds the year around one or two major meets. Before the national championships, they taper by cutting training volume by about 40\u201360% over 1\u20133 weeks while keeping intensity high, so they peak on a single day. An AFL player has a 12\u201316 week pre-season, then a long in-season of about 24 rounds. They cannot peak every week, so the aim is to maintain performance and manage fatigue, with a small taper before finals.",use:"Whereas a swimmer tapers by reducing volume by about 40\u201360% to peak for a single meet, an AFL player must maintain performance across a 24-round season, so peaking is replaced by careful load management until finals."},mist:["Describing the phases without comparing the two sports.","Forgetting peaking and tapering, the key difference markers look for.","Not naming the sub-phases (general/specific preparation, competition, transition).","Ignoring sport-specific fitness and skill emphasis."]},t9:{ex:{title:"A golfer's putting routine",text:"In golf putting, optimal arousal is low because the skill needs fine motor control and concentration. Many professional golfers use the same pre-shot routine every time: a deep breath, two practice strokes, a look at the hole and a cue word such as 'smooth'. The routine narrows attention onto the task and controls anxiety, so the golfer performs consistently under pressure.",use:"For example, golfers use a consistent pre-shot routine with deep breathing and a cue word to keep arousal low, which reduces muscle tension and improves accuracy. In contrast, a rugby forward may use energising music and self-talk to raise arousal before a game."},mist:["Defining arousal and anxiety without investigating how strategies are applied.","Using the same strategy for every athlete. Optimal arousal depends on the skill and position.","Forgetting the inverted-U hypothesis.","Covering only individual sports. The dot point asks about individual AND group sports, and participation too."]}},UP_D={t10:{ex:{title:"Protecting a lead late in a game",text:"A soccer team leading 1\u20130 with ten minutes left may switch from a high-pressing strategy to a deep defensive block, bringing on an extra defender and slowing the game down. The game situation, the score, time remaining, player fatigue and the opponent's need to attack all influence this tactical change. In contrast, a tennis player who notices an opponent tiring may change tactics instantly, by using drop shots to make them run, without needing to communicate with anyone.",use:"For example, a soccer team leading late in a game may switch to a defensive formation, showing how the game situation influences tactics. However, in a group sport this change must be communicated to every player, whereas a tennis player can adapt immediately."},mist:["Mixing up strategies (plans made before the game) and tactics (actions during the game).","Listing factors without discussing how they apply differently to individual and group sports.","Not reaching a position. Discuss needs a conclusion, e.g. about the importance of flexibility.","Giving examples that are too general. Name the sport and the specific tactic."]},t11:{ex:{title:"Carbohydrate loading for a marathon",text:"Sports Dietitians Australia and the AIS recommend that endurance athletes competing for longer than 90 minutes carbohydrate load. For 36\u201348 hours before the event, they increase carbohydrate intake to about 10\u201312 g per kg of body mass per day while tapering training. This maximises muscle glycogen stores, delaying fatigue ('hitting the wall'). A weightlifter, whose events last seconds and rely on the ATP-PC system, gains no benefit from carbohydrate loading and focuses on protein for muscle repair.",use:"Research from Sports Dietitians Australia shows that a marathon runner should carbohydrate load with about 10\u201312 g/kg per day for 36\u201348 hours before the race to maximise glycogen stores. In contrast, a weightlifter relies on the ATP-PC system, so their priority is protein, at about 1.6\u20132.0 g/kg per day, to support muscle repair."},mist:["Not using research. The dot point says 'using research', so name sources such as the AIS or Sports Dietitians Australia and give g/kg figures.","Covering only one type of athlete. Analyse needs a comparison of different sports.","Forgetting before, during AND after performance, and fluid intake.","Giving amounts without explaining why they differ (energy systems, event duration)."]},t12:{ex:{title:"Sleep and injury risk",text:"Research on adolescent athletes found that those who slept fewer than 8 hours per night were significantly more likely to be injured than those who slept 8 hours or more. Sleep is when growth hormone is released and tissues are repaired, and a lack of sleep slows reaction time and impairs decision-making. Elite teams now monitor sleep with wearables, plan travel to protect sleep, and educate athletes about screen use before bed.",use:"For example, adolescent athletes who sleep fewer than 8 hours a night have a significantly higher injury risk, because sleep deprivation slows reaction time and limits tissue repair. This is why elite teams plan sleep routines and monitor sleep with wearables."},mist:["Describing sleep, nutrition and hydration without explaining HOW each reduces fatigue or prevents injury.","Forgetting guidelines (e.g. 8\u201310 hours of sleep, replacing 125\u2013150% of fluid lost).","Leaving out planning, routines and monitoring, which the dot point specifically includes.","Treating the three separately without showing how they interact."]},t13:{ex:{title:"Contaminated supplements",text:"Supplements are not tested as strictly as medicines, and some have been found to contain substances on the World Anti-Doping Agency's Prohibited List that are not listed on the label. Under strict liability, the athlete is responsible for anything found in their body. This is why Sport Integrity Australia advises athletes to use only batch-tested products and to follow the AIS Sports Supplement Framework, which rates supplements by the strength of evidence.",use:"However, supplements carry the risk of contamination with banned substances, and under strict liability athletes are responsible for any positive test. This is why the AIS recommends a 'food first' approach and only batch-tested Group A supplements such as caffeine and creatine."},mist:["Discussing only benefits. Discuss needs risks too (side effects, contamination, cost).","Forgetting the AIS Sports Supplement Framework and the 'food first' approach.","Claiming creatine helps endurance athletes. Its benefit is for repeated high-intensity efforts.","Leaving out doses and timing for caffeine (3\u20136 mg/kg) and creatine (loading, then 3\u20135 g/day)."]},t14:{ex:{title:"Summation of force in a basketball jump shot",text:"In a jump shot, force is generated sequentially from the largest to the smallest body parts: the legs drive upwards, then the hips and trunk extend, then the shoulder, elbow, wrist and fingers release the ball. When each segment is timed to accelerate as the previous one reaches peak speed, maximum force is transferred to the ball with minimal effort. Coaches use slow-motion video to find breaks in this sequence.",use:"For example, applying summation of force in a basketball jump shot means generating force from the legs through the trunk to the wrist in sequence. This allows a player to shoot from long range efficiently, without overloading the shoulder."},mist:["Naming biomechanical principles without explaining how they make movement more efficient.","Not applying the principles to a specific sport and skill.","Forgetting the link to sustained movement and injury prevention.","Leaving out how biomechanics is used in practice (e.g. video analysis, force plates)."]},t15:{ex:{title:"Cold water immersion after a match",text:"Many NRL and AFL clubs use cold water immersion (CWI) after games: players sit in water at about 10\u201315 \xB0C for 10\u201315 minutes. The cold causes blood vessels to constrict, which reduces inflammation and swelling, and the water pressure helps clear metabolic waste. Research shows CWI reduces muscle soreness and perceived fatigue in the days after a match, which is valuable with only 5\u20137 days between games.",use:"Cold water immersion is justified for weekly team-sport competition because sitting in water at 10\u201315 \xB0C for 10\u201315 minutes reduces inflammation and muscle soreness. This allows players to return to quality training sooner and sustain performance across the season."},mist:["Describing recovery strategies without justifying them. Give the mechanism and the evidence.","Covering only physiological strategies. The dot point includes psychological strategies (relaxation).","Not linking recovery to sustained movement and performance over a season.","Giving no specific protocol (temperature, duration, timing)."]},t16:{ex:{title:"GPS load monitoring",text:"Professional teams in the NRL, AFL and A-League have players wear GPS units in training and games. These record total distance, high-speed running and accelerations. Sports scientists compare a player's recent (acute) load with their longer-term (chronic) load. A sudden spike in this acute:chronic workload ratio is linked to a higher risk of soft tissue injury, so training is adjusted to keep players in a safer range.",use:"For example, AFL clubs use GPS units to monitor each player's training load, and reduce training when the acute:chronic workload ratio spikes. This reduces the risk of soft tissue injury, so players stay available to perform across the season."},mist:["Listing technologies without examining HOW they improve performance.","Forgetting one of the three areas: training innovations, equipment advances, recording and monitoring.","Only giving benefits. Examine issues too (cost, access, 'technological doping', data overload).","Not using specific, named examples."]},t17:{ex:{title:"Managing a hamstring strain",text:"A footballer feels a sharp pain in the back of the thigh while sprinting. The trainer assesses with TOTAPS: Talk, Observe, Touch, Active movement, Passive movement, Skill test. The player stops at active movement due to pain and is removed from play. RICER is applied for the first 48\u201372 hours, with no heat, alcohol, running or massage (No HARM). Rehabilitation progresses from gentle mobility to strength and jogging to sprinting and change of direction. The player returns only after meeting criteria such as pain-free sprinting, equal strength in both legs and medical clearance.",use:"For example, a footballer with a hamstring strain is assessed with TOTAPS, managed with RICER for 48\u201372 hours, and then progresses through rehabilitation from mobility to strength to sprinting. They return to play only once they meet clear criteria and are cleared by a physiotherapist."},mist:["Getting the TOTAPS or RICER steps out of order, or missing steps.","Forgetting the 48\u201372 hour timeframe and No HARM.","Rushing from injury to return to play without explaining progressive rehabilitation.","Not saying who is responsible for return-to-play decisions (medical staff, not the coach or athlete alone)."]},t18:{ex:{title:"The Essendon supplements case",text:"In 2012, Essendon Football Club ran a supplements program in which players were injected with substances, including one later found to be prohibited. After a long investigation, the Court of Arbitration for Sport found 34 current and former players guilty of anti-doping violations in 2016, and they were suspended. The case showed the ethical problems of coercion and duty of care, as players trusted the club, and the principle of strict liability.",use:"For example, in the Essendon supplements case, 34 players were suspended in 2016 after a club-run program used a prohibited substance. This raises ethical issues of coercion and duty of care, but also shows that strict liability holds athletes responsible regardless."},mist:["Only covering performance-enhancing drugs. The dot point includes drugs used in injury management (painkillers, anti-inflammatories, masking).","Describing health effects without discussing ethics and drug testing.","Not reaching a position. Discuss needs a conclusion.","Forgetting key terms: WADA, Sport Integrity Australia, strict liability, TUE, Athlete Biological Passport."]}},RD_STOP=new Set("a an the and or but if of to in on at by for with from into onto over under about as is are was were be been being it its this that these those their there they them he she his her we our you your i me my not no can could would should will may might must do does did do +nextR.d.replace(/\.$/,"")+".":"You're in the top range. Polish it: sharpen every link back to the question, and make sure every example is specific and accurate.",capNote,starters,scores:[["Content",covScore],["Key word",kw],["Evidence",evScore],["Terminology",termScore],["Length",Math.min(1,ratio)]].concat(m>=8?[["Structure",structScore]]:[]),hl:{cause:cause.concat(judge,comp,bal,relate).map(([p])=>p),terms:[...new Set(cover.flatMap(c=>c.hit))].filter(t=>!RD_GENERIC.has(t))},wc,target,points:cover}}const MODELS_FA1={h1:`Sociological factors are the social, economic and cultural conditions people live in, and they strongly shape the risky behaviours that drive Australia's burden of disease. Socioeconomic status (SES) is the most powerful factor. Adults in the lowest SES areas smoke daily at around three times the rate of those in the highest, and are more likely to be obese and physically inactive. This occurs because financial stress increases reliance on smoking and alcohol as coping mechanisms, while lower education reduces health literacy, so people are less able to understand and act on health information.

Peers and cultural norms also influence behaviour. For example, masculinity norms encourage young men to take risks such as drink driving and binge drinking, and to delay help-seeking, which contributes to males having higher injury and suicide mortality. Media and marketing further normalise risk, as the heavy advertising of alcohol, gambling and energy-dense foods links these products to sport and social belonging.

These factors interact and compound one another. A young man in a rural, low-SES community faces peer norms around heavy drinking, combined with limited access to GPs and mental health services, so his risk is far higher than any single factor would predict. This is reflected in the higher rates of risky drinking and preventable death in remote Australia.

The implication is that risky behaviour is socially shaped rather than purely an individual choice. Therefore, effective strategies must target the social determinants, such as education, income support, marketing restrictions and access to services, rather than relying only on telling individuals to change.`,h2:`Aboriginal and Torres Strait Islander peoples experience a life expectancy gap of about 8 years and a burden of disease about 2.3 times that of non-Indigenous Australians. This inequity is not caused by any single determinant. It results from historical, socioeconomic, environmental and sociocultural determinants interacting with one another.

The historical determinants of colonisation, dispossession from land and the Stolen Generations caused intergenerational trauma and a loss of cultural connection, which in turn leads to higher rates of psychological distress and substance use. These historical injustices also created the socioeconomic disadvantage that persists today. Lower income, employment and education reduce health literacy and the ability to afford healthy food, medicines and gap fees, so preventable conditions go untreated for longer.

Environmental determinants then compound this disadvantage. Many communities experience overcrowded housing and remoteness. Overcrowding spreads Strep A infections, which leads to acute rheumatic fever and rheumatic heart disease, and contributes to kidney disease, while remoteness means fewer GPs and specialists to detect and manage these conditions early.

Sociocultural determinants affect whether services are used at all. Experiences of racism in mainstream services reduce trust, so people delay seeking care until conditions are advanced. This is why culturally safe services such as Aboriginal Community Controlled Health Organisations (ACCHOs) achieve better engagement.

Because these determinants reinforce one another, health inequity is a chain rather than a list. Closing the gap therefore requires strategies that address housing, education, employment and culturally safe care together, led by communities themselves.`,h3:`Australia and Japan are both high-income OECD countries with universal health systems, but Japan achieves better health outcomes on several key measures.

In terms of similarities, both countries have very high life expectancy and both experience an epidemiological profile dominated by chronic disease, such as cardiovascular disease, cancer and dementia, as their populations age. Both also fund health care through a universal insurance model, with Australia's Medicare similar in purpose to Japan's national health insurance.

However, there are clear differences. Japan's life expectancy is about 84\u201385 years, whereas Australia's is about 83 years. The difference is greatest for obesity: around 4\u20135% of Japanese adults are obese, in contrast to about 30% of Australian adults. As a result, Australia experiences higher rates of type 2 diabetes and obesity-related disease. Japan also has lower rates of coronary heart disease mortality, although Japan has higher rates of stomach cancer and historically higher smoking rates among men than Australia.

These differences can be accounted for by several factors. Japan's traditional diet is lower in saturated fat and higher in fish, vegetables and soy, and portion sizes are smaller, which leads to lower obesity and cardiovascular risk. Higher levels of incidental physical activity, such as walking and using public transport, further reduce risk. Japan also funds regular workplace and community health checks, which leads to earlier detection, whereas Australia's system is more focused on treatment. In contrast, Australia's earlier and stronger tobacco control, including plain packaging in 2012, explains its lower smoking rate.

Overall, the comparison shows that Australia's health status is strong but could improve through prevention, particularly by addressing diet, obesity and inactivity.`,h4:`Cardiovascular disease (CVD) remains a leading cause of death in Australia, but its trends show a major improvement in mortality alongside a persistent burden of illness.

The most significant trend is that the age-standardised death rate from CVD has fallen by more than 80% since its peak in 1968. Despite this, CVD still causes about 1 in 4 deaths, and coronary heart disease remains the single leading cause of death for males. At the same time, prevalence remains high, with over a million Australians living with heart, stroke or vascular disease. This occurs because people now survive heart attacks and strokes, so they live longer with the condition.

Several factors have contributed to the fall in mortality. Daily smoking has declined from over 30% of adults in the 1980s to about 10%, which reduces damage to blood vessels. The improved detection and control of blood pressure and cholesterol, supported by medicines on the PBS such as statins, have lowered risk. Advances in medical technology and emergency care, such as stents, bypass surgery, defibrillators and faster ambulance response, mean more people survive acute events. Public awareness campaigns, such as the Heart Foundation's Heart Attack Warning Signs, have also led to earlier treatment.

However, the decline is now slowing, because risk factors such as obesity, physical inactivity, poor diet and diabetes remain highly prevalent. The burden is also unequal: CVD rates are higher among males, older people, Aboriginal and Torres Strait Islander peoples, people of low SES and people living in remote areas, due to greater exposure to risk factors and reduced access to care.

These trends show that treatment has succeeded in reducing deaths, but further gains depend on prevention targeting modifiable risk factors and the groups most at risk.`,h5:`Australia's population is ageing. About 17% of Australians are aged 65 and over, and this is projected to rise to around 22\u201323% by the 2060s, with people aged 85 and over the fastest-growing group. This presents significant challenges for the health system, but it also brings opportunities.

The main challenge is the rising burden of chronic disease and multimorbidity. Older people are more likely to live with several conditions, such as dementia, arthritis, coronary heart disease and diabetes, which leads to more GP visits, hospital admissions and medicines. Dementia is now a leading cause of death in Australia, and the number of people living with it is expected to roughly double by 2058. This in turn increases demand for aged care, as more people need help at home or residential care, at a time when there are workforce shortages of nurses and personal care workers. Informal carers, many of them older themselves, carry a large part of this load, which affects their own health. Together, these pressures increase health expenditure, and the Intergenerational Report projects health and aged care spending to be among the fastest-growing areas of the federal budget.

However, an ageing population also creates opportunities. Older Australians contribute their knowledge, experience and skills through paid work, as many now work longer, and they contribute billions of dollars each year through volunteering and grandparent childcare. The 'silver economy' also creates jobs and services. Furthermore, if healthy ageing is promoted, people spend more years in good health, which reduces the time spent in high-cost care.

The system is responding through strategies such as the new Aged Care Act, which puts the rights of older people at the centre, and the Support at Home program, which helps people live independently for longer. Falls prevention programs, dementia-friendly communities and the National Dementia Action Plan target the major causes of lost independence.

My investigation shows that the challenges are significant but manageable. The priority should be investing in prevention and healthy ageing now, along with a stronger aged care workforce. This would reduce future costs, while allowing Australia to benefit from the contribution older people make.`,h6:`Australia's healthcare system is effective to a large extent in providing equity of access, particularly through Medicare and the PBS. However, its effectiveness is limited for low-SES, rural and remote, and Aboriginal and Torres Strait Islander populations, who still face significant barriers.

The system's greatest strength is universal coverage. Medicare provides free treatment as a public patient in public hospitals and subsidises GP and specialist visits, so access to essential care is not determined by private insurance. Bulk billing means many people pay nothing for a GP visit, and expanded bulk billing incentives aim to increase this further. The PBS subsidises over 900 medicines, so a concession card holder pays only about $7.70 per script. The PBS Safety Net further limits costs for people with high medicine needs. These features are highly effective in reducing financial barriers, as shown by Australia's high life expectancy compared with countries without universal coverage.

However, significant weaknesses remain. Out-of-pocket costs for specialists, dental care and allied health are high, and dental care is largely excluded from Medicare, so low-income Australians are more likely to delay or skip care because of cost. Public hospital waiting lists for elective surgery mean people without private insurance can wait months, which creates a two-tier system. Rural and remote Australians face workforce shortages, so they have fewer GPs per person and must travel long distances. This contributes to their higher rates of preventable hospitalisation. For Aboriginal and Torres Strait Islander peoples, a lack of cultural safety in mainstream services reduces access even where services exist.

There are opportunities to improve equity. Telehealth and virtual care reduce the distance barrier for rural patients, ACCHOs provide culturally safe, community-controlled care, and rural workforce incentives aim to attract more doctors and nurses to regional areas.

Overall, the system is highly effective in providing universal access to hospital care and medicines. However, it is less effective in ensuring equity for disadvantaged groups, because cost, location and cultural safety remain barriers. Equity of access will improve only if these gaps are targeted directly.`,h7:`Responsibility for health in Australia is shared between three levels of government and non-government organisations (NGOs). Each contributes different funding, services and expertise, which together create a more comprehensive system.

The federal government is responsible for national policy and funding. It funds Medicare, which subsidises GP and specialist services, and the PBS, which subsidises medicines. It also regulates medicines and devices through the Therapeutic Goods Administration (TGA). Because it collects most tax revenue, it provides much of the funding that the states rely on, including a share of public hospital costs. State and territory governments deliver most hands-on services. They run public hospitals, ambulance services and community and mental health services, and they register health practitioners through national schemes. Local governments focus on the environment that shapes health. For example, they inspect food premises, manage waste and provide parks, pools and bike paths, which encourage physical activity.

Non-government organisations fill gaps and add expertise. Private hospitals and private health insurers relieve pressure on the public system by providing elective surgery. Not-for-profit organisations such as the Cancer Council fund research and run prevention campaigns, for example SunSmart, while Beyond Blue provides mental health information and support services.
